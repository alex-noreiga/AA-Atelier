openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Customer order status lookup
  - name: contact
    description: Customer contact messages
  - name: products
    description: Shop inventory (ready-to-ship items)
  - name: notify
    description: Back-in-stock notification requests
  - name: newsletter
    description: Marketing newsletter / mailing-list opt-in
  - name: checkout
    description: Stripe checkout for ready-to-ship shop items
  - name: appointments
    description: Customer appointment scheduling with atelier staff
  - name: account
    description: Customer account portal (Supabase Auth; Bearer access token)
  - name: studio
    description: >-
      Internal atelier surfaces, gated to signed-in studio staff (the same
      Supabase Auth Bearer token, plus a staff allowlist)
  - name: reviews
    description: Published customer testimonials, curated by the atelier
  - name: services
    description: The intake service catalog a custom order is placed against
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders/{orderNumber}:
    get:
      operationId: getOrderStatus
      tags: [orders]
      summary: Get order status
      description: Look up a customer's dress order status by order number
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatus"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Submit a new custom dress order
      description: Creates a new custom dress order and saves it to Notion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrderRequest"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewOrderResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderNumber}/payments/{stage}:
    post:
      operationId: createOrderPayment
      tags: [orders]
      summary: Start a payment for a custom order (deposit or balance)
      description: >-
        Creates a Stripe Checkout session for one payment stage of a custom
        order — the first deposit, the second deposit, or the final balance —
        each priced server-side from the atelier's Notion invoice, and returns
        the hosted-checkout URL for the browser to redirect to. Deposits are
        untaxed; the balance (itemized materials + labor minus the deposits
        already paid) is taxed. Fails if the stage has no amount set, is already
        paid, or — for the balance — the invoice isn't ready.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
        - name: stage
          in: path
          required: true
          description: Which payment to start.
          schema:
            type: string
            enum: [first_deposit, second_deposit, balance]
      responses:
        "201":
          description: Payment checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSessionResponse"
        "400":
          description: Nothing is due for this stage, or the invoice isn't ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderNumber}/measurement-change-requests:
    post:
      operationId: createMeasurementChangeRequest
      tags: [orders]
      summary: Request a change to an order's measurements
      description: >-
        Files a customer's request to change the measurements on an existing
        order. The customer is verified against the email on the order, and the
        request is rejected once the garment has entered production. Accepted
        requests land as a tagged row in the Notion contact-messages inbox for
        the atelier to apply — this endpoint does not itself edit the order.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMeasurementChangeRequest"
      responses:
        "201":
          description: Change request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewMeasurementChangeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: Measurements are locked because the order is in production
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderNumber}/reviews:
    post:
      operationId: createOrderReview
      tags: [orders]
      summary: Leave a post-delivery review for an order
      description: >-
        Captures a customer's review of a finished custom order — a star
        rating, a short testimonial, an optional display name and photos of the
        finished piece — once the order has reached its final (delivered) stage.
        The customer is verified against the email on the order. Accepted
        reviews land in the Notion reviews database for the atelier to curate
        (and later feature in the portfolio). Photos are uploaded ahead of time
        via POST /orders/reference-images; their file_upload ids are passed as
        photoIds.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReviewRequest"
      responses:
        "201":
          description: Review received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewReviewResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: The order has not been delivered yet, so it can't be reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderNumber}/cancellation-requests:
    post:
      operationId: createOrderCancellationRequest
      tags: [orders]
      summary: Request cancellation of a custom order
      description: >-
        Files a customer's request to cancel a custom order. The customer is
        verified against the email on the order, and the request is rejected
        once the order has already been delivered (a delivered order is a return,
        not a cancellation). Accepted requests land as a tagged row in the Notion
        contact-messages inbox for the atelier to review — this endpoint does not
        itself refund or change the order; the atelier processes the refund.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCancellationRequest"
      responses:
        "201":
          description: Cancellation request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewCancellationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: The order has already been delivered, so it can't be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /contact:
    post:
      operationId: createContactMessage
      tags: [contact]
      summary: Submit a contact message
      description: Saves a customer inquiry to the Notion contact-messages database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewContactRequest"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewContactResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /notify:
    post:
      operationId: createBackInStockRequest
      tags: [notify]
      summary: Request a back-in-stock notification
      description: >-
        Saves a customer's request to be told when a sold-out shop item is back
        in stock, to the Notion back-in-stock database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNotifyRequest"
      responses:
        "201":
          description: Request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewNotifyResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /newsletter:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Opt in to the marketing newsletter
      description: >-
        Records a customer's opt-in to the studio's marketing mailing list as a
        tagged row in the Notion contact-messages inbox (and a best-effort Client
        CRM lead), and sends a best-effort welcome email. Separate from the
        transactional-only capture: this is explicit marketing consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNewsletterRequest"
      responses:
        "201":
          description: Subscription received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewNewsletterResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List shop products
      description: >-
        Returns published, in-stock shop items from the Notion inventory
        database, grouped into cards with selectable variants.
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /colors:
    get:
      operationId: getColors
      tags: [colors]
      summary: List custom-order palette colors
      description: >-
        Returns the studio's color palette for the custom-order intake form's
        color picker. The palette is an atelier-editable "Studio Settings" value
        (`COLOR_PALETTE`), falling back to a built-in primary-color palette, so
        this always returns a non-empty list.
      responses:
        "200":
          description: Color palette
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColorList"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: List the services a custom order can be placed for
      description: >-
        Returns the studio's intake service catalog — bespoke commissions,
        alterations, rhinestoning, repairs — and, per service, which parts of
        the order form apply to it: whether it asks for body measurements,
        whether it offers the colour palette, and the label/prompt for its
        free-text details field (and whether that field is required). This is
        the same catalog the server enforces on `POST /orders`, so the form and
        the gate can't disagree — the counterpart of
        `GET /appointments/options` surfacing each booking type's gates. It is a
        code catalog with no configuration behind it, so it always returns a
        non-empty list.
      responses:
        "200":
          description: The intake service catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceList"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reviews:
    get:
      operationId: getPublishedReviews
      tags: [reviews]
      summary: List published customer testimonials
      description: >-
        Returns the reviews the atelier has curated for public display: only
        rows whose Status is the published option AND whose author consented to
        publication. Read-only and anonymous — no email or order number is ever
        returned. When the reviews database is not configured the list is empty
        rather than an error, so a site that never collected a review simply
        shows no testimonials.
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of testimonials to return, newest first. Defaults to
            12 when omitted.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Published testimonials, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewList"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /checkout:
    post:
      operationId: createCheckoutSession
      tags: [checkout]
      summary: Create a Stripe Checkout session for shop items
      description: >-
        Validates the requested in-stock shop items against live Notion
        inventory, prices them server-side (the client never sends prices), and
        creates a Stripe Checkout session. Returns the hosted-checkout URL for
        the browser to redirect to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutSessionRequest"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: One or more items are not purchasable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /checkout/session/{sessionId}:
    get:
      operationId: getCheckoutSession
      tags: [checkout]
      summary: Get a checkout session's status
      description: >-
        Returns the payment status of a Stripe Checkout session, used by the
        post-purchase success page to confirm the order.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionStatus"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /shop-orders/{orderNumber}:
    get:
      operationId: getShopOrderStatus
      tags: [checkout]
      summary: Look up a shop order's fulfilment status
      description: >-
        Returns the current fulfilment status of a ready-to-wear shop order by
        its human-readable order number (issued at checkout), along with the
        live list of possible statuses so the client can render a timeline.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shop order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrderStatus"
        "404":
          description: No shop order with that number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
  /shop-orders/{orderNumber}/cancellation-requests:
    post:
      operationId: createShopOrderCancellationRequest
      tags: [checkout]
      summary: Request cancellation of a shop order
      description: >-
        Files a customer's request to cancel a ready-to-wear shop order. The
        customer is verified against the email on the order. Accepted requests
        land as a tagged row in the Notion contact-messages inbox for the atelier
        to review — this endpoint does not itself refund or change the order; the
        atelier processes the refund.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCancellationRequest"
      responses:
        "201":
          description: Cancellation request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewCancellationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No shop order with that number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /shop-orders/{orderNumber}/return-requests:
    post:
      operationId: createReturnRequest
      tags: [checkout]
      summary: Request a return or exchange for a shop order
      description: >-
        Files a customer's request to return or exchange a ready-to-wear shop
        order. The customer is verified against the email on the order. Accepted
        requests land as a tagged row in the Notion contact-messages inbox for
        the atelier to review and action — this endpoint does not itself refund
        or edit the order.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReturnRequest"
      responses:
        "201":
          description: Return/exchange request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewReturnResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No shop order with that number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments/options:
    get:
      operationId: getAppointmentOptions
      tags: [appointments]
      summary: List bookable appointment types
      description: >-
        Returns the appointment types a customer can book — each with its
        duration, the staff who offer it, and the locations it's available in —
        plus the atelier's booking timezone. Drives the booking form's pickers.
      responses:
        "200":
          description: Booking options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentOptions"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments/availability:
    get:
      operationId: getAppointmentAvailability
      tags: [appointments]
      summary: List open appointment slots
      description: >-
        Returns the open start times for the given appointment type, location,
        and (optionally) staff member over a date window, computed from each
        staff member's configured working hours minus their Google Calendar
        free/busy. Slot times are UTC instants to be rendered in the returned
        timezone.
      parameters:
        - name: typeId
          in: query
          required: true
          schema:
            type: string
        - name: location
          in: query
          required: true
          schema:
            type: string
            enum: [in-person, virtual]
        - name: staff
          in: query
          required: false
          description: A specific staff member's name; omit for no preference.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: >-
            First day of the window as YYYY-MM-DD in the atelier timezone.
            Defaults to today.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: days
          in: query
          required: false
          description: Number of days in the window. Defaults to 14.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentAvailability"
        "400":
          description: Unknown or unavailable type/location/staff combination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: >-
            Scheduling is temporarily unavailable — the working-hours Google
            Sheet could not be read (a transient Google outage) and no cached
            copy was available. Retriable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments:
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Book an appointment
      description: >-
        Books an open slot for a customer. The server re-validates the type,
        location, and staff, re-checks that the slot is still free (all derived
        server-side, never trusting the client), writes the appointment as a
        Google Calendar event (inviting the customer, with a Meet link for
        virtual), and emails a confirmation. Fails if the slot is no longer
        available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAppointmentRequest"
      responses:
        "201":
          description: Appointment booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewAppointmentResponse"
        "400":
          description: Validation error or the slot is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: >-
            Scheduling is temporarily unavailable — the working-hours Google
            Sheet could not be read (a transient Google outage) and no cached
            copy was available. Retriable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments/manage:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Look up a booked appointment for self-service management
      description: >-
        Returns the current details of a booked appointment, identified by the
        signed token embedded in the "manage your appointment" link the
        confirmation email carries. Read live from Google Calendar, so it
        reflects the latest state (including a cancellation). Drives the
        reschedule / cancel page.
      parameters:
        - name: token
          in: query
          required: true
          description: The signed token from the manage link.
          schema:
            type: string
      responses:
        "200":
          description: The appointment's current details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentDetails"
