  /studio/access:
    get:
      operationId: getStudioAccess
      tags: [studio]
      summary: Whether the caller may use the studio dashboard
      description: >-
        A cheap "am I staff?" probe, so the app can offer a way in to `/studio`
        without every signed-in customer being shown a link that would refuse
        them. It runs the SAME gate as the figures below — allowlisted email
        plus (by default) a session established with Google — so a 200 here and
        a 200 there can't disagree: 401 when the caller isn't signed in, 404
        when they are but aren't staff (the dashboard doesn't exist as far as
        they're concerned), 403 when they are staff but didn't sign in with
        Google. It reads nothing and aggregates nothing; reaching the handler at
        all IS the answer.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller is studio staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioAccess"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy). Unlike the 404 below there is something to act on,
            and only someone already holding that mailbox can provoke it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account. Deliberately the same answer a
            URL that doesn't exist gets: the dashboard is unlinked and noindexed,
            so a 403 here would only confirm to a customer that it is there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
