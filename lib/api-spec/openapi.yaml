  /studio/tools/{tool}:
    post:
      operationId: runStudioTool
      tags: [studio]
      summary: Run an internal atelier tool
      description: >-
        Runs one of the atelier's internal actions — milestone reconciliation,
        invoice line-item generation, a flat service quote, an order
        status-change email, a cancellation refund, a return refund, or a
        back-in-stock alert — from the signed-in studio dashboard. Most were previously triggered by
        opening a link that carried a shared secret in its query string; the
        work is unchanged, the authorization is not: this requires the same
        Supabase access token as the rest of the studio surface, with the
        caller's email on the staff allowlist. 401 when not signed in, 404 when
        signed in but not staff, 403 when staff but not signed in with Google.

        Every tool is idempotent — a repeat run reports `noop` rather than
        doing the work twice — but two of them move money, so the dashboard
        confirms before calling those.
      security:
        - bearerAuth: []
      parameters:
        - name: tool
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/StudioTool"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioToolRequest"
      responses:
        "200":
          description: The tool ran; the body describes what it did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioToolRun"
        "400":
          description: >-
            An argument the tool needs is missing or invalid, or the order isn't
            in a state the tool can act on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy). Unlike the 404 below there is something to act on,
            and only someone already holding that mailbox can provoke it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No order matches the supplied order number (or, for
            `restock-alert`, no shop piece matches the supplied name) — or the
            caller isn't a studio account, which answers identically by design
            (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/shipments/options:
    get:
      operationId: getShippingOptions
      tags: [studio]
      summary: What the label panel can do, and what's stopping it
      description: >-
        The studio's packaging sizes, its ship-from address, and whether a label
        can be bought at all. Read before anything is asked for, so an unset
        vendor token or a half-filled ship-from address is said plainly on the
        panel rather than surfacing as an opaque carrier rejection at the point
        of sale.


        Reports rather than throws: both failures are states only a human can
        clear, and a panel that errors on load can't tell anyone which one it
        is. `problems` is empty when the panel is ready to use.


        `testMode` is load-bearing rather than diagnostic. A test label has a
        tracking number, a PDF and a price, and no carrier has ever heard of it
        — an atelier who sticks one on a parcel finds out when the customer
        doesn't get their dress.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The panel's readiness and the packaging catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingOptions"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: A studio account whose session wasn't established with Google
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The caller isn't a studio account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/shipments/rates:
    post:
      operationId: getShippingRates
      tags: [studio]
      summary: What it would cost to post one shop order
      description: >-
        Quotes a parcel for one shop order across the carriers the studio has
        connected. Reads and quotes; buys nothing — the purchase is the separate
        operation below, because a label has a carrier, a service level and a
        price, and the difference between two of them is three days and eleven
        dollars. A one-press "buy the cheapest" would put a ground label on a
        dress needed on Saturday.


        The ship-to address comes from the order's **Stripe checkout**, never
        from the one-line `Shipping Address` on the Notion order: that line was
        assembled for a human to read, and parsing it back into components is
        guesswork that ends in a parcel not arriving. It is returned as envelope
        lines so a wrong address is caught by eye before it is paid for.


        Rates come back cheapest first, and an empty list is a legitimate answer
        — no connected carrier will take this parcel to this address — with the
        carrier's own explanation in `notes`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingRatesRequest"
      responses:
        "200":
          description: The quoted rates, cheapest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingRates"
        "400":
          description: >-
            The parcel size isn't one of the studio's, the weight is missing or
            implausible, or the order number isn't a shop order's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: A studio account whose session wasn't established with Google
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No shop order matches that number — or the caller isn't a studio
            account, which answers identically by design
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: >-
            Nothing is wrong with the request, but this order can't be posted:
            no vendor is connected, the studio's ship-from address is
            incomplete, the order is cancelled or being collected in person, or
            it wasn't paid through the website and so has no address on file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/shipments/label:
    post:
      operationId: buyShippingLabel
      tags: [studio]
      summary: Buy a chosen rate as a label
      description: >-
        Buys the rate the atelier picked and writes its carrier, tracking number
        and tracking URL onto the shop order — the three columns that were the
        last thing on an order still copied by hand from a second website into a
        third. Everything downstream already reads them, so the customer's
        tracking page fills itself.


        **This spends money and is not idempotent at the vendor**, which is why
        the ORDER is the guard: one that already carries a tracking number is
        refused with 409 unless `replace` is set, which the dashboard confirms.


        `recorded: false` means the label was bought and Notion refused the
        write. The response still carries the tracking number and the label URL,
        because throwing would lose a label the studio has already paid for —
        the purchase outranks its bookkeeping. The dashboard says to paste the
        number onto the order by hand.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyShippingLabelRequest"
      responses:
        "200":
          description: The label was bought; `recorded` says whether the order took it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedLabel"
        "400":
          description: >-
            No rate was chosen, the order number isn't a shop order's, or the
            carrier rejected the purchase (an expired rate, an unconnected
            carrier account)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: A studio account whose session wasn't established with Google
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No shop order matches that number — or the caller isn't a studio
            account, which answers identically by design
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: >-
            The order already has a label on it (and `replace` wasn't set), or
            it can't be posted for one of the reasons the rate operation lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/materials:
    get:
      operationId: getStudioMaterials
      tags: [studio]
      summary: Materials at or below their reorder point
      description: >-
        The atelier's materials inventory, split into what needs buying and what
        isn't being watched. The reorder points, the stock-on-hand formula and a
        restock-alert formula have existed in Notion since before the app did;
        this is the read that puts them somewhere they'll be seen.


        The trip is re-derived server-side from `Stock on Hand` vs
        `Minimum Stock` rather than read off the atelier's own restock-alert
        formula: a formula derived from rollups can't be filtered on through the
        Notion API, and its rendered value is display wording nobody promised to
        keep. Deriving it also yields the `shortfall` the list is ranked by.


        Two things are deliberately never alerts. A material whose stock formula
        produced no number is `stock-unknown` in `untracked` — absent is not
        zero, and "we have never counted" is not a reason to reorder. A material
        the atelier has muted is in neither list and only counted, so the numbers
        still add up.


        Same staff gate as the rest of the studio surface: 401 when not signed
        in, 404 when signed in but not staff, 403 when staff but not signed in
        with Google.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: What to reorder, and what isn't being watched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialsOverview"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account — the same answer a URL that
            doesn't exist gives.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/reviews:
    get:
      operationId: listStudioReviews
      tags: [studio]
      summary: The review moderation queue
      description: >-
        Every review the atelier hasn't decided on yet, plus the ones it has,
        newest first — the read half of the loop the app has only ever written
        to. A review is captured at delivery with its Notion `Status` set to
        "New" and had to be promoted by hand in Notion for the site to show it;
        this is that same decision, made where the rest of the studio work
        happens.


        The three moderation states are DERIVED from the `Status` select rather
        than enumerated from it: `published` and `rejected` name the two values
        the app writes, and everything else — "New", a blank select, or any
        value the atelier invented — reads as `pending`. So an unrecognized
        status asks for a decision rather than silently publishing.


        Photos are fetched only for the pending rows (they are what a decision
        is made on) and their URLs are short-lived Notion-signed links, good for
        this page load and not for storing. Same staff gate as the rest of the
        studio surface: 401 when not signed in, 404 when signed in but not
        staff, 403 when staff but not signed in with Google.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The queue, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioReviewList"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account — the same answer a URL that
            doesn't exist gets (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/guides:
    get:
      operationId: getStudioGuides
      tags: [studio]
      summary: The atelier's how-to guides, each next to what it describes
      description: >-
        The studio procedures the code can't perform — how an invoice is
        actually built, when milestones are reconciled, how a refund is decided
        — written up as HTML files the atelier uploads to a Notion database and
        rendered here beside the tool or panel each one is about.


        The point of the arrangement is that a guide is revised by replacing the
        file, not by a deploy. So the app stores nothing: it reads the rows.


        This lists what the guides ARE and where they go; it does not carry
        their content. A guide's markup is fetched one at a time from
        `/studio/guides/{guideId}` when that guide is opened, because inlining
        every guide here would put the studio's whole manual in one response —
        past the serverless payload limit at a handful of screenshot-heavy
        guides, taking the small guides down with the large ones.


        The `section` says where the dashboard puts it, resolved from the row's
        `Section` against the served `sections` vocabulary — anything
        unrecognized (or blank) resolves to `general` and the guide is still
        shown, because a guide filed under a name nobody recognized is a guide
        the atelier wrote and would otherwise never see.


        A row that can't produce markup is listed anyway, with `unavailable`
        saying why rather than silently vanishing — the same reasoning as the
        materials panel's untracked list. The reasons visible without a download
        are decided here, so a broken guide reads as broken before it is
        opened.


        Same staff gate as the rest of the studio surface: 401 when not signed
        in, 404 when signed in but not staff, 403 when staff but not signed in
        with Google.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The guides, and where each one belongs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioGuideList"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account — the same answer a URL that
            doesn't exist gives.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/guides/{guideId}:
    get:
      operationId: getStudioGuideContent
      tags: [studio]
      summary: One guide's markup
      description: >-
        Downloads the HTML file attached to one guide row and returns its markup
        exactly as the atelier wrote it. Called when a guide is opened, so a
        dashboard nobody reads a guide on downloads nothing at all — and so one
        slow file can't stall the listing.


        `html` is unmodified and is NOT sanitized server-side. It is rendered in
        a sandboxed frame that grants neither scripts nor same-origin access,
        which is what makes serving markup nobody reviewed safe on an origin
        holding a signed-in staff session. A sanitizer would buy no safety the
        sandbox doesn't already give while silently mangling the atelier's own
        markup.


        Only a file UPLOADED to Notion is fetched. A pasted external link is
        reported as `not-uploaded` and never requested, because the server
        returns what it downloads and anyone with edit access to the database —
        a Notion permission, not studio staff membership — could otherwise
        choose the address.


        Same staff gate as the rest of the studio surface: 401 when not signed
        in, 404 when signed in but not staff, 403 when staff but not signed in
        with Google.
      security:
        - bearerAuth: []
      parameters:
        - name: guideId
          in: path
          required: true
          schema:
            type: string
          description: The guide's id, as returned by the list operation.
      responses:
        "200":
          description: The guide's markup, or why there is none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioGuideContent"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No such guide — or the caller isn't a studio account, which answers
            identically by design (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/reviews/{reviewId}/status:
    put:
      operationId: setStudioReviewStatus
      tags: [studio]
      summary: Publish, reject, or re-queue a review
      description: >-
        Writes one review's moderation decision to its Notion `Status`.
        `published` is what puts a testimonial on the site, `rejected` takes it
        off (and keeps it out of the queue), and `pending` returns it to the
        queue — so a decision made in error is undone the same way it was made.


        Publishing requires the customer's own consent to publish, which the
        atelier cannot supply: without it the request is refused with 409 rather
        than writing a status the site would then decline to honour. Consent is
        on the review (`consentToPublish`), so the dashboard can say so before
        the button is pressed.
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
          description: The review's id, as returned by the list operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewStatusRequest"
      responses:
        "200":
          description: The review as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioReview"
        "400":
          description: Not a status a review can be moved to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No such review — or the caller isn't a studio account, which answers
            identically by design (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: >-
            Asked to publish a review the customer didn't consent to publishing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/settings:
    get:
      operationId: getStudioSettings
      tags: [studio]
      summary: Every studio setting, and where its value comes from
      description: >-
        The settings the atelier can retune live, each resolved the way the app
        itself resolves it: the Notion "Studio Settings" row first, then the
        environment variable of the same name, then the built-in default.


        The settings database is a free-text key/value table, and both halves of
        a row fail silently when they are wrong. A mistyped KEY is a row nothing
        reads. A mistyped VALUE is parsed, rejected, and replaced by the
        built-in default. In Notion both look exactly like a setting in force,
        which is what this read exists to end: `source` names which of the three
        is actually being used, `ignoredValue` names a configured value the app
        can't use, and `unknownRows` lists the rows that aren't settings at all,
        with the key each was probably meant to be.


        Note the resolution order has a corner worth stating: a value present in
        Notion but unusable falls back to the DEFAULT, not to the environment —
        the environment is only consulted when Notion has nothing to say.


        Same staff gate as the rest of the studio surface: 401 when not signed
        in, 404 when signed in but not staff, 403 when staff but not signed in
        with Google.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every setting, resolved, plus any row that isn't one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSettingsOverview"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account — the same answer a URL that
            doesn't exist gets (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/settings/{key}:
    put:
      operationId: setStudioSetting
      tags: [studio]
      summary: Save or clear one studio setting
      description: >-
        Writes one setting's value to its Notion row, creating the row when the
        key doesn't have one yet.


        The value is validated against the setting before it is written, which is
        the difference between this and typing into the Notion table: there, a
        value the app can't use saves happily and is then ignored forever. The
        write guard is allowed to be stricter than the runtime — a rush rate of
        `15` (meaning 15%) parses fine and would price a 1500% surcharge, so the
        editor refuses it even though the runtime would accept it.


        An empty value is a CLEAR, not a rejection: it hands the setting back to
        its environment variable or built-in default, and keeps the row, which
        documents the key. There is deliberately no delete.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: >-
            The setting's key — the same name as its environment variable, as
            returned by the list operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioSettingRequest"
      responses:
        "200":
          description: The setting as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSetting"
        "400":
          description: >-
            Not a setting the app reads, or not a value that setting can take.
            The message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The caller isn't a studio account, which answers identically to a URL
            that doesn't exist by design (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: >-
            There is no Studio Settings database connected, so there is nowhere
            to write. The settings are environment-only until one is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/appointment-staff:
    get:
      operationId: getAppointmentStaffing
      tags: [studio]
      summary: Which staff member offers which appointment type
      description: >-
        The studio's appointment staffing: for every bookable type, who
        currently performs it, and who the built-in catalog would put on it if
        nothing were set.


        This is the routing the slot calculator uses — it only ever offers a
        type's assigned staff — so it decides both which times a customer is
        shown and which bookings the server will accept. Everything else about a
        type (its length, where it can be held, whether it needs an order behind
        it) is fixed in code and returned here as context, not as something to
        edit.


        Same staff gate as the rest of the studio surface: 401 when not signed
        in, 404 when signed in but not staff, 403 when staff but not signed in
        with Google.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The staffing in force, with the catalog's defaults alongside
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentStaffing"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account — the same answer a URL that
            doesn't exist gets (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: setAppointmentStaffing
      tags: [studio]
      summary: Change who offers which appointment type
      description: >-
        Reassigns the staff on one or more appointment types. Only the types
        named are changed; any left out keep the staffing they already have.


        Every type must be left with at least one person on it: a type nobody is
        assigned to still appears on the booking page and simply never offers a
        time, which is the silent failure this editor exists to prevent.
        Retiring a type is a code change, not an empty selection. A PERSON with
        no types, on the other hand, is an ordinary way to say they aren't
        taking appointments — their working hours stay on record and their
        existing bookings can still be rescheduled.


        Staffing that matches the built-in catalog exactly is stored as a blank
        value, which reads as unset — so an atelier that has never differed from
        the defaults still picks up a change to them, rather than being pinned
        to whatever they were the day Save was first pressed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentStaffingRequest"
      responses:
        "200":
          description: The staffing as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentStaffing"
        "400":
          description: >-
            An appointment type we don't offer, a name the studio doesn't book,
            or a type left with nobody on it. The message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The caller isn't a studio account, which answers identically to a
            URL that doesn't exist by design (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: >-
            There is no Studio Settings database connected, so there is nowhere
            to write the staffing. It stays the catalog's (or the environment's)
            until one is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/requests:
    get:
      operationId: listStudioRequests
      tags: [studio]
      summary: The open customer-request queue
      description: >-
        The customer requests waiting on the atelier — measurement changes,
        cancellations, returns and exchanges, back-in-stock asks and website
        inquiries — read back out of the shared "Website Contact Messages"
        inbox. Until this, the app only ever WROTE those rows: actioning one
        meant reading it in Notion and re-typing its order number into a tool on
        this dashboard.


        So each row carries its own `action` where one exists: the tool that
        actions it and the argument it needs, derived server-side from the
        request type next to the code that writes it. A cancellation hands its
        order number to `cancellation-refund`, a return to `return-refund`, a
        back-in-stock ask hands its item to `restock-alert`. A measurement
        change or an inquiry carries none — those are answered by hand, and
        saying so is more honest than offering a button that does nothing.


        The open list is OLDEST first: the request that has waited longest is
        the one that owes an answer. Newsletter opt-ins are deliberately absent
        — they land in the same database but are a consent record nobody
        answers, so including them makes a queue that never empties.


        Same staff gate as the rest of the studio surface: 401 when not signed
        in, 404 when signed in but not staff, 403 when staff but not signed in
        with Google.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The open requests, oldest first, plus recently closed ones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioRequestList"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account — the same answer a URL that
            doesn't exist gets (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/requests/{requestId}/state:
    put:
      operationId: setStudioRequestState
      tags: [studio]
      summary: Move a request through the inbox
      description: >-
        Writes one request's `Stage` in Notion — the resolved state the
        contact inbox has always carried. `replied` marks a request answered
        but still open, `closed` takes it off the queue, and `new` returns it,
        so a row closed in error is reopened the same way it was closed.


        A PUT rather than a POST because the whole state is sent and re-sending
        it changes nothing. This is the only thing the dashboard writes to a
        request row: the request itself is never edited, exactly as the capture
        endpoints never edit the order they concern.
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          description: The request's id, as returned by the list operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestStateRequest"
      responses:
        "200":
          description: The request as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioRequest"
        "400":
          description: Not a state a request can be moved to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No such request — or the caller isn't a studio account, which
            answers identically by design (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/newsletter:
    get:
      operationId: listNewsletterSignups
      tags: [studio]
      summary: Newsletter opt-ins and whether they reached the mailing list
      description: >-
        The marketing opt-ins captured on the site, and — read live from
        Resend — whether each one is actually on the audience the studio sends
        broadcasts to. They land in the same "Website Contact Messages"
        database as the other requests but are deliberately kept out of the
        request queue: an opt-in is a consent record nobody answers, and
        leaving them there makes a queue that never empties.


        Membership is NEVER stored as a marker on the Notion row. The audience
        is the sending list, so it is also the only honest answer to "did this
        person get added?" — a checkbox on the row could only ever say what
        someone remembered to tick, and the capture-time sync (which is
        best-effort, and silently skipped when the audience isn't configured)
        would not tick it. This is the same rule the return refunds follow with
        Stripe.


        Same staff gate as the rest of the studio surface: 401 when not signed
        in, 404 when signed in but not staff, 403 when staff but not signed in
        with Google.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The opt-ins, oldest first, with their audience status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSignupList"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account — the same answer a URL that
            doesn't exist gets (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/newsletter/{signupId}/subscribe:
    post:
      operationId: subscribeNewsletterSignup
      tags: [studio]
      summary: Add one opt-in to the Resend audience and file the row away
      description: >-
        Adds the opt-in's email to the configured Resend audience and then
        closes its Notion row, so the two halves of "I've dealt with this
        person" happen together and neither can be forgotten.


        An address Resend already holds is left alone and the row is simply
        filed away, so a repeat press is safe and a partial failure is
        retryable. That is also what keeps the studio out of anyone's
        unsubscribe: an opted-out contact is already on the audience, so
        nothing is written for them.


        It is refused (409) when the audience isn't configured — closing the
        row would then record a subscription that never happened — and when the
        row carries no address. Either can still be dismissed with the
        request-state operation instead.


        Notion is written only after Resend accepts. A failure there leaves the
        row open, which is the safe direction — an opt-in that stays in the
        list costs a second press, one that is filed away having never reached
        the audience costs a subscriber silently.
      security:
        - bearerAuth: []
      parameters:
        - name: signupId
          in: path
          required: true
          schema:
            type: string
          description: The opt-in's id, as returned by the list operation.
      responses:
        "200":
          description: The opt-in as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSignup"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No such opt-in — or the caller isn't a studio account, which
            answers identically by design (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: >-
            The audience isn't configured, or the row carries no email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Supabase Auth access token (JWT). The browser supabase-js client holds
        the session and the generated API client sends the token as
        `Authorization: Bearer <jwt>`; the server verifies it against the
        Supabase project's JWKS.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        commit:
          type: string
          description: >-
            Short git SHA of the deployed build (from VERCEL_GIT_COMMIT_SHA).
            Omitted when unknown (e.g. local dev). Lets a monitor confirm which
            build is live.
        buildTime:
          type: string
          format: date-time
          description: >-
            When the running bundle was built, injected at build time. Omitted
            when unknown. Lets a monitor flag a deploy that is unexpectedly old
            (a stale function serving a months-old build).
      required:
        - status
    OrderStatus:
      type: object
      properties:
        orderNumber:
          type: string
        orderName:
          type: string
        currentStage:
          type: string
        stages:
          type: array
          items:
            type: string
        deposits:
          type: array
          description: >-
            The custom order's staged deposits, sourced from the atelier's Notion
            invoice. One entry per deposit the atelier has set an amount for
            (first, then second); each is payable online until paid. Absent/empty
            until the atelier has created the invoice and set a deposit amount.
          items:
            $ref: "#/components/schemas/InvoiceDeposit"
        measurementsLocked:
          type: boolean
          description: >-
            True once the garment has reached the production stage at/after which
            measurements are frozen (MEASUREMENT_LOCK_FROM_STAGE). When true, a
            measurement-change request would be rejected, so the UI hides the
            request affordance.
        estimatedCompletion:
          type: string
          description: >-
            The atelier's target completion date for this custom order (the
            order's Due Date), as an ISO date (yyyy-mm-dd). A response
            pass-through, kept as a string (no format: date) so it isn't coerced
            to a Date and reserialized to a UTC timestamp. Absent until the
            atelier sets one in Notion.
        milestones:
          type: array
          description: >-
            Per-stage target completion dates from the Production Schedule,
            present once the order's milestones have been generated. One entry
            per remaining (current + upcoming) stage; completed stages have none.
            Order is not significant — match by stage name.
          items:
            type: object
            required:
              - stage
              - targetDate
            properties:
              stage:
                type: string
              targetDate:
                type: string
                description: >-
                  ISO date (yyyy-mm-dd). A pass-through string (no format: date),
                  same as estimatedCompletion.
        invoice:
          $ref: "#/components/schemas/Invoice"
        cancelled:
          type: boolean
          description: >-
            True once the atelier has cancelled the order (the `Cancelled`
            marker on the Notion order). When true the tracking page shows a
            cancelled banner and suppresses the deposit / invoice / request
            affordances. Absent/false for an active order.
        fulfilment:
          $ref: "#/components/schemas/OrderFulfilment"
      required:
        - orderNumber
        - orderName
        - currentStage
        - stages
        - measurementsLocked
        - measurementsLocked
    Invoice:
      type: object
      description: >-
        The customer's invoice for a custom order, present only once the atelier
        has itemized it and flipped the "Invoice Ready" gate. Line items and
        deposits are dollars; balanceDue is what's charged online.
      required:
        - invoiceId
        - paid
        - lineItems
        - subtotal
        - depositsCreditedTotal
        - balanceDue
      properties:
        invoiceId:
          type: string
          description: The atelier's invoice identifier (its Notion title).
        paid:
          type: boolean
          description: Whether the final balance has already been paid.
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
          description: >-
            The itemized charges (deposit lines excluded — deposits are credited
            via OrderStatus.deposits, not itemized here).
        subtotal:
          type: number
          description: Sum of the non-deposit line items, in dollars.
        depositsCreditedTotal:
          type: number
          description: Sum of the deposits already paid, in dollars.
        balanceDue:
          type: number
          description: subtotal − depositsCreditedTotal, floored at 0, in dollars.
        paymentDeadline:
          type: string
          description: The invoice's payment-due date (ISO), if the atelier set one.
    InvoiceLineItem:
      type: object
      required:
        - name
        - type
        - amount
      properties:
        name:
          type: string
          description: The line item's short name (e.g. "Main fabric").
        type:
          type: string
          description: The line type — Garment, Material, Labor, or Adjustment.
        amount:
          type: number
          description: The line total in dollars.
    InvoiceDeposit:
      type: object
      required:
        - stage
        - label
        - amount
        - paid
      properties:
        stage:
          type: string
          enum: [first_deposit, second_deposit]
          description: Which deposit this is — the payment stage used to pay it.
        label:
          type: string
          description: A display label, e.g. "First deposit".
        amount:
          type: number
          description: The deposit amount in dollars.
        paid:
          type: boolean
          description: Whether this deposit has been paid (only paid ones credit).
        sessionId:
          type: string
          description: >-
            The Stripe Checkout session id of this paid deposit, for linking to
            the on-site receipt. Present once the deposit has been paid.
    OrderNotFound:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ShopOrderStatus:
      type: object
      properties:
        orderNumber:
          type: string
        status:
          type: string
          description: The order's current fulfilment status.
        statuses:
          type: array
          description: >-
            The live ordered list of possible fulfilment statuses (read from the
            Notion "Status" workflow options), so the client can render a
            progress timeline. Never hardcode this list.
          items:
            type: string
        total:
          type: number
          description: The order total in dollars.
        cancelled:
          type: boolean
          description: >-
            True once the atelier has cancelled the shop order (the `Cancelled`
            marker on the Notion order). When true the tracking page shows a
            cancelled banner and suppresses the request affordance. Absent/false
            for an active order.
        fulfilment:
          $ref: "#/components/schemas/OrderFulfilment"
      required:
        - orderNumber
        - status
        - statuses
    OrderFulfilment:
      type: object
      description: >-
        How the finished piece reaches the customer, and everything that can be
        said about that right now. One shape for both order kinds (custom and
        shop), so the tracking page answers "where is my order?" the same way
        either side.

        `method` decides which half is filled in. A shipped order carries
        `tracking` once the atelier has entered a tracking number, and `shipBy`
        until then. A **local-pickup** order carries `pickup` instead: local
        customers collect in person, so there is no tracking number to show and
        the order must not read as though something is missing — the scheduled
        pickup time is the answer.

        Absent entirely when there is nothing yet to say (a shipped order with no
        tracking number and no ship-by date), and never present on an order the
        atelier has cancelled.
      required:
        - method
      properties:
        method:
          type: string
          enum:
            - ship
            - pickup
          description: >-
            Whether the order is being shipped or collected in person. Read from
            the atelier's `Delivery Method` select when set; otherwise inferred
            from which fields are filled in (a pickup time or location means
            pickup), defaulting to `ship`.
        state:
          type: string
          description: >-
            The atelier's own handoff state for the order (the custom order's
            `Fulfilment` select — e.g. "Packed", "Shipped"). Display-only and
            advisory: it describes the shipping/collection leg, never whether the
            order is complete — the stage/status timeline owns that. Omitted once
            the order reaches its final stage, and absent for shop orders, whose
            fulfilment state IS the timeline.
        tracking:
          type: object
          description: >-
            The carrier tracking details, surfaced once the atelier fills them in
            on the Notion order (a `Tracking Number`, an optional `Carrier` label,
            and an optional `Tracking URL`). Absent until a tracking number is
            set, and never present on a pickup order. When present the tracking
            page shows the number, linked to the URL when one is given.
          properties:
            number:
              type: string
              description: The carrier tracking number, shown to the customer.
            carrier:
              type: string
              description: An optional human carrier label, e.g. "USPS" or "UPS".
            url:
              type: string
              description: >-
                An optional carrier tracking URL; when present the number is
                rendered as a link to it.
          required:
            - number
        shipBy:
          type: string
          description: >-
            The date the atelier plans to send the order by (its `Ship By`), as an
            ISO date (yyyy-mm-dd). A pass-through string (no format: date), same
            as estimatedCompletion. Present only while the order has not shipped —
            once a tracking number exists, or the order reaches its final stage,
            the tracking is the answer and this is dropped rather than left to
            read as an overdue promise.
        pickup:
          type: object
          description: >-
            The collection details for a local-pickup order. Always present when
            `method` is `pickup`, even before a time is arranged — that the order
            is a pickup at all is itself the answer to "is there tracking?".
          properties:
            at:
              type: string
              description: >-
                When the customer is expected to collect, as the atelier entered
                it: an ISO datetime (`2026-09-03T14:00:00-05:00`) when they picked
                a time, or a bare ISO date (`2026-09-03`) when they picked only a
                day. A pass-through string — the client renders a datetime in
                `timezone` and a bare date as-is, so a date never slips a day.
                Absent until a pickup is scheduled.
            location:
              type: string
              description: >-
                Where to collect from (the studio's own address or a rink), as
                free text. The customer's own shipping address is deliberately
                never returned — this lookup is gated by order number alone.
            timezone:
              type: string
              description: >-
                The IANA zone `at` should be read in (the studio's
                APPOINTMENT_TIMEZONE), so a customer in another timezone still
                sees the studio's local time. Same contract as
                AppointmentDetails.timezone.
    NewOrderRequest:
      type: object
      required:
        - fullName
        - email
        - phone
        - preferredContact
      description: >-
        A new custom-dress order. Measurements are optional: the customer either
        supplies all five now (with a measurementUnit), or sets
        measurementAppointment=true to have them taken at a scheduled fitting or
        consultation. The server rejects a body with neither.
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
        preferredContact:
          type: string
          enum: [email, phone, text]
        service:
          type: string
          description: >-
            The id of the service being ordered, from the live `GET /services`
            catalog (a bespoke commission, alterations, rhinestoning, repairs).
            It decides which of the fields below apply and which the server
            requires: only a service whose catalog entry asks for measurements
            requires them (or a measurement appointment), and a service
            performed on a piece the customer already owns requires a
            `description`. Optional — an omitted or unknown id is treated as a
            bespoke commission, so a client that predates the catalog behaves
            exactly as before.
        waist:
          type: number
          minimum: 0
        bust:
          type: number
          minimum: 0
        hips:
          type: number
          minimum: 0
        height:
          type: number
          minimum: 0
        bodyGirth:
          type: number
          minimum: 0
        measurementUnit:
          type: string
          enum: [inches, cm]
        measurementAppointment:
          type: boolean
          description: >-
            True when the customer opted to have their measurements taken at a
            scheduled fitting or consultation instead of entering them now. When
            true the measurement fields are omitted.
        description:
          type: string
          description: >-
            Free text about the piece. For a bespoke commission these are
            optional design notes; for a service performed on a garment the
            customer already owns (alterations, rhinestoning, repairs) it is the
            brief — what the piece is and what needs doing — and the server
            requires it (see `service`).
        neededBy:
          type: string
          format: date
        rush:
          type: boolean
          description: >-
            True when the customer confirmed a rush order — a neededBy date
            inside the studio's rush window, acknowledged with the disclosed
            surcharge. Recorded on the Notion order (a "Rush Order" checkbox +
            a page note) so the atelier prices the rush surcharge into the
            invoice; the app does not compute the fee itself. Optional; omitted
            for standard-timeline orders.
        referenceImageIds:
          type: array
          items:
            type: string
          description: >-
            Notion file_upload ids for customer-supplied reference / inspiration
            images, each obtained by first POSTing the image bytes to
            POST /orders/reference-images (a binary endpoint outside this
            contract, mounted like the Stripe webhook). They are attached to the
            order's Notion page as image blocks. Optional; omitted when the
            customer uploaded none.
        colors:
          type: array
          items:
            type: string
          description: >-
            Names of the colors the customer picked from the studio palette (the
            live `GET /colors` list) — a multi-select. This is a starting point
            for the consultation, not a final spec: the atelier finalizes the
            exact fabric + finish together with the customer. Recorded on the
            Notion order for the atelier (the app never reads it back). Optional;
            omitted when the customer picked none.
        colorUsage:
          type: string
          description: >-
            The customer's free-text note on how they'd like their chosen colors
            used (e.g. "emerald as the main color with gold accents on the collar,
            and a blush skirt"). Optional; omitted when blank.
        referralCode:
          type: string
          description: >-
            An optional referral code the customer received from another skater.
            The server looks it up against the Client CRM (best-effort): a valid
            code — not the customer's own — earns the new customer a welcome
            discount code now and credits the referrer once this order is first
            paid. An unknown or self-referring code is ignored, and referral
            capture never blocks the order. Optional.
    NewOrderResponse:
      type: object
      required:
        - orderNumber
      properties:
        orderNumber:
          type: string
    NewMeasurementChangeRequest:
      type: object
      required:
        - email
      description: >-
        A request to change an order's measurements. Like a new order,
        measurements are optional: the customer either supplies all five now
        (with a measurementUnit), or sets measurementAppointment=true to be
        re-measured at a fitting/consultation. The server rejects a request with
        neither.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match the order is rejected.
        waist:
          type: number
          minimum: 0
        bust:
          type: number
          minimum: 0
        hips:
          type: number
          minimum: 0
        height:
          type: number
          minimum: 0
        bodyGirth:
          type: number
          minimum: 0
        measurementUnit:
          type: string
          enum: [inches, cm]
        measurementAppointment:
          type: boolean
          description: >-
            True when the customer would rather be re-measured at a fitting or
            consultation than enter values now. When true the measurement fields
            are omitted.
        note:
          type: string
          description: Optional free-text note explaining the requested change.
    UpdateMeasurementsRequest:
      type: object
      required:
        - email
        - waist
        - bust
        - hips
        - height
        - bodyGirth
        - measurementUnit
      description: >-
        New measurements to write onto an order in place. Every value is
        required, unlike NewMeasurementChangeRequest: a change request is read
        by a person who can reconcile it against what is on file, whereas this
        replaces the stored set outright, and a partial write would leave the
        atelier cutting to a mix of old and new numbers. There is deliberately
        no "measure me at a fitting" branch here — that asks for a service
        rather than changing a value, so it stays a change request.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match, or an order with no email stored to check
            against, is refused.
        waist:
          type: number
          exclusiveMinimum: 0
        bust:
          type: number
          exclusiveMinimum: 0
        hips:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
        bodyGirth:
          type: number
          exclusiveMinimum: 0
        measurementUnit:
          type: string
          enum: [inches, cm]
        note:
          type: string
          description: >-
            Optional free-text note for the atelier, recorded on the order's
            revision trail and carried in the notification email.
    UpdateMeasurementsResponse:
      type: object
      required:
        - outcome
      description: >-
        What became of the edit. "applied" means the values are on the order
        now and `measurements` carries the set as stored, so the caller renders
        what was written rather than its own optimistic copy. "filed" means the
        edit could not be written and was filed as a measurement-change request
        for the atelier to apply by hand — the two states the customer's work is
        never lost to: an order carrying no email to verify the edit against,
        and an orders database that hasn't had the measurement properties added
        yet. A filed edit carries no `measurements`, because nothing changed.
      properties:
        outcome:
          type: string
          enum: [applied, filed]
        measurements:
          $ref: "#/components/schemas/AccountMeasurements"
    NewMeasurementChangeResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    NewCancellationRequest:
      type: object
      required:
        - email
      description: >-
        A request to cancel an order. The email is verified against the one on
        the order; a request whose email doesn't match is rejected. An optional
        reason is passed through to the atelier for context.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match the order is rejected.
        reason:
          type: string
          maxLength: 2000
          description: Optional free-text reason for the cancellation.
    NewCancellationResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    NewReviewRequest:
      type: object
      required:
        - email
        - rating
        - comment
      description: >-
        A post-delivery review of a finished custom order. The customer supplies
        a star rating and a short testimonial; a display name, publish consent,
        and photos of the finished piece are optional. The server verifies the
        email against the order and only accepts the review once the order has
        been delivered.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A review whose
            email doesn't match the order is rejected.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The star rating, 1 (poor) to 5 (excellent).
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          description: The customer's testimonial about their finished piece.
        displayName:
          type: string
          maxLength: 120
          description: >-
            How the customer would like to be credited if the review is
            featured (e.g. "Ada L." or "Ada, Chicago"). Optional.
        consentToPublish:
          type: boolean
          description: >-
            Whether the customer gives permission to feature this review (and
            any photos) publicly, e.g. on the site's testimonials/portfolio.
            Defaults to false.
        photoIds:
          type: array
          description: >-
            Notion file_upload ids for photos of the finished piece, uploaded
            ahead of time via POST /orders/reference-images. Attached to the
            review's Notion page as image blocks.
          items:
            type: string
    NewReviewResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    PublishedReview:
      type: object
      required:
        - id
        - rating
        - comment
      description: >-
        One curated testimonial, as shown on the site. Deliberately narrow: the
        author's email, order number, and verification flag stay in Notion and
        are never served here.
      properties:
        id:
          type: string
          description: The review's Notion page id, used only as a render key.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The star rating, 1 (poor) to 5 (excellent).
        comment:
          type: string
          description: The customer's testimonial.
        customerName:
          type: string
          description: >-
            How the customer asked to be credited. Omitted when they left the
            credit blank, in which case the testimonial is shown unattributed.
        publishedAt:
          type: string
          format: date-time
          description: >-
            When the review was submitted (its Notion created time), used to
            order the list and to date the testimonial.
    ReviewList:
      type: object
      required:
        - reviews
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/PublishedReview"
    PortfolioFacetValues:
      type: object
      required:
        - id
        - values
      description: >-
        One piece's values for a single filter dimension. Modelled as an ordered
        list rather than a map so a new dimension is a server-side change with
        no contract edit, and so clients render facets in the order the server
        declares them.
      properties:
        id:
          type: string
          description: >-
            The facet's stable id, matching a `PortfolioFilter.id` in the same
            response (for example "type" or "discipline"). Never shown to the
            visitor — the filter's `label` is.
        values:
          type: array
          description: >-
            This piece's values for that dimension. A single-value dimension
            (a select) carries one entry; a multi-select carries several. Never
            empty — a piece with no value for a dimension omits the facet
            entirely rather than carrying an empty list.
          items:
            type: string
    PortfolioPiece:
      type: object
      required:
        - id
        - title
        - images
        - facets
      description: >-
        One published piece of the atelier's work. Deliberately narrow: the
        Notion row relates to the order it was made for, and neither that order
        nor the customer behind it is served here.
      properties:
        id:
          type: string
          description: The piece's Notion page id, used only as a render key.
        title:
          type: string
          description: The piece's name, as the atelier titled the row.
        images:
          type: array
          description: >-
            The piece's photographs or sketches, in the order the atelier
            arranged them; the first is the gallery cover. These are
            Notion-signed URLs that expire in about an hour, which is why this
            response's edge cache is deliberately shorter than that. Never
            empty — a row with no image is not published.
          items:
            type: string
        facets:
          type: array
          description: >-
            The piece's values for each filter dimension it has one for, in the
            server's declared facet order. Dimensions the piece carries no value
            for are omitted rather than sent empty.
          items:
            $ref: "#/components/schemas/PortfolioFacetValues"
        publishedAt:
          type: string
          format: date-time
          description: >-
            When the row was created in Notion. Omitted when Notion returned no
            created time. The gallery is ordered newest-first by the piece's
            optional "Completed" date and falls back to this when it has none —
            that completion date is a server-side sort key and is deliberately
            not served, since nothing renders it.
    PortfolioFilter:
      type: object
      required:
        - id
        - label
        - options
      description: >-
        One filter dimension offered above the gallery, with the options
        DERIVED from the published pieces rather than enumerated in code. A
        dimension no published piece carries a value for is omitted from the
        response entirely, so the chips reflect the atelier's actual work with
        no redeploy and clients must not hardcode either the options or which
        dimensions exist.
      properties:
        id:
          type: string
          description: Stable id, matching `PortfolioFacetValues.id` on the pieces.
        label:
          type: string
          description: The human label for the chip group, e.g. "Discipline".
        options:
          type: array
          description: >-
            The distinct values published pieces carry for this dimension,
            alphabetically. Always two or more — a dimension every published
            piece answers the same way filters nothing and is omitted.
          items:
            type: string
    PortfolioList:
      type: object
      required:
        - pieces
        - filters
      properties:
        pieces:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioPiece"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioFilter"
    ReviewModerationStatus:
      type: string
      enum: [pending, published, rejected]
      description: >-
        Where a review stands with the atelier. `pending` is anything not yet
        decided — including the "New" it is captured with — so a review can only
        ever be waiting, shown, or set aside.
    MaterialAlert:
      type: object
      description: A material at or below its reorder point — something to buy.
      required: [id, name, stockOnHand, minimumStock, shortfall]
      properties:
        id:
          type: string
          description: The material's Notion page id.
        name:
          type: string
          description: The material as the atelier names it.
        category:
          type: string
          description: Fabric / Applique / Crystal / Packaging / Notions. Omitted when unset.
        fabricTypes:
          type: array
          description: >-
            Which fabric(s) this is — Satin, Power Mesh, Lining, … — in the
            order the atelier holds them in Notion. A MULTI-select, so a
            material can carry several (a power mesh that is also a lining);
            the dashboard groups it under the FIRST and shows the rest as
            labels, because a shopping list you might count twice is worse
            than one where a secondary type is only a label. Omitted when
            none are tagged, which is every non-fabric material.
          items:
            type: string
        stockOnHand:
          type: number
          description: >-
            Units remaining, from the Notion stock formula. Always a number here
            — a material whose stock is unknown is never reported as an alert.
        minimumStock:
          type: number
          description: The reorder point the atelier set.
        shortfall:
          type: number
          description: >-
            How far below the reorder point it is, rounded to two places. `0`
            when it has landed exactly on it — a reorder point is the level you
            buy AT, so that still counts. The list is ranked by this.
        reorderStatus:
          type: string
          description: >-
            The atelier's `Reorder Status` — Restockable / Deadstock / Made to
            order / Discontinued / Unchecked. Omitted on the many rows that
            carry none. On `lowStock` it is a lead-time note (`Made to order`
            is a custom print or dye run); on `notRestockable` it is the reason
            the material is there.
        link:
          type: string
          description: Where to buy it again, when the atelier recorded a link.
        pricePerUnit:
          type: number
          description: Dollars per unit, when recorded.
    UntrackedMaterial:
      type: object
      description: >-
        A material no alert can ever fire for, and why — so an unwatched
        material is visible rather than the alert list just looking quiet.
      required: [id, name, reason]
      properties:
        id:
          type: string
          description: The material's Notion page id.
        name:
          type: string
        category:
          type: string
        fabricTypes:
          type: array
          description: >-
            Which fabric(s) this is — Satin, Power Mesh, Lining, … — in the
            order the atelier holds them in Notion. A MULTI-select, so a
            material can carry several (a power mesh that is also a lining);
            the dashboard groups it under the FIRST and shows the rest as
            labels, because a shopping list you might count twice is worse
            than one where a secondary type is only a label. Omitted when
            none are tagged, which is every non-fabric material.
          items:
            type: string
        reason:
          type: string
          enum: [no-reorder-point, stock-unknown]
          description: >-
            `no-reorder-point` — `Minimum Stock` is unset, so nothing can trip.
            `stock-unknown` — the stock formula produced no number (typically a
            material with no intake lines recorded yet).
        stockOnHand:
          type: number
          description: >-
            Present only for `no-reorder-point`, where the stock IS known and
            only the threshold is missing.
    GuideSection:
      type: object
      description: >-
        One place on the dashboard a guide can be filed against — the six tools,
        the panels, and `general` for everything else. Served rather than
        duplicated in the frontend so the atelier can be shown the accepted
        `Section` values verbatim, and so a renamed tool has one definition.
      required: [id, label]
      properties:
        id:
          type: string
          description: >-
            What `StudioGuide.section` carries, and what the dashboard matches
            its render points against. For a tool this is the tool's own name
            (`invoice-lines`, `return-refund`, …), so a guide sits inside that
            tool's card.
        label:
          type: string
          description: >-
            How the section reads to the atelier, and the other spelling the
            row's `Section` is accepted as (matching ignores case, spacing and
            punctuation).
    StudioGuide:
      type: object
      description: >-
        One how-to guide: a Notion row, the HTML file attached to it, and where
        on the dashboard it belongs.
      required: [id, title, section]
      properties:
        id:
          type: string
          description: The guide's Notion page id.
        title:
          type: string
          description: The guide's name, as the atelier titled the row.
        summary:
          type: string
          description: >-
            A line about what the guide covers, shown before it is opened.
            Omitted when the row carries none.
        section:
          type: string
          description: >-
            Which section id the guide renders under. Always one of the served
            `sections` — an unrecognized or blank `Section` resolves to
            `general` rather than dropping the guide.
        unavailable:
          type: string
          enum: [no-file, not-uploaded, not-html, too-large, unreadable]
          description: >-
            Why this guide has no markup to show, when that is knowable without
            downloading it: `no-file` — the row has no attachment yet;
            `not-uploaded` — the attachment is a pasted link rather than a file
            uploaded to Notion, which is never fetched; `not-html` — it isn't an
            HTML file, so rendering it as markup would be gibberish. The guide
            is listed either way, so a broken one is visible rather than absent.
            The two download-time reasons (`too-large`, `unreadable`) can only
            come back from the content operation.
        fileName:
          type: string
          description: The attached file's name, when the row has one.
        updatedAt:
          type: string
          format: date-time
          description: When the Notion row was last edited — i.e. when the guide last changed.
        notionUrl:
          type: string
          description: >-
            The guide's page in Notion, which is where the file is replaced.
    StudioGuideContent:
      type: object
      description: >-
        One guide's markup, downloaded on demand — or the reason there is none.
      required: [id]
      properties:
        id:
          type: string
          description: The guide's Notion page id.
        html:
          type: string
          description: >-
            The attached file's markup, exactly as uploaded and deliberately not
            sanitized. Absent when `unavailable` says why. It is rendered in a
            sandboxed frame granting neither scripts nor same-origin access, so
            it is never executed and never sees the studio session.
        unavailable:
          type: string
          enum: [no-file, not-uploaded, not-html, too-large, unreadable]
          description: >-
            Why there is no `html`. Beyond the three the listing can already
            report: `too-large` — the file is over the server's per-guide cap;
            `unreadable` — the download failed, timed out, or was refused.
    StudioGuideList:
      type: object
      description: >-
        Every guide the atelier has written, with the vocabulary saying where
        each may be filed.
      required: [guides, sections, configured]
      properties:
        guides:
          type: array
          description: >-
            The guides, ordered by the row's `Order` where set and by title
            otherwise. Grouping is the dashboard's job — a guide names its
            section and is rendered wherever that section lives.
          items:
            $ref: "#/components/schemas/StudioGuide"
        sections:
          type: array
          description: The sections a guide may be filed against, in dashboard order.
          items:
            $ref: "#/components/schemas/GuideSection"
        configured:
          type: boolean
          description: >-
            False when the guides database isn't wired up, in which case
            `guides` is empty and the panel says why rather than reading as
            "no guides have been written".
        unreachable:
          type: boolean
          description: >-
            True when the database id IS set but Notion answered 404 — the
            integration has not been shared with the database, or the id is
            wrong. `guides` is empty and the panel says what to fix; reported
            rather than thrown because it is a configuration state only a human
            can clear, not an outage worth erroring the panel over. Absent when
            the read worked.
        truncated:
          type: boolean
          description: >-
            True when more rows exist than the server will read in one page, so
            the dashboard can say the list is partial instead of looking
            complete.
    MaterialsOverview:
      type: object
      description: >-
        The materials panel — what to reorder, what can't be reordered, and what
        isn't being watched.
      required:
        [
          lowStock,
          notRestockable,
          untracked,
          suppressedCount,
          totalCount,
          configured,
        ]
      properties:
        lowStock:
          type: array
          description: >-
            At or below the reorder point AND buyable again, worst shortfall
            first. This is the reorder list, and the weekly digest reads it.
          items:
            $ref: "#/components/schemas/MaterialAlert"
        notRestockable:
          type: array
          description: >-
            At or below the reorder point but NOT buyable again — the atelier
            marked it Deadstock or Discontinued. Deliberately kept OUT of
            `lowStock` (and so out of the digest): there is no vendor to send
            anyone to. Kept visible because running a one-of-a-kind fabric down
            is exactly when a substitute has to be chosen. Same shape and same
            worst-first ranking.
          items:
            $ref: "#/components/schemas/MaterialAlert"
        untracked:
          type: array
          description: Not watched, and why — alphabetical.
          items:
            $ref: "#/components/schemas/UntrackedMaterial"
        suppressedCount:
          type: integer
          description: >-
            How many materials the atelier has muted. Reported so the panel can
            say so rather than the numbers silently not adding up.
        totalCount:
          type: integer
          description: Every material row read, muted ones included.
        configured:
          type: boolean
          description: >-
            False when the materials database isn't wired up, in which case the
            lists are empty and the panel says why instead of rendering an empty
            list that reads as "all good".
        unreachable:
          type: boolean
          description: >-
            True when the database id IS set but Notion answered 404 — the
            integration has not been shared with the database, or the id is
            wrong. The lists are empty and the panel says what to fix; reported
            rather than thrown because it is a configuration state only a human
            can clear, not an outage worth erroring the panel over. Absent when
            the read worked.
    StudioReview:
      type: object
      description: >-
        One review as the moderation queue shows it. Unlike the public
        `PublishedReview`, this is the whole row: the atelier is deciding
        whether to put it on the site, and who wrote it and whether their email
        matched the order are part of that judgement. Staff-only.
      required:
        - id
        - rating
        - comment
        - status
        - consentToPublish
        - emailVerified
        - photos
      properties:
        id:
          type: string
          description: The review's Notion page id; also what a decision is addressed to.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The star rating, 1 (poor) to 5 (excellent).
        comment:
          type: string
          description: The customer's testimonial, as written.
        customerName:
          type: string
          description: >-
            How the customer asked to be credited. Omitted when they left it
            blank, in which case a published testimonial is unattributed.
        orderNumber:
          type: string
          description: The order the review is for. Omitted on a row that carries none.
        email:
          type: string
          description: >-
            The address the review was submitted from. Shown so the atelier can
            recognize the customer; never served publicly.
        emailVerified:
          type: boolean
          description: >-
            Whether that address matched the one stored on the order. False on a
            legacy order that has no email stored — accepted at capture, but
            worth vetting before it goes on the site.
        consentToPublish:
          type: boolean
          description: >-
            Whether the customer agreed to their words being published. Publishing
            without it is refused, so this is what the dashboard reads to know
            whether the button can be offered at all.
        status:
          $ref: "#/components/schemas/ReviewModerationStatus"
        rawStatus:
          type: string
          description: >-
            The `Status` select exactly as Notion holds it, when it is set. Shown
            for a row whose value the app doesn't recognize, so "why is this
            still pending?" is answerable without opening Notion.
        submittedAt:
          type: string
          format: date-time
          description: When the review was submitted (its Notion created time).
        photos:
          type: array
          description: >-
            Photographs of the finished piece, as URLs. Notion-signed and
            short-lived, so they are for rendering this page and nothing else.
            Empty for a decided review — photos are fetched only for the rows
            still awaiting a decision.
          items:
            type: string
        notionUrl:
          type: string
          description: The review's page in Notion, for anything this queue doesn't show.
    StudioSetting:
      type: object
      description: >-
        One atelier-editable setting, resolved. The key is the name of its
        environment variable and of its Notion row's `Setting` title — that
        identity 1:1 across all three is what keeps them from ever meaning
        different things.
      required:
        [
          key,
          label,
          group,
          kind,
          description,
          defaultValue,
          effectiveValue,
          source,
        ]
      properties:
        key:
          type: string
          description: The setting's name, identical to its environment variable.
          example: RUSH_SURCHARGE_RATE
        label:
          type: string
          description: The setting's name in the atelier's terms.
          example: Rush surcharge
        group:
          type: string
          description: The section the editor shows this under.
          example: Orders & pricing
        kind:
          type: string
          description: >-
            What shape the value is, so the editor can render the right input and
            say what it expects.
          enum:
            [number, integer, percent, money, text, email, timezone, palette]
        description:
          type: string
          description: What the setting does, and what changing it affects.
        notionValue:
          type: string
          description: >-
            What the Notion row holds. Absent when there is no row for this key,
            or its Value is blank (which reads as unset everywhere).
        envValue:
          type: string
          description: >-
            What the environment variable holds. Absent when it isn't set. These
            are non-secret tunables by definition — secrets are deliberately not
            settings.
        defaultValue:
          type: string
          description: >-
            The built-in fallback, as text. Empty when the fallback isn't a value
            at all — an unset studio inbox means the notification is skipped, not
            sent somewhere else.
        defaultLabel:
          type: string
          description: >-
            How to phrase the fallback when `defaultValue` alone doesn't say it,
            e.g. "The studio inbox above".
        effectiveValue:
          type: string
          description: The value the app is using right now.
        source:
          $ref: "#/components/schemas/SettingSource"
        ignoredValue:
          type: string
          description: >-
            Present when a value IS configured but the app can't use it, so the
            default is in force instead. This is the silent failure the editor
            exists to surface; in Notion the row looks entirely normal.
        min:
          type: number
          description: Lower bound for a numeric setting.
        max:
          type: number
          description: Upper bound for a numeric setting.
        step:
          type: number
          description: Step for a numeric input.
        unit:
          type: string
          description: The unit shown beside the input, e.g. "days" or "%".
        placeholder:
          type: string
          description: An example value, shown when the field is empty.
    SettingSource:
      type: string
      description: >-
        Which of the three layers the effective value came from. `default` also
        covers a configured-but-unusable value (see `ignoredValue`), because
        that is what the app does with one — it does NOT fall through to the
        next layer down.
      enum: [notion, environment, default]
    UnknownSettingRow:
      type: object
      description: >-
        A row in the settings database whose key isn't a setting the app reads —
        so nothing has ever read it, and nothing ever will. Listing it is the
        only way a mistyped key is visible anywhere.
      required: [key]
      properties:
        key:
          type: string
          description: The key as typed in the Notion row.
        value:
          type: string
          description: What that row holds, when it holds anything.
        suggestion:
          type: string
          description: >-
            The setting this was probably meant to be, when one is within a typo
            or two of it. Absent when nothing is close.
    StudioSettingsOverview:
      type: object
      description: Every setting the app reads, plus any row that isn't one.
      required: [configured, settings, unknownRows]
      properties:
        configured:
          type: boolean
          description: >-
            Whether a Studio Settings database is connected. False ⇒ every value
            comes from the environment or a default and nothing can be edited
            here — which is a state only a human can clear, so the editor says so
            rather than offering a Save with nowhere to write.
        settings:
          type: array
          items:
            $ref: "#/components/schemas/StudioSetting"
        unknownRows:
          type: array
          items:
            $ref: "#/components/schemas/UnknownSettingRow"
    StudioSettingRequest:
      type: object
      description: >-
        The value to save. An empty string clears the setting, handing it back to
        its environment variable or built-in default.
      required: [value]
      properties:
        value:
          type: string
          maxLength: 2000
    StudioReviewList:
      type: object
      description: >-
        The moderation queue: the pending reviews the atelier still owes a
        decision, and the decided ones for reference, newest first in both
        cases.
      required: [pending, decided]
      properties:
        pending:
          type: array
          description: Awaiting a decision, oldest submission first — the queue proper.
          items:
            $ref: "#/components/schemas/StudioReview"
        decided:
          type: array
          description: >-
            Already published or rejected, newest first. Capped, and carrying no
            photos — it is a record of what was decided, not a second queue.
          items:
            $ref: "#/components/schemas/StudioReview"
        truncated:
          type: boolean
          description: >-
            True when there are more reviews than one read covers, so the queue
            says it is partial instead of looking complete. Older rows are still
            in Notion.
    ReviewStatusRequest:
      type: object
      description: The moderation decision to record against a review.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ReviewModerationStatus"
    StudioRequestKind:
      type: string
      enum:
        - inquiry
        - back-in-stock
        - measurement
        - cancellation
        - return
        - waitlist
        - newsletter
        - data-deletion
        - other
      description: >-
        What a customer is asking for, DERIVED from the row's `Request type`
        select rather than enumerated from it. Eight kinds name the values the
        app writes; `other` is anything else — a blank select, or a type the
        atelier invented — so an unrecognized row appears in the queue asking
        to be looked at rather than vanishing from it.


        `newsletter` never appears in the request QUEUE — an opt-in is a
        consent record nobody answers, so it has its own panel (see
        `/studio/newsletter`) and is filtered out of the queue. The kind still
        exists because the queue's state operation is shared across the whole
        contact inbox, and it answers with the row it wrote.
    StudioRequestState:
      type: string
      enum: [new, replied, closed]
      description: >-
        Where a request stands in the inbox, derived from its Notion `Stage`.
        `closed` is the only value that takes it off the queue, so a row with a
        blank or unrecognized stage reads as `new` — an untriaged request
        should appear rather than disappear.
    StudioRequestAction:
      type: object
      description: >-
        The dashboard tool that actions this request, and the argument it
        needs. Present only where the app can action the request at all: the
        two refunds and the back-in-stock sweep. A measurement change is
        applied to the order by hand and an inquiry is answered by email, so
        neither carries one.
      required: [tool]
      properties:
        tool:
          $ref: "#/components/schemas/StudioTool"
        orderNumber:
          type: string
          description: >-
            The order the tool should act on, read off the request. Absent when
            it couldn't be recovered — a row whose title was rewritten by hand,
            say — in which case the action is not offered at all rather than
            offered blank.
        item:
          type: string
          description: The inventory item name, for a back-in-stock request.
    StudioRequest:
      type: object
      description: >-
        One customer request as the queue shows it — the row from the shared
        contact inbox, plus what can be done about it. Staff-only.
      required: [id, kind, subject, state]
      properties:
        id:
          type: string
          description: The request's Notion page id; also what a state change is addressed to.
        kind:
          $ref: "#/components/schemas/StudioRequestKind"
        rawType:
          type: string
          description: >-
            The `Request type` select exactly as Notion holds it, when set.
            Shown for a row the app reads as `other`, so "why is this here?" is
            answerable without opening Notion.
        subject:
          type: string
          description: The row's title, as the writer composed it.
        customerName:
          type: string
          description: Who wrote it, when the request records a name (inquiries do).
        email:
          type: string
          description: >-
            The address the request came from — how an inquiry or a measurement
            change is answered. Omitted on a row that carries none.
        phone:
          type: string
          description: A contact number, when the customer left one.
        message:
          type: string
          description: >-
            The request in full: the cancellation reason, the requested
            measurements, the return's kind and reason. Composed by the writer
            that filed it, and shown verbatim.
        orderNumber:
          type: string
          description: >-
            The order the request concerns, for the order-scoped kinds. Absent
            on an inquiry or a back-in-stock ask, which concern no order.
        item:
          type: string
          description: The piece being asked about (back-in-stock and returns).
        size:
          type: string
          description: The size band a back-in-stock request named, when it named one.
        state:
          $ref: "#/components/schemas/StudioRequestState"
        rawStage:
          type: string
          description: The `Stage` select exactly as Notion holds it, when set.
        submittedAt:
          type: string
          format: date-time
          description: When the request was filed (its Notion created time).
        action:
          $ref: "#/components/schemas/StudioRequestAction"
        notionUrl:
          type: string
          description: >-
            The request's page in Notion, for everything this queue doesn't
            show — the linked order, the client record, the atelier's own notes.
    StudioRequestList:
      type: object
      description: >-
        The request queue: what is still open, and the recently closed rows for
        reference.
      required: [open, closed]
      properties:
        open:
          type: array
          description: >-
            Still waiting, OLDEST first — the queue proper. Anything not closed
            counts, including a row whose stage was never set.
          items:
            $ref: "#/components/schemas/StudioRequest"
        closed:
          type: array
          description: >-
            Recently closed, newest first. Capped — it is a record of what was
            worked down, not a second queue.
          items:
            $ref: "#/components/schemas/StudioRequest"
        truncated:
          type: boolean
          description: >-
            True when there are more open requests than one read covers, so the
            queue says it is partial instead of looking complete.
    NewsletterSubscription:
      type: string
      enum: [subscribed, absent, unknown]
      description: >-
        Where this email stands in the Resend audience, read live rather than
        stored. `subscribed` — Resend holds them, so there is nothing to do.
        `absent` — not on the list, so this is the row to act on. `unknown` —
        the audience isn't configured or couldn't be read, in which case the
        panel says so rather than implying nobody is on the list.


        Whether a contact has since unsubscribed is deliberately NOT reported.
        Resend owns that: it attaches the one-click unsubscribe to every
        broadcast and honours it, so an opt-out is not something the studio
        acts on. Such a contact reads as `subscribed` — Resend has them — and
        so is never offered the add action, which is the behaviour that
        matters.
    NewsletterAudienceStatus:
      type: object
      description: >-
        The state of the Resend audience itself, so the panel can explain an
        empty or unknown column rather than leaving it blank.
      required: [configured]
      properties:
        configured:
          type: boolean
          description: >-
            False when `RESEND_AUDIENCE_ID` (or the API key) is unset. Every
            opt-in then reads `unknown`, the capture-time sync is off too, and
            the panel says what to set rather than showing a list that looks
            unhandled.
        unreachable:
          type: boolean
          description: >-
            True when the audience IS configured but Resend couldn't be read.
            The opt-ins are still listed — from Notion, which is a separate
            system — with an `unknown` subscription each. Absent when the read
            worked.
        contactCount:
          type: integer
          description: How many contacts the audience holds. Absent when unreadable.
    NewsletterSignup:
      type: object
      description: >-
        One marketing opt-in, and whether it reached the mailing list.
        Staff-only.
      required: [id, subject, state, subscription]
      properties:
        id:
          type: string
          description: The opt-in's Notion page id; also what an action is addressed to.
        email:
          type: string
          description: >-
            The address that opted in — the whole content of the record.
            Omitted only on a malformed row, which can then be dismissed but
            not subscribed.
        source:
          type: string
          description: >-
            Where they opted in (the footer field, the order form), recovered
            from the row's subject. Absent when the capture recorded none.
        subject:
          type: string
          description: The row's title, as the writer composed it.
        state:
          $ref: "#/components/schemas/StudioRequestState"
        subscription:
          $ref: "#/components/schemas/NewsletterSubscription"
        submittedAt:
          type: string
          format: date-time
          description: When they opted in (the row's Notion created time).
        notionUrl:
          type: string
          description: The opt-in's page in Notion.
    NewsletterSignupList:
      type: object
      description: >-
        The opt-ins still to be dealt with, the recently filed ones, and the
        state of the audience they are checked against.
      required: [pending, handled, audience]
      properties:
        pending:
          type: array
          description: >-
            Not yet filed away, OLDEST first — someone who opted in weeks ago
            and never reached the list is the one to fix first.
          items:
            $ref: "#/components/schemas/NewsletterSignup"
        handled:
          type: array
          description: >-
            Recently closed, newest first. Capped, and still carrying their
            live audience status — so a row filed away that never actually
            reached the list is visible rather than assumed done.
          items:
            $ref: "#/components/schemas/NewsletterSignup"
        audience:
          $ref: "#/components/schemas/NewsletterAudienceStatus"
        truncated:
          type: boolean
          description: >-
            True when there are more pending opt-ins than one read covers.
    RequestStateRequest:
      type: object
      description: The state to record against a request.
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/StudioRequestState"
    NewContactRequest:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        message:
          type: string
          minLength: 1
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never see or
            fill; a non-empty value marks the submission as spam and it is
            silently dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when the client can't measure it (treated as human).
    NewContactResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    CapacityStatus:
      type: object
      required:
        - open
        - waitlistOpen
        - message
      description: >-
        Whether the capacity-gated services are accepting orders, and the
        wording to show when they aren't.
      properties:
        open:
          type: boolean
          description: >-
            True when a capacity-gated service can be ordered. False means the
            intake form should offer the waitlist instead.
        waitlistOpen:
          type: boolean
          description: >-
            Whether `POST /waitlist` should be offered. Today this is the
            inverse of `open`, but it is stated rather than derived so the
            atelier can later close the books without collecting names.
        message:
          type: string
          description: >-
            The customer-facing explanation to show when closed, from the
            atelier-editable `COMMISSION_CLOSED_MESSAGE` setting. Empty when
            open — there is nothing to explain.
    NewWaitlistRequest:
      type: object
      required:
        - name
        - email
      description: >-
        A request to be told when the studio's books reopen. Deliberately
        lighter than an order: enough to get back in touch and to know what the
        piece is for.
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        neededBy:
          type: string
          format: date
          description: >-
            When the customer needs the piece, if they know. Used by the atelier
            to work the list in date order.
        eventName:
          type: string
          description: >-
            What the piece is for, in the customer's own words — a competition,
            a recital, a showcase. Free text on purpose: the studio makes for
            skating and dance alike and can't keep a list of every event its
            customers work towards, but the customer knows theirs. Used only to
            label the entry for the atelier — nothing resolves or validates it.
        notes:
          type: string
          description: A line about the piece they have in mind. Optional.
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never fill; a
            non-empty value marks the submission as spam and it is silently
            dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when unmeasurable (treated as human).
    NewWaitlistResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NewNotifyRequest:
      type: object
      required:
        - email
        - item
      properties:
        email:
          type: string
          format: email
        item:
          type: string
          minLength: 1
          description: The sold-out variant's name, e.g. "Bow Fleece Soaker — Black".
        size:
          type: string
          description: >-
            Set only when the customer asked about one specific sold-out size
            band; absent when the whole variant is sold out.
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never fill; a
            non-empty value marks the submission as spam and it is silently
            dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when unmeasurable (treated as human).
    NewNotifyResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NewNewsletterRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        source:
          type: string
          description: >-
            Where the opt-in came from, e.g. "footer" or "order form". Recorded
            for the atelier's own segmentation; the customer never sees it.
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never fill; a
            non-empty value marks the submission as spam and it is silently
            dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when unmeasurable (treated as human).
    NewNewsletterResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NewReturnRequest:
      type: object
      required:
        - email
        - kind
        - reason
      description: >-
        A request to return or exchange a ready-to-wear shop order. The server
        verifies the email against the one on the order; the atelier reviews and
        actions accepted requests by hand (this endpoint never refunds or edits
        the order).
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match the order is rejected.
        kind:
          type: string
          enum: [return, exchange]
          description: Whether the customer wants a refund (return) or a swap (exchange).
        reason:
          type: string
          enum: [wrong_size, damaged, not_as_expected, changed_mind, other]
          description: Why the customer is returning or exchanging the item.
        items:
          type: string
          description: >-
            Which piece(s) the request covers, in the customer's own words.
            Optional — the atelier can also read the order in Notion.
        exchangeFor:
          type: string
          description: >-
            For an exchange, the size/colour/piece the customer wants instead.
            Ignored for a return.
        note:
          type: string
          description: Optional free-text note with anything else the atelier should know.
    NewReturnResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    ProductVariant:
      type: object
      required:
        - id
        - name
        - available
        - photos
        - sizes
      properties:
        id:
          type: string
        name:
          type: string
        available:
          type: boolean
        price:
          type: number
        description:
          type: string
        photos:
          type: array
          items:
            type: string
        sizes:
          type: array
          description: >-
            Every size band this item is offered in ("Sizes Offered" in Notion),
            each flagged with whether it is currently in stock ("Sizes
            Available"). A size that is offered but not available is sold out,
            and the shop offers a per-size back-in-stock request. Empty for
            one-size items (soakers, cloths).
          items:
            $ref: "#/components/schemas/SizeOption"
        quantityAvailable:
          type: number
        addOnIds:
          type: array
          description: >-
            Ids of other ProductVariants offered as matching add-ons for this
            variant (the "Matching Add-ons" self-relation in the Notion
            inventory database) — e.g. a skate soaker points at its matching
            blade towel. Each id is the `id` of a ProductVariant that also
            appears in this same product list, so clients resolve the add-on's
            name/price/availability locally rather than the payload carrying it
            twice. Empty or absent when the variant has no add-ons.
          items:
            type: string
    SizeOption:
      type: object
      required:
        - name
        - available
      properties:
        name:
          type: string
          description: A size band, e.g. "Adult M".
        available:
          type: boolean
          description: False when the size is offered but currently sold out.
    Product:
      type: object
      required:
        - id
        - title
        - category
        - sized
        - variants
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        sized:
          type: boolean
          description: >-
            Whether this product's category should show the ready-to-wear body-
            measurement size guide. Computed server-side from the Notion "Product
            Categories" database (a "Show size guide" checkbox per category) when
            configured, otherwise from a built-in fallback list. Clients render
            the size chart from this flag and must not hardcode which categories
            are sized.
        sizeGuide:
          type: string
          enum:
            - garment
            - soaker
          description: >-
            Which size chart this product's category uses. "garment" (the
            default, and the value when this field is omitted) is the ready-to-
            wear body-measurement chart; "soaker" is the skate-soaker blade-length
            chart. Resolved server-side from the Notion "Product Categories"
            database ("Size guide type" select per category, following the
            inventory `Category` relation) — clients pick the chart from this and
            must not hardcode which category is a soaker. Only meaningful when
            `sized` is true.
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
    ProductList:
      type: object
      required:
        - products
        - categories
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        categories:
          type: array
          description: >-
            The shop's category filters, read live from the Notion "Product
            Categories" database and returned in the order the atelier arranged
            them (its `Sort` field). Each inventory item links to its category
            through a `Category` relation. Editing the categories in Notion
            changes this list without a redeploy, so clients must not hardcode it.
          items:
            type: string
    Color:
      type: object
      required:
        - id
        - name
        - hex
      properties:
        id:
          type: string
          description: A stable slug of the name ("Rose Gold" → "rose-gold").
        name:
          type: string
        hex:
          type: string
          description: Hex color fill for the chip, e.g. "#2E5CB8".
    ColorList:
      type: object
      required:
        - colors
      properties:
        colors:
          type: array
          description: >-
            The studio's intake color palette — the atelier-editable
            `COLOR_PALETTE` Studio Settings value, or a built-in primary-color
            palette when unset. Always non-empty.
          items:
            $ref: "#/components/schemas/Color"
    Service:
      type: object
      required:
        - id
        - name
        - summary
        - measurements
        - colors
        - detailsRequired
        - detailsLabel
        - detailsHelp
        - capacityGated
      description: >-
        One service a custom order can be placed for, with the rules that decide
        what the intake form asks for. The flags are the contract's half of a
        targeted business rule held in server code (like the appointment-type
        catalog): the same definitions gate `POST /orders`.
      properties:
        id:
          type: string
          description: Stable id, sent back as `service` on a new order.
        name:
          type: string
          description: Display name, e.g. "Fittings & Alterations".
        summary:
          type: string
          description: One line describing the service, shown on the picker.
        measurements:
          type: boolean
          description: >-
            Whether this service asks for the five body measurements. When
            false the form omits them entirely and the server does not require
            values (nor a measurement appointment) — only a garment made from
            scratch needs them.
        colors:
          type: boolean
          description: >-
            Whether this service offers the studio colour palette and the
            "how would you like these used" note.
        detailsRequired:
          type: boolean
          description: >-
            Whether the order's free-text `description` is required. True for
            the services performed on a piece the customer already owns, where
            that description IS the brief; false for a bespoke commission, whose
            design notes are optional.
        detailsLabel:
          type: string
          description: Field label for `description` on this service's form.
        detailsHelp:
          type: string
          description: Placeholder / prompt for `description` on this service's form.
        capacityGated:
          type: boolean
          description: >-
            Whether this service is paused when the studio's books are closed
            (see `GET /capacity`). True only for work that consumes the
            atelier's making capacity — a bespoke commission. A piece the
            customer already owns is quick work the studio keeps taking, so
            alterations, rhinestoning and repairs are never gated.
    ServiceList:
      type: object
      required:
        - services
      properties:
        services:
          type: array
          description: >-
            The intake service catalog, in the order the form should offer it.
            Always non-empty; the first entry is the default when a new order
            names no service.
          items:
            $ref: "#/components/schemas/Service"
    CheckoutItem:
      type: object
      required:
        - variantId
        - quantity
      properties:
        variantId:
          type: string
          description: >-
            The Notion inventory page id of the variant being purchased (the
            `id` on a ProductVariant).
        size:
          type: string
          description: >-
            The selected size band, required when the variant is offered in
            sizes and omitted for one-size items.
        quantity:
          type: integer
          minimum: 1
    CreateCheckoutSessionRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CheckoutItem"
    CheckoutSessionResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: The Stripe-hosted checkout URL to redirect the browser to.
    PaymentSessionResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: The Stripe-hosted checkout URL for the payment.
    ReceiptLineItem:
      type: object
      required:
        - description
        - quantity
        - amount
      properties:
        description:
          type: string
        quantity:
          type: number
        amount:
          type: number
          description: The line total in dollars (unit price × quantity).
    CheckoutSessionStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: >-
            The Stripe payment status of the session, e.g. "paid", "unpaid", or
            "no_payment_required".
        orderNumber:
          type: string
          description: >-
            The human-readable shop order number (e.g. "SHP-…") the customer can
            use to track their order. Present for shop-cart orders; absent for
            custom-order payment sessions.
        kind:
          type: string
          description: >-
            What the session paid for — "shop" for a shop-cart order,
            "custom_payment" for a custom-order deposit or balance (from the
            session's metadata.kind). Lets the success page skip clearing the
            cart on a custom-order receipt view.
        email:
          type: string
          description: The customer's email, present once the session is complete.
        currency:
          type: string
          description: ISO currency code of the totals, e.g. "usd".
        lineItems:
          type: array
          description: The purchased items, for an on-site receipt.
          items:
            $ref: "#/components/schemas/ReceiptLineItem"
        amountSubtotal:
          type: number
          description: Items subtotal in dollars (before shipping and tax).
        amountShipping:
          type: number
          description: Shipping charged in dollars.
        amountTax:
          type: number
          description: Tax charged in dollars (Stripe Tax).
        amountTotal:
          type: number
          description: Grand total in dollars (items + shipping + tax).
    AppointmentType:
      type: object
      required:
        - id
        - name
        - durationMinutes
        - staff
        - locations
      properties:
        id:
          type: string
        name:
          type: string
        durationMinutes:
          type: integer
          description: How long the appointment runs, in minutes.
        description:
          type: string
        staff:
          type: array
          description: The staff members who offer this appointment type.
          items:
            type: string
        locations:
          type: array
          description: The locations this type is offered in.
          items:
            type: string
            enum: [in-person, virtual]
        requiresOrder:
          type: boolean
          description: >-
            When true, this type may only be booked against an existing order —
            the request must carry an orderNumber that matches a real order (and
            the booking email must match the one on that order). Order-scoped
            types like fittings and design reviews set this.
        requiresProjectDetails:
          type: boolean
          description: >-
            When true, the request must include a non-empty projectDetails
            describing what the customer wants made. New-customer types like
            consultations set this to filter out uncertain requests.
    AppointmentOptions:
      type: object
      required:
        - timezone
        - types
      properties:
        timezone:
          type: string
          description: >-
            IANA timezone the atelier's hours and slot times are expressed in,
            for the client to render slots and label the times.
        types:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentType"
    AvailabilitySlot:
      type: object
      required:
        - start
        - end
        - staff
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        staff:
          type: string
          description: The staff member who would take this slot.
    AppointmentAvailability:
      type: object
      required:
        - timezone
        - slots
      properties:
        timezone:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
    NewAppointmentRequest:
      type: object
      required:
        - typeId
        - location
        - start
        - fullName
        - email
      properties:
        typeId:
          type: string
        staff:
          type: string
          description: A specific staff member, or omitted for no preference.
        location:
          type: string
          enum: [in-person, virtual]
        start:
          type: string
          format: date-time
          description: >-
            The chosen slot's start instant, as returned by the availability
            endpoint.
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        preferredContact:
          type: string
          enum: [email, phone, text]
        notes:
          type: string
        orderNumber:
          type: string
          description: >-
            The customer's order number. Required for order-scoped types
            (requiresOrder) — the server verifies it against a real order whose
            email matches the booking email. Ignored for other types.
        projectDetails:
          type: string
          description: >-
            A short description of what the customer wants made. Required for
            new-customer types (requiresProjectDetails); ignored otherwise.
    NewAppointmentResponse:
      type: object
      required:
        - confirmationCode
        - type
        - staff
        - location
        - start
        - end
      properties:
        confirmationCode:
          type: string
        type:
          type: string
          description: The booked appointment type's display name.
        staff:
          type: string
        location:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meetingUrl:
          type: string
          description: >-
            The Google Meet link for a virtual appointment, when one was created.
        calendarLink:
          type: string
          description: A link to the booking's Google Calendar event.
    AppointmentDetails:
      type: object
      description: >-
        A booked appointment's current state, read live from Google Calendar for
        the self-service reschedule / cancel page.
      required:
        - status
        - confirmationCode
        - typeId
        - typeName
        - staff
        - location
        - locationLabel
        - start
        - end
        - timezone
        - canModify
      properties:
        status:
          type: string
          enum: [confirmed, cancelled]
          description: Whether the appointment is still on the calendar or was cancelled.
        timezone:
          type: string
          description: >-
            IANA timezone the atelier's hours and slot times are expressed in,
            for the client to render the appointment's times.
        confirmationCode:
          type: string
        typeId:
          type: string
          description: >-
            The appointment type's id, so the reschedule flow can re-query
            availability for the same type.
        typeName:
          type: string
        staff:
          type: string
        location:
          type: string
          enum: [in-person, virtual]
        locationLabel:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meetingUrl:
          type: string
          description: The Google Meet link for a virtual appointment, when one exists.
        canModify:
          type: boolean
          description: >-
            Whether the appointment can still be rescheduled or cancelled — false
            once it has started or been cancelled.
    RescheduleAppointmentRequest:
      type: object
      required:
        - token
        - start
      properties:
        token:
          type: string
          description: The signed token from the manage link.
        start:
          type: string
          format: date-time
          description: >-
            The new slot's start instant, as returned by the availability
            endpoint.
    CancelAppointmentRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The signed token from the manage link.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MessageResponse:
      type: object
      description: A generic human-readable acknowledgement.
      required: [message]
      properties:
        message:
          type: string
    AccountOverview:
      type: object
      description: >-
        Everything tied to the signed-in customer's email — the data the account
        dashboard renders.
      required: [email, customOrders, shopOrders, appointments]
      properties:
        email:
          type: string
          description: The signed-in customer's email.
        customOrders:
          type: array
          description: >-
            The customer's custom (bespoke) orders, newest-relevant first. Empty
            when none match the signed-in email.
          items:
            $ref: "#/components/schemas/AccountOrderSummary"
        shopOrders:
          type: array
          description: >-
            The customer's ready-to-wear shop orders. Empty when none match the
            signed-in email (older shop orders without an order number are omitted).
          items:
            $ref: "#/components/schemas/AccountShopOrderSummary"
        appointments:
          type: array
          description: >-
            The customer's upcoming appointments, read live from Google Calendar
            by the email stamped on each booking, soonest first. Empty when none
            are upcoming, when the calendar integration isn't configured, or (a
            best-effort read) when the calendar can't be reached. Bookings made
            before the customer email was stamped on the event are not listed.
          items:
            $ref: "#/components/schemas/AccountAppointmentSummary"
        referral:
          $ref: "#/components/schemas/AccountReferral"
    AccountReferral:
      type: object
      description: >-
        The signed-in customer's referral-program state. Present only when the
        Client CRM is configured (omitted entirely otherwise, so the dashboard's
        referral card simply doesn't render).
      required: [code]
      properties:
        code:
          type: string
          description: The customer's own shareable referral code.
        creditAmount:
          type: number
          description: >-
            The credit, in dollars, that a referred skater's first paid order
            earns this customer — shown in the share copy so the value is
            concrete.
        returningCode:
          type: string
          description: >-
            A standing personal discount code for this returning customer,
            present once they've earned it (a qualifying repeat order). Absent
            otherwise.
    AccountDataExport:
      type: object
      description: >-
        Everything the studio holds about the signed-in customer, gathered for a
        data-access request. Identity is the email on the session, exactly as it
        is for the dashboard, so this is the same lookups widened to every store
        the app writes personal data into.


        The Postgres layer is deliberately not a source of its own: it holds an
        email-keyed discovery index (order numbers and page ids) derived from
        the Notion orders already listed here, so exporting it separately would
        repeat the same facts in a less readable form.
      required:
        - generatedAt
        - email
        - customOrders
        - shopOrders
        - appointments
        - requests
        - reviews
        - marketing
        - unavailable
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When this export was assembled.
        email:
          type: string
          description: The signed-in email every record below was looked up by.
        userId:
          type: string
          description: >-
            The customer's sign-in account id (the Supabase user id). The only
            thing the studio holds that is not keyed on the email.
        customOrders:
          type: array
          description: The customer's custom (bespoke) orders, including the measurements on file.
          items:
            $ref: "#/components/schemas/AccountOrderSummary"
        shopOrders:
          type: array
          description: The customer's ready-to-wear shop orders.
          items:
            $ref: "#/components/schemas/AccountShopOrderSummary"
        appointments:
          type: array
          description: >-
            The customer's upcoming appointments. Past bookings are not listed —
            the calendar is only searched forward, the same read the dashboard
            makes. Deliberately without the signed manage token the dashboard
            carries: that token is a credential, and an export is a file people
            forward.
          items:
            $ref: "#/components/schemas/AppointmentDetails"
        client:
          $ref: "#/components/schemas/ExportedClientRecord"
        requests:
          type: array
          description: >-
            Everything the customer has filed with the studio — inquiries,
            back-in-stock asks, measurement changes, cancellations, returns,
            waitlist entries and marketing opt-ins. Newest first.
          items:
            $ref: "#/components/schemas/ExportedRequest"
        reviews:
          type: array
          description: The reviews the customer has written, whether or not they were published.
          items:
            $ref: "#/components/schemas/ExportedReview"
        marketing:
          $ref: "#/components/schemas/ExportedMarketing"
        unavailable:
          type: array
          description: >-
            The sources that could not be read for this export, by their
            customer-facing name ("Custom orders", "Reviews"). Empty on a
            complete export. Named rather than silently omitted: an export
            missing a source without saying so is a wrong answer to a legal
            request, not a slightly smaller one.
          items:
            type: string
    ExportedClientRecord:
      type: object
      description: >-
        The customer's Client CRM record — the studio's own contact card for
        them. Absent when the CRM isn't configured, when the customer has no
        record, or when the CRM couldn't be read (in which case it is named in
        `unavailable`).
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          description: How the studio files them (Lead, Active, …).
        lastContact:
          type: string
          description: The date of the studio's last recorded contact (YYYY-MM-DD).
        referralCode:
          type: string
          description: The customer's own shareable referral code.
        referredByEmail:
          type: string
          description: The email of the customer who referred them, when they used a code.
        firstPaidOrder:
          type: string
          description: The order number of their first paid order, once they have one.
    ExportedRequest:
      type: object
      description: >-
        One row the customer filed in the studio's shared inbox. A narrower
        projection than the studio queue's — the internal Notion link and the
        tool that actions it are staff-facing and stay on the server.
      required: [kind, subject, state]
      properties:
        kind:
          $ref: "#/components/schemas/StudioRequestKind"
        rawType:
          type: string
          description: The request type exactly as the studio's inbox holds it, when set.
        subject:
          type: string
        message:
          type: string
        item:
          type: string
        size:
          type: string
        orderNumber:
          type: string
        state:
          $ref: "#/components/schemas/StudioRequestState"
        submittedAt:
          type: string
          format: date-time
    ExportedReview:
      type: object
      description: >-
        One review the customer wrote. The photographs attached to it are not
        included — see the endpoint description.
      required: [rating, comment, consentToPublish, status]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        customerName:
          type: string
          description: How they asked to be credited, when they gave a name.
        orderNumber:
          type: string
        consentToPublish:
          type: boolean
        status:
          $ref: "#/components/schemas/ReviewModerationStatus"
        submittedAt:
          type: string
          format: date-time
    ExportedMarketing:
      type: object
      description: Where the customer stands on the studio's marketing mailing list.
      required: [status]
      properties:
        status:
          type: string
          enum: [subscribed, absent, unknown]
          description: >-
            `subscribed` — on the list; `absent` — not on it; `unknown` — the
            list isn't configured or couldn't be reached, which is reported
            rather than rendered as "not on it".
    NewAccountDeletionRequest:
      type: object
      description: >-
        An erasure request. The customer is identified by their session, so the
        body carries only optional context for the person who will action it.
      properties:
        note:
          type: string
          maxLength: 2000
          description: >-
            Anything the customer wants the studio to know — which records they
            mean, or that an order should be finished first.
    AccountDeletionRequestResult:
      type: object
      description: What the studio did with the erasure request, said plainly.
      required: [received, alreadyRequested, marketing]
      properties:
        received:
          type: boolean
        alreadyRequested:
          type: boolean
          description: >-
            True when a request from this customer was already open, so no
            second row was filed. The marketing opt-out is still applied.
        marketing:
          type: string
          enum: [unsubscribed, absent, unavailable]
          description: >-
            The one erasure performed on the spot. `unsubscribed` — removed from
            the marketing list; `absent` — they were not on it; `unavailable` —
            the list isn't configured or couldn't be reached, so the studio does
            it by hand.
    AccountOrderState:
      type: string
      enum:
        - active
        - completed
        - cancelled
      description: >-
        Where an order sits in its lifecycle, derived server-side so the
        dashboard never has to infer it from a stage/status name. "completed"
        means the order has reached the final stage/status in its live list
        (delivered for a custom order, fulfilled for a shop order); "cancelled"
        means the atelier has cancelled it (and takes precedence over
        "completed"); everything else is "active".
    AccountOrderSummary:
      type: object
      description: A custom order as shown on the account dashboard (links out to the full tracking + invoice views).
      required: [orderNumber, orderName, currentStage, stages, state]
      properties:
        orderNumber:
          type: string
        orderName:
          type: string
        currentStage:
          type: string
        state:
          $ref: "#/components/schemas/AccountOrderState"
        stages:
          type: array
          description: The live ordered stage list, so the dashboard can show progress (e.g. "3 of 6").
          items:
            type: string
        estimatedCompletion:
          type: string
          description: >-
            The order's target completion date (its Due Date) as an ISO date
            (yyyy-mm-dd). A pass-through string (no format: date). Absent until
            the atelier sets one.
        measurements:
          $ref: "#/components/schemas/AccountMeasurements"
        measurementsLocked:
          type: boolean
          description: >-
            True once the order has reached the stage at which measurements are
            frozen (MEASUREMENT_LOCK_FROM_STAGE), mirroring the same field on
            OrderStatus. The dashboard offers its in-place edit only when this is
            false, so the affordance and the server's own gate can't disagree.
            Absent on a response built before the field existed, which reads as
            not locked.
    AccountShopOrderSummary:
      type: object
      description: A ready-to-wear shop order as shown on the account dashboard.
      required: [orderNumber, status, state]
      properties:
        orderNumber:
          type: string
        status:
          type: string
          description: The order's current fulfilment status.
        state:
          $ref: "#/components/schemas/AccountOrderState"
        total:
          type: number
          description: The order total in dollars, when recorded.
    AccountMeasurements:
      type: object
      description: >-
        The measurements on file for a custom order, read from the order's Notion
        properties. Absent when the customer chose to have measurements taken at a
        fitting, or for orders placed before measurements were stored as readable
        properties (those values remain only in the order's page body). Individual
        values may be absent for a partially-filled order.
      required: [unit]
      properties:
        unit:
          type: string
          enum: [inches, cm]
          description: The unit the measurement values are expressed in.
        waist:
          type: number
        bust:
          type: number
        hips:
          type: number
        height:
          type: number
        bodyGirth:
          type: number
    AccountAppointmentSummary:
      type: object
      description: >-
        An upcoming appointment as shown on the account dashboard. Mirrors
        AppointmentDetails and additionally carries a signed manage token so the
        dashboard can reschedule or cancel it in place through the existing
        appointment-manage endpoints (no separate manage-link navigation needed).
      required:
        - status
        - confirmationCode
        - typeId
        - typeName
        - staff
        - location
        - locationLabel
        - start
        - end
        - timezone
        - canModify
        - manageToken
      properties:
        status:
          type: string
          enum: [confirmed, cancelled]
        timezone:
          type: string
          description: IANA timezone the appointment's times are expressed in.
        confirmationCode:
          type: string
        typeId:
          type: string
        typeName:
          type: string
        staff:
          type: string
        location:
          type: string
          enum: [in-person, virtual]
        locationLabel:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meetingUrl:
          type: string
          description: The Google Meet link for a virtual appointment, when one exists.
        canModify:
          type: boolean
          description: >-
            Whether the appointment can still be rescheduled or cancelled — false
            once it has started or been cancelled.
        manageToken:
          type: string
          description: >-
            A signed token (the same one the confirmation email's manage link
            carries) authorizing reschedule/cancel of this specific appointment
            via the appointment-manage endpoints.
    StaffWeekday:
      type: string
      description: A day of the week a block of working hours repeats on.
      enum:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday
    AppointmentStaffingType:
      type: object
      description: >-
        One bookable appointment type, with the staff who currently perform it.
        Everything but `staff` is fixed in code and shown for context — a type's
        length, where it can be held, and whether it needs an order behind it
        are not things the dashboard changes.
      required:
        [id, name, description, durationMinutes, locations, staff, defaultStaff]
      properties:
        id:
          type: string
          description: The type's stable id, as used when saving staffing.
        name:
          type: string
          description: How the type reads to a customer, e.g. "Fitting & Measurements".
        description:
          type: string
        durationMinutes:
          type: integer
        locations:
          type: array
          description: Where this type can be held.
          items:
            type: string
            enum: [in-person, virtual]
        staff:
          type: array
          description: >-
            Who offers it right now — the staffing actually in force, which is
            the set the slot calculator draws from. Never empty.
          items:
            type: string
        defaultStaff:
          type: array
          description: >-
            Who the built-in catalog assigns to it, so the editor can show what
            resetting would mean and mark a type that has been moved away from
            it.
          items:
            type: string
        requiresOrder:
          type: boolean
          description: >-
            Present and true when this type can only be booked against an
            existing order — worth knowing when reassigning it, since it is not
            a type new customers can reach.
    AppointmentStaffing:
      type: object
      description: >-
        The studio's appointment staffing: every bookable type, who performs it,
        and the roster it may be assigned from.
      required: [configured, staff, types, usingDefaults]
      properties:
        configured:
          type: boolean
          description: >-
            Whether there is a Studio Settings database to write to. False means
            the staffing shown is real but can only be changed in the
            environment, and a save answers 409.
        staff:
          type: array
          description: >-
            Everyone the studio books appointments with. Deliberately the whole
            roster, not only the people currently assigned to something — a
            person with no types is how the atelier says they aren't taking
            appointments at the moment.
          items:
            type: string
        types:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentStaffingType"
        usingDefaults:
          type: boolean
          description: >-
            True when the staffing in force is the catalog's own, i.e. nothing
            is stored and a future change to the defaults would be picked up.
    AppointmentStaffingRequest:
      type: object
      description: >-
        The staffing to save. Only the types named are changed; any left out
        keep what they have.
      required: [types]
      properties:
        types:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [id, staff]
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 80
                description: An appointment type's id, as returned by the read.
              staff:
                type: array
                minItems: 1
                maxItems: 50
                description: >-
                  Who should offer it. Must name people the studio books, and
                  must not be empty — a type with nobody on it never offers a
                  time and never says why.
                items:
                  type: string
                  minLength: 1
                  maxLength: 120
    StaffAvailabilityEntry:
      type: object
      description: >-
        One recurring block of a staff member's standing working hours — the
        POSITIVE availability the slot calculator starts from, before it
        subtracts whatever their Google Calendar says they are busy with. A day
        off is a calendar event, not an edit here.
      required: [id, staff, calendarEmail, weekdays, start, end, locations]
      properties:
        id:
          type: string
          description: Identifies the entry for an update or a delete.
        staff:
          type: string
          description: >-
            The staff member these hours belong to. Always one of the names the
            studio books (see `staff` on the list response).
        calendarEmail:
          type: string
          format: email
          description: >-
            The Google Calendar this person's bookings are read from and written
            to. The same address is expected on every entry for one person; if
            they differ, the first one read wins.
        weekdays:
          type: array
          description: The weekdays this block repeats on.
          items:
            $ref: "#/components/schemas/StaffWeekday"
        start:
          type: string
          description: When the block starts, as 24-hour `HH:MM` local studio time.
          example: "10:00"
        end:
          type: string
          description: >-
            When the block ends, as 24-hour `HH:MM` local studio time. Always
            later than `start` — an entry that ends before it begins is rejected
            rather than silently ignored.
          example: "17:00"
        locations:
          type: array
          description: Which locations may be booked inside this block.
          items:
            type: string
            enum: [in-person, virtual]
    StaffAvailabilityRequest:
      type: object
      description: >-
        One block of working hours to save. The whole entry is sent on both
        create and update, so the two paths validate identically.
      required: [staff, calendarEmail, weekdays, start, end, locations]
      properties:
        staff:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Must be a staff member the studio books — the appointment catalog's
            list, returned as `staff` by the list operation. A name outside it
            would produce hours nothing could ever be booked into.
        calendarEmail:
          type: string
          format: email
          maxLength: 254
        weekdays:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StaffWeekday"
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour `HH:MM`.
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour `HH:MM`, later than `start`.
        locations:
          type: array
          minItems: 1
          items:
            type: string
            enum: [in-person, virtual]
    StaffAvailabilityList:
      type: object
      description: >-
        The whole standing schedule, plus the staff it may be assigned to — so
        the editor offers the names the booking catalog actually knows instead
        of a free-text field that has to match one exactly.
      required: [entries, staff]
      properties:
        entries:
          type: array
          description: Every block of hours on record, grouped by nothing in particular.
          items:
            $ref: "#/components/schemas/StaffAvailabilityEntry"
        staff:
          type: array
          description: The staff members the studio books appointments with.
          items:
            type: string
    StudioAccess:
      type: object
      description: >-
        The answer to "may this account use the studio dashboard?". Only ever
        returned to a caller the staff gate has already admitted, so `staff` is
        always true — the field exists so the response is self-describing rather
        than an empty body, and so a client reads a value instead of inferring
        from a status code.
      required: [staff]
      properties:
        staff:
          type: boolean
          description: Always true. A non-staff caller receives 401/403 instead.
    StudioAnalytics:
      type: object
      description: >-
        The atelier's own figures, aggregated from the live Notion databases for
        the internal studio dashboard. Every money value is US dollars.
      required:
        [
          generatedAt,
          customOrders,
          shopOrders,
          production,
          revenue,
          payments,
          topItems,
          topItemCoverage,
          channels,
          consignment,
          capacity,
        ]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: >-
            When these figures were computed. The server caches an aggregation
            briefly, so this can trail the request by up to a minute.
        customOrders:
          $ref: "#/components/schemas/StudioPipeline"
        shopOrders:
          $ref: "#/components/schemas/StudioPipeline"
        production:
          $ref: "#/components/schemas/StudioProductionLoad"
        revenue:
          type: array
          description: >-
            One entry per month over the trailing window, oldest first. Months
            with no activity are included as zeroes so a chart has no gaps.
          items:
            $ref: "#/components/schemas/StudioRevenueMonth"
        payments:
          $ref: "#/components/schemas/StudioPaymentTotals"
        topItems:
          type: array
          description: >-
            The shop's best sellers, most-ordered first, across every sales
            channel. Empty when no shop order carries its inventory relation
            (legacy orders, hand-filed ones, or the relation-links flag being
            off) — item-level figures are only as good as that link, and
            `topItemCoverage` says how many orders it misses.
          items:
            $ref: "#/components/schemas/StudioTopItem"
        topItemCoverage:
          $ref: "#/components/schemas/StudioTopItemCoverage"
        channels:
          type: array
          description: >-
            Trade by sales channel over the same trailing window the revenue
            series covers, in the atelier's own option order. A channel with no
            orders is included as a nought, so "nothing from Etsy this year" is
            readable; a channel no longer on the list but present on an order
            follows them, and untagged orders come last as an empty `channel`.
          items:
            $ref: "#/components/schemas/StudioChannelSales"
        consignment:
          $ref: "#/components/schemas/StudioConsignment"
        capacity:
          $ref: "#/components/schemas/StudioCapacity"
    StudioCapacity:
      type: object
      description: >-
        The seasonal-capacity gate as the studio sees it — whether the books are
        open, why, and the count behind it. The public `GET /capacity` carries
        the decision but deliberately none of these numbers; how much work the
        studio is holding is the studio's own business.
      required: [open, reason, limit]
      properties:
        open:
          type: boolean
          description: Whether a bespoke commission can currently be ordered.
        reason:
          type: string
          enum:
            - unlimited
            - under-capacity
            - at-capacity
            - forced-open
            - forced-closed
            - unknown
          description: >-
            What decided it. `unlimited` means no capacity is configured;
            `forced-*` means the atelier's manual switch overrode the count;
            `unknown` means the count couldn't be read and the books stayed open
            rather than closing on a bad read.
        limit:
          type: integer
          description: >-
            The configured `COMMISSION_CAPACITY`. `0` means no limit is being
            enforced.
        inProduction:
          type: integer
          description: >-
            How many capacity-gated orders are neither delivered nor cancelled.
            Absent when the count wasn't read — which is not the same as zero,
            and the panel says so rather than showing a nought.
    StudioPipeline:
      type: object
      description: >-
        How a set of orders is distributed across its live workflow — the custom
        order Stage list, or the shop order fulfilment Status list.
      required: [total, active, completed, cancelled, stages]
      properties:
        total:
          type: integer
          description: Every order of this kind on record.
        active:
          type: integer
          description: Orders neither cancelled nor at the final stage.
        completed:
          type: integer
          description: Orders sitting at the last stage in the live list.
        cancelled:
          type: integer
        stages:
          type: array
          description: >-
            Active orders per stage, in the live stage order (stages with no
            orders are included as zeroes, so the pipeline reads end to end).
          items:
            $ref: "#/components/schemas/StudioStageCount"
    StudioStageCount:
      type: object
      required: [stage, count]
      properties:
        stage:
          type: string
        count:
          type: integer
    StudioProductionLoad:
      type: object
      description: >-
        The making-side workload: active custom orders measured against the due
        dates the atelier has set.
      required:
        [
          activeOrders,
          scheduled,
          unscheduled,
          overdue,
          dueThisWeek,
          dueThisMonth,
          rush,
          upcoming,
        ]
      properties:
        activeOrders:
          type: integer
          description: Custom orders in progress (not cancelled, not delivered).
        scheduled:
          type: integer
          description: Of those, the ones carrying a Due Date.
        unscheduled:
          type: integer
          description: >-
            Active orders with no Due Date — invisible to the production
            schedule until the atelier sets one.
        overdue:
          type: integer
          description: Active orders whose due date has passed.
        dueThisWeek:
          type: integer
          description: Active orders due within the next 7 days (today included).
        dueThisMonth:
          type: integer
          description: Active orders due within the next 30 days (today included).
        rush:
          type: integer
          description: Active orders flagged as rush at intake.
        upcoming:
          type: array
          description: >-
            The nearest-due active orders, soonest first (overdue ones lead),
            capped to a short list for the dashboard.
          items:
            $ref: "#/components/schemas/StudioScheduledOrder"
    StudioScheduledOrder:
      type: object
      required: [orderNumber, orderName, stage, dueDate, overdue]
      properties:
        orderNumber:
          type: string
        orderName:
          type: string
        stage:
          type: string
        dueDate:
          type: string
          description: The order's Due Date as YYYY-MM-DD.
        overdue:
          type: boolean
        rush:
          type: boolean
    StudioRevenueMonth:
      type: object
      description: >-
        A month of trade. The two money figures are deliberately NOT summed:
        shop revenue is money actually collected, while the custom figure is
        work booked (Notion holds no per-payment dates, so a custom payment
        can't be attributed to the month it was made).
      required: [month, shopRevenue, shopOrders, customBooked, customOrders]
      properties:
        month:
          type: string
          description: The month as YYYY-MM.
        shopRevenue:
          type: number
          description: >-
            Dollars taken on shop orders placed that month, across every sales
            channel (order totals, including shipping and tax; cancelled orders
            excluded). The month comes from the order's own Order Date, falling
            back to when its row was created — so an Etsy receipt typed up weeks
            later still lands in the month it sold.
        shopOrders:
          type: integer
          description: Shop orders placed that month (cancelled excluded).
        customBooked:
          type: number
          description: >-
            Dollars invoiced on custom orders placed that month (each order's
            invoice Final Balance). Zero for orders not yet itemized.
        customOrders:
          type: integer
          description: Custom orders placed that month (cancelled excluded).
    StudioPaymentTotals:
      type: object
      description: >-
        Deposits against balances across every custom-order invoice on a live
        (non-cancelled) order — what has been collected and what is still out.
      required:
        [
          invoicedTotal,
          collectedTotal,
          outstandingTotal,
          depositsCollected,
          depositsOutstanding,
          balancesCollected,
          balancesOutstanding,
          invoiceCount,
          unpaidInvoiceCount,
        ]
      properties:
        invoicedTotal:
          type: number
          description: The sum of every invoice's Final Balance.
        collectedTotal:
          type: number
          description: Deposits plus balances marked paid.
        outstandingTotal:
          type: number
          description: Deposits plus balances still to collect.
        depositsCollected:
          type: number
        depositsOutstanding:
          type: number
          description: Deposit amounts set on an invoice but not yet paid.
        balancesCollected:
          type: number
          description: >-
            Final balances marked paid, net of the deposits already credited
            against them (that is what the balance stage actually charges).
        balancesOutstanding:
          type: number
          description: >-
            What is still owed on unpaid balances beyond every deposit scheduled
            against them — so this and depositsOutstanding add up to
            outstandingTotal without counting the same dollar twice. A paid
            balance settles its invoice outright and leaves nothing here.
        invoiceCount:
          type: integer
        unpaidInvoiceCount:
          type: integer
          description: Invoices with money still outstanding.
    StudioChannelSales:
      type: object
      description: >-
        One sales channel's trade. The atelier files Etsy receipts, skate-shop
        sales and word-of-mouth orders into the same database the website writes
        to, so this is what separates them.
      required: [channel, orders, revenue]
      properties:
        channel:
          type: string
          description: >-
            The `Sales Channel` option. EMPTY means the orders carry no channel
            at all — rows filed by hand and never tagged. It is not a channel and
            must be labelled as a gap, not credited to one.
        orders:
          type: integer
          description: Orders in the window (cancelled excluded).
        revenue:
          type: number
          description: Dollars taken on those orders, including shipping and tax.
    StudioTopItemCoverage:
      type: object
      description: >-
        How much of the window's trade the best-seller list can see. Item-level
        figures come from each order's inventory relation, which a hand-filed
        order usually lacks — without this, an empty list reads as "nothing
        sells" when it means "nothing is linked".
      required: [counted, unlinked]
      properties:
        counted:
          type: integer
          description: Orders whose pieces are counted in `topItems`.
        unlinked:
          type: integer
          description: Orders left out, because the row links no inventory row.
    StudioConsignment:
      type: object
      description: >-
        The finished pieces the studio has out at the skate shop, and what it has
        been paid for them. A consignment sale is not an order — nobody knows a
        piece sold until the placement is settled, and the money that arrives is
        the studio's share of a shelf price — so it is reported apart from the
        order figures and never summed into them.
      required:
        [
          configured,
          openPlacements,
          atShopUnits,
          atShopRetail,
          settledUnits,
          settledPayout,
          payoutUnknownPlacements,
          items,
        ]
      properties:
        configured:
          type: boolean
          description: >-
            False when no consignment database is wired up. The panel says so
            rather than showing an empty shelf, which would read as "nothing is
            out on consignment".
        unreachable:
          type: boolean
          description: >-
            The database id is set but Notion cannot see it — never shared with
            the integration, or the wrong id. Same kind of state as unset: a
            human has to clear it.
        openPlacements:
          type: integer
          description: Placements delivered and not yet settled.
        atShopUnits:
          type: integer
          description: Units still on the shop's shelf across those placements.
        atShopRetail:
          type: number
          description: >-
            What those units would fetch at their shelf price. RETAIL, not the
            studio's share: nothing has sold, so there is no payout to quote —
            this is the value of stock standing somewhere else.
        settledUnits:
          type: integer
          description: Units sold across placements settled in the window.
        settledPayout:
          type: number
          description: >-
            The studio's share of those sales, read off the atelier's own payout
            formula rather than derived from a split rate held in the app.
        payoutUnknownPlacements:
          type: integer
          description: >-
            Settled placements that sold something but whose payout formula
            produced no number, so their money is missing from `settledPayout`.
            Named rather than silently absent.
        items:
          type: array
          description: >-
            Pieces out on consignment, most on the shelf first. A piece whose
            inventory row can't be resolved is left out of this list but stays in
            the totals above.
          items:
            $ref: "#/components/schemas/StudioConsignmentItem"
    StudioConsignmentItem:
      type: object
      required: [name, atShop, sold]
      properties:
        name:
          type: string
        atShop:
          type: integer
          description: Units still on the shop's shelf.
        sold:
          type: integer
          description: Units sold and settled for in the window.
    StudioTopItem:
      type: object
      description: >-
        One best-selling shop piece. The count is orders containing the piece,
        not units — the order's inventory relation records which pieces were
        bought, not how many of each.
      required: [name, orders]
      properties:
        name:
          type: string
        orders:
          type: integer
    StudioToolRequest:
      type: object
      description: >-
        The arguments for one internal tool run. Every field is optional here
        because each tool takes a different subset; the server rejects a run that
        is missing what its own tool needs. This replaces the query string of the
        retired `?secret=` links, so the argument names mirror them.
      properties:
        orderNumber:
          type: string
          maxLength: 64
          description: >-
            The order the tool acts on — `ORD-…` for a custom order, `SHP-…` for
            a shop order. Required by `invoice-lines`, `quote`, `status-email`
            and the two refunds; `milestones` sweeps the whole pipeline and
            `restock-alert` takes an optional `item` instead.
        force:
          type: boolean
          description: >-
            `status-email` only. Resend the status update even when the order
            hasn't moved forward since the customer was last emailed. A forced
            resend never rewinds the high-water marker.
        amount:
          type: number
          minimum: 0
          description: >-
            Dollars, read by two tools. For `return-refund` it is the TARGET
            total to have refunded on the order — not an increment, so a
            repeated run can't double-refund; omit to refund in full. For
            `quote` it is the price of the work and is REQUIRED, since a quote
            with no amount is nothing to pay.
        description:
          type: string
          maxLength: 200
          description: >-
            `quote` only, and optional even there. What the work is, as the
            customer should read it on their invoice — "Re-stone bodice",
            "Replace shoulder elastic". Omitted ⇒ the line is named after the
            order's service ("Repair", "Rhinestoning", "Alterations").
        item:
          type: string
          maxLength: 200
          description: >-
            `restock-alert` only, and optional even there. The exact `Item Name`
            of one inventory row to alert on, as it appears in Notion — the same
            text a back-in-stock request stores. Omit it to sweep every piece
            that is currently in stock, which is what the nightly run does.
    StudioToolRun:
      type: object
      description: >-
        The outcome of one internal tool run, already composed for display. The
        server owns the wording — it is the same summary the retired
        confirmation pages rendered — so the dashboard renders the result rather
        than re-deriving it from per-tool fields.
      required: [tool, status, title, message, details]
      properties:
        tool:
          $ref: "#/components/schemas/StudioTool"
        status:
          type: string
          enum: [ok, noop, attention]
          description: >-
            `ok` — the tool did something. `noop` — there was nothing to do
            (every tool is idempotent, so this is the normal result of a repeat
            run). `attention` — the run completed but left something for the
            atelier to fix, e.g. a refund Stripe rejected, which leaves the order
            uncancelled so a re-run can retry it. A failure the tool couldn't
            start at all is an HTTP error, not a status here.
        title:
          type: string
          description: A short headline for the result, e.g. "Invoice itemized".
        message:
          type: string
          description: One sentence summarizing what happened.
        details:
          type: array
          description: >-
            Any per-item notes worth showing under the message — payments that
            were skipped, reasons a send was suppressed. Empty when there is
            nothing to add.
          items:
            type: string
    ParcelPreset:
      type: object
      description: >-
        One of the studio's packaging sizes, in inches. A code catalog served
        rather than duplicated in the frontend, like the appointment and service
        catalogs — a size the form offers that the server can't rate would be a
        dead option nobody could diagnose. Dimensions are the catalog's; the
        WEIGHT is not, because what goes in a box is a dress one day and a pair
        of soakers the next.
      required: [id, name, hint, length, width, height]
      properties:
        id:
          type: string
          description: What the rate request sends back.
        name:
          type: string
          description: How it reads on the packing bench, e.g. "Small box".
        hint:
          type: string
          description: What it is for, so the right one is picked without a tape measure.
        length:
          type: number
        width:
          type: number
        height:
          type: number
    ShippingOptions:
      type: object
      description: >-
        Whether a label can be bought, what's stopping it, and the packaging the
        studio keeps.
      required: [configured, testMode, problems, parcels]
      properties:
        configured:
          type: boolean
          description: A shipping vendor token is set.
        testMode:
          type: boolean
          description: >-
            The vendor token is a TEST one, so any label bought looks entirely
            real — tracking number, PDF, price — and no carrier has heard of it.
        shipFrom:
          type: array
          description: >-
            The studio's ship-from address as envelope lines, present only when
            it is complete enough to post from.
          items:
            type: string
        problems:
          type: array
          description: >-
            Everything standing between the atelier and a label, each phrased
            with its own fix. Empty ⇒ the panel is ready to use.
          items:
            type: string
        parcels:
          type: array
          items:
            $ref: "#/components/schemas/ParcelPreset"
    ShippingRatesRequest:
      type: object
      required: [orderNumber, parcelId, weightOz]
      properties:
        orderNumber:
          type: string
          maxLength: 64
          description: The shop order to post, e.g. `SHP-M2X4K1-AB12`.
        parcelId:
          type: string
          maxLength: 64
          description: The id of one of the studio's packaging sizes.
        weightOz:
          type: number
          exclusiveMinimum: 0
          maximum: 800
          description: >-
            The parcel's weight in OUNCES, off the scale. Zero is refused rather
            than treated as unset — a carrier rating a 0 oz package prices a
            document envelope — and the 800 oz (50 lb) ceiling is there to catch
            the typo that matters: pounds typed where ounces were wanted.
    ShippingRate:
      type: object
      description: One buyable rate. `id` is opaque and short-lived — it is the
        only thing the purchase takes, and it expires.
      required: [id, carrier, service, amount, currency]
      properties:
        id:
          type: string
        carrier:
          type: string
          description: 'As the customer will read it: "USPS", "UPS".'
        service:
          type: string
          description: 'The service level: "Priority Mail", "Ground Advantage".'
        amount:
          type: number
          description: What the studio pays.
        currency:
          type: string
        estimatedDays:
          type: integer
          description: The carrier's own estimate, when it gives one.
        durationTerms:
          type: string
          description: The carrier's wording for the delivery window, when it gives one.
    ShippingRates:
      type: object
      required: [orderNumber, shipTo, rates, notes]
      properties:
        orderNumber:
          type: string
        shipTo:
          type: array
          description: >-
            The customer's address as envelope lines, read from the order's
            Stripe checkout — so a wrong one is caught by eye before it is paid
            for rather than after it is posted.
          items:
            type: string
        rates:
          type: array
          description: Cheapest first, which is the order the atelier chooses in.
          items:
            $ref: "#/components/schemas/ShippingRate"
        notes:
          type: array
          description: >-
            The carriers' own words when they declined to quote — which is what
            explains an empty list. Usually empty.
          items:
            type: string
    BuyShippingLabelRequest:
      type: object
      required: [orderNumber, rateId]
      properties:
        orderNumber:
          type: string
          maxLength: 64
        rateId:
          type: string
          maxLength: 128
          description: The `id` of the rate to buy, from the rates operation.
        replace:
          type: boolean
          description: >-
            Buy a second label for an order that already has tracking on it —
            for when the first was voided. Without it such an order is refused
            with 409, since the vendor will sell a duplicate as happily as the
            first and has nothing to read back that says otherwise.
    PurchasedLabel:
      type: object
      required:
        [
          orderNumber,
          carrier,
          service,
          amount,
          currency,
          trackingNumber,
          recorded,
          testMode,
        ]
      properties:
        orderNumber:
          type: string
        carrier:
          type: string
        service:
          type: string
        amount:
          type: number
          description: What the studio was charged for the label.
        currency:
          type: string
        trackingNumber:
          type: string
        trackingUrl:
          type: string
          description: The carrier's own tracking page, when it gave one.
        labelUrl:
          type: string
          description: >-
            The label PDF to print. Served from a signed vendor URL that
            expires, so it is fetched fresh rather than stored.
        recorded:
          type: boolean
          description: >-
            Whether the tracking was written onto the Notion order. False ⇒ the
            label is bought and paid for but the write failed, so the number
            above has to be pasted on by hand — reporting that beats throwing,
            which would lose the label entirely.
        testMode:
          type: boolean
          description: This label is a test one and no carrier will carry it.
    StudioTool:
      type: string
      description: >-
        Which internal tool to run. Each names an action the atelier used to
        trigger by opening a shared-secret link from Notion — or, for
        `restock-alert`, one that would have needed such a link.
      enum:
        - milestones
        - invoice-lines
        - quote
        - status-email
        - cancellation-refund
        - return-refund
        - restock-alert
