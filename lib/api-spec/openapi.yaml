  /account/export:
    get:
      operationId: exportAccountData
      tags: [account]
      summary: Everything the studio holds about the signed-in customer
      description: >-
        Gathers every record keyed on the signed-in customer's email — their
        custom and shop orders, upcoming appointments, Client CRM record, the
        requests they have filed with the studio, the reviews they have written,
        and whether they are on the marketing list — for a data-access (GDPR /
        CCPA) request the customer can serve themselves. Read-only.


        Every source degrades independently: one that can't be read is named in
        `unavailable` rather than silently omitted, so a partial export is
        visibly partial. Photographs the customer uploaded (reference images,
        review photos) are NOT included — they live as image blocks on a Notion
        page behind short-lived signed URLs, so they are requested from the
        studio by email instead.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The customer's data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDataExport"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /account/deletion-requests:
    post:
      operationId: requestAccountDeletion
      tags: [account]
      summary: Ask the studio to delete the signed-in customer's data
      description: >-
        Files an erasure request for the signed-in customer. The request lands
        as a tagged row in the studio's contact inbox for a person to action —
        this endpoint deliberately deletes nothing itself, because orders,
        invoices and payment records are business records the studio is required
        to keep for a period, and what may be erased is a judgement rather than
        a switch.


        The one erasure it DOES perform immediately is the marketing list: the
        customer is unsubscribed from the studio's Resend audience, which is
        their own action to take and needs nobody's review.


        Filing is idempotent while a request is open — a second press reports
        the request already on file rather than adding a duplicate row to the
        inbox.
      security:
        - bearerAuth: []
      requestBody:
        # Required even though every field in it is optional: the customer is
        # identified by their session, so there is nothing the body MUST carry —
        # but a request that may legally omit its body is one the server has to
        # be ready to parse as absent, and `{}` costs the client nothing.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAccountDeletionRequest"
      responses:
        "201":
          description: Deletion request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionRequestResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/availability:
