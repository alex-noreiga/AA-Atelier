        availability grid — one entry per staff member per block of hours, with
        the weekdays it repeats on and the locations it can be booked for. This
        is the schedule the atelier edits on the dashboard; it used to live in a
        Google Sheet. Same staff gate as the rest of the studio surface: 401 when
        not signed in, 404 when signed in but not staff, 403 when staff but not
        signed in with Google.
      security:
        - bearerAuth: []
      responses:
