  /studio/reviews:
    get:
      operationId: listStudioReviews
      tags: [studio]
      summary: The review moderation queue
      description: >-
        Every review the atelier hasn't decided on yet, plus the ones it has,
        newest first — the read half of the loop the app has only ever written
        to. A review is captured at delivery with its Notion `Status` set to
        "New" and had to be promoted by hand in Notion for the site to show it;
        this is that same decision, made where the rest of the studio work
        happens.


        The three moderation states are DERIVED from the `Status` select rather
        than enumerated from it: `published` and `rejected` name the two values
        the app writes, and everything else — "New", a blank select, or any
        value the atelier invented — reads as `pending`. So an unrecognized
        status asks for a decision rather than silently publishing.


        Photos are fetched only for the pending rows (they are what a decision
        is made on) and their URLs are short-lived Notion-signed links, good for
        this page load and not for storing. Same staff gate as the rest of the
        studio surface: 401 when not signed in, 404 when signed in but not
        staff, 403 when staff but not signed in with Google.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The queue, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioReviewList"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account — the same answer a URL that
            doesn't exist gets (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/reviews/{reviewId}/status:
    put:
      operationId: setStudioReviewStatus
      tags: [studio]
      summary: Publish, reject, or re-queue a review
      description: >-
        Writes one review's moderation decision to its Notion `Status`.
        `published` is what puts a testimonial on the site, `rejected` takes it
        off (and keeps it out of the queue), and `pending` returns it to the
        queue — so a decision made in error is undone the same way it was made.


        Publishing requires the customer's own consent to publish, which the
        atelier cannot supply: without it the request is refused with 409 rather
        than writing a status the site would then decline to honour. Consent is
        on the review (`consentToPublish`), so the dashboard can say so before
        the button is pressed.
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
          description: The review's id, as returned by the list operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewStatusRequest"
      responses:
        "200":
          description: The review as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioReview"
        "400":
          description: Not a status a review can be moved to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No such review — or the caller isn't a studio account, which answers
            identically by design (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: >-
            Asked to publish a review the customer didn't consent to publishing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/settings:
    get:
      operationId: getStudioSettings
      tags: [studio]
      summary: Every studio setting, and where its value comes from
      description: >-
        The settings the atelier can retune live, each resolved the way the app
        itself resolves it: the Notion "Studio Settings" row first, then the
        environment variable of the same name, then the built-in default.


        The settings database is a free-text key/value table, and both halves of
        a row fail silently when they are wrong. A mistyped KEY is a row nothing
        reads. A mistyped VALUE is parsed, rejected, and replaced by the
        built-in default. In Notion both look exactly like a setting in force,
        which is what this read exists to end: `source` names which of the three
        is actually being used, `ignoredValue` names a configured value the app
        can't use, and `unknownRows` lists the rows that aren't settings at all,
        with the key each was probably meant to be.


        Note the resolution order has a corner worth stating: a value present in
        Notion but unusable falls back to the DEFAULT, not to the environment —
        the environment is only consulted when Notion has nothing to say.


        Same staff gate as the rest of the studio surface: 401 when not signed
        in, 404 when signed in but not staff, 403 when staff but not signed in
        with Google.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every setting, resolved, plus any row that isn't one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSettingsOverview"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Signed in, but not a studio account — the same answer a URL that
            doesn't exist gets (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/settings/{key}:
    put:
      operationId: setStudioSetting
      tags: [studio]
      summary: Save or clear one studio setting
      description: >-
        Writes one setting's value to its Notion row, creating the row when the
        key doesn't have one yet.


        The value is validated against the setting before it is written, which is
        the difference between this and typing into the Notion table: there, a
        value the app can't use saves happily and is then ignored forever. The
        write guard is allowed to be stricter than the runtime — a rush rate of
        `15` (meaning 15%) parses fine and would price a 1500% surcharge, so the
        editor refuses it even though the runtime would accept it.


        An empty value is a CLEAR, not a rejection: it hands the setting back to
        its environment variable or built-in default, and keeps the row, which
        documents the key. There is deliberately no delete.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: >-
            The setting's key — the same name as its environment variable, as
            returned by the list operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioSettingRequest"
      responses:
        "200":
          description: The setting as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSetting"
        "400":
          description: >-
            Not a setting the app reads, or not a value that setting can take.
            The message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            A studio account whose session wasn't established with Google (the
            default policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The caller isn't a studio account, which answers identically to a URL
            that doesn't exist by design (see the other studio operations).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: >-
            There is no Studio Settings database connected, so there is nowhere
            to write. The settings are environment-only until one is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Supabase Auth access token (JWT). The browser supabase-js client holds
        the session and the generated API client sends the token as
        `Authorization: Bearer <jwt>`; the server verifies it against the
        Supabase project's JWKS.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        commit:
          type: string
          description: >-
            Short git SHA of the deployed build (from VERCEL_GIT_COMMIT_SHA).
            Omitted when unknown (e.g. local dev). Lets a monitor confirm which
            build is live.
        buildTime:
          type: string
          format: date-time
          description: >-
            When the running bundle was built, injected at build time. Omitted
            when unknown. Lets a monitor flag a deploy that is unexpectedly old
            (a stale function serving a months-old build).
      required:
        - status
    OrderStatus:
      type: object
      properties:
        orderNumber:
          type: string
        orderName:
          type: string
        currentStage:
          type: string
        stages:
          type: array
          items:
            type: string
        deposits:
          type: array
          description: >-
            The custom order's staged deposits, sourced from the atelier's Notion
            invoice. One entry per deposit the atelier has set an amount for
            (first, then second); each is payable online until paid. Absent/empty
            until the atelier has created the invoice and set a deposit amount.
          items:
            $ref: "#/components/schemas/InvoiceDeposit"
        measurementsLocked:
          type: boolean
          description: >-
            True once the garment has reached the production stage at/after which
            measurements are frozen (MEASUREMENT_LOCK_FROM_STAGE). When true, a
            measurement-change request would be rejected, so the UI hides the
            request affordance.
        estimatedCompletion:
          type: string
          description: >-
            The atelier's target completion date for this custom order (the
            order's Due Date), as an ISO date (yyyy-mm-dd). A response
            pass-through, kept as a string (no format: date) so it isn't coerced
            to a Date and reserialized to a UTC timestamp. Absent until the
            atelier sets one in Notion.
        milestones:
          type: array
          description: >-
            Per-stage target completion dates from the Production Schedule,
            present once the order's milestones have been generated. One entry
            per remaining (current + upcoming) stage; completed stages have none.
            Order is not significant — match by stage name.
          items:
            type: object
            required:
              - stage
              - targetDate
            properties:
              stage:
                type: string
              targetDate:
                type: string
                description: >-
                  ISO date (yyyy-mm-dd). A pass-through string (no format: date),
                  same as estimatedCompletion.
        invoice:
          $ref: "#/components/schemas/Invoice"
        cancelled:
          type: boolean
          description: >-
            True once the atelier has cancelled the order (the `Cancelled`
            marker on the Notion order). When true the tracking page shows a
            cancelled banner and suppresses the deposit / invoice / request
            affordances. Absent/false for an active order.
      required:
        - orderNumber
        - orderName
        - currentStage
        - stages
        - measurementsLocked
        - measurementsLocked
    Invoice:
      type: object
      description: >-
        The customer's invoice for a custom order, present only once the atelier
        has itemized it and flipped the "Invoice Ready" gate. Line items and
        deposits are dollars; balanceDue is what's charged online.
      required:
        - invoiceId
        - paid
        - lineItems
        - subtotal
        - depositsCreditedTotal
        - balanceDue
      properties:
        invoiceId:
          type: string
          description: The atelier's invoice identifier (its Notion title).
        paid:
          type: boolean
          description: Whether the final balance has already been paid.
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
          description: >-
            The itemized charges (deposit lines excluded — deposits are credited
            via OrderStatus.deposits, not itemized here).
        subtotal:
          type: number
          description: Sum of the non-deposit line items, in dollars.
        depositsCreditedTotal:
          type: number
          description: Sum of the deposits already paid, in dollars.
        balanceDue:
          type: number
          description: subtotal − depositsCreditedTotal, floored at 0, in dollars.
        paymentDeadline:
          type: string
          description: The invoice's payment-due date (ISO), if the atelier set one.
    InvoiceLineItem:
      type: object
      required:
        - name
        - type
        - amount
      properties:
        name:
          type: string
          description: The line item's short name (e.g. "Main fabric").
        type:
          type: string
          description: The line type — Garment, Material, Labor, or Adjustment.
        amount:
          type: number
          description: The line total in dollars.
    InvoiceDeposit:
      type: object
      required:
        - stage
        - label
        - amount
        - paid
      properties:
        stage:
          type: string
          enum: [first_deposit, second_deposit]
          description: Which deposit this is — the payment stage used to pay it.
        label:
          type: string
          description: A display label, e.g. "First deposit".
        amount:
          type: number
          description: The deposit amount in dollars.
        paid:
          type: boolean
          description: Whether this deposit has been paid (only paid ones credit).
        sessionId:
          type: string
          description: >-
            The Stripe Checkout session id of this paid deposit, for linking to
            the on-site receipt. Present once the deposit has been paid.
    OrderNotFound:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ShopOrderStatus:
      type: object
      properties:
        orderNumber:
          type: string
        status:
          type: string
          description: The order's current fulfilment status.
        statuses:
          type: array
          description: >-
            The live ordered list of possible fulfilment statuses (read from the
            Notion "Status" workflow options), so the client can render a
            progress timeline. Never hardcode this list.
          items:
            type: string
        total:
          type: number
          description: The order total in dollars.
        cancelled:
          type: boolean
          description: >-
            True once the atelier has cancelled the shop order (the `Cancelled`
            marker on the Notion order). When true the tracking page shows a
            cancelled banner and suppresses the request affordance. Absent/false
            for an active order.
        tracking:
          type: object
          description: >-
            The carrier tracking details, surfaced once the atelier fills them in
            on the Notion order (a `Tracking Number`, an optional `Carrier` label,
            and an optional `Tracking URL`). Absent until a tracking number is
            set. When present the tracking page shows the number, linked to the
            URL when one is given.
          properties:
            number:
              type: string
              description: The carrier tracking number, shown to the customer.
            carrier:
              type: string
              description: An optional human carrier label, e.g. "USPS" or "UPS".
            url:
              type: string
              description: >-
                An optional carrier tracking URL; when present the number is
                rendered as a link to it.
          required:
            - number
      required:
        - orderNumber
        - status
        - statuses
    NewOrderRequest:
      type: object
      required:
        - fullName
        - email
        - phone
        - preferredContact
      description: >-
        A new custom-dress order. Measurements are optional: the customer either
        supplies all five now (with a measurementUnit), or sets
        measurementAppointment=true to have them taken at a scheduled fitting or
        consultation. The server rejects a body with neither.
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
        preferredContact:
          type: string
          enum: [email, phone, text]
        service:
          type: string
          description: >-
            The id of the service being ordered, from the live `GET /services`
            catalog (a bespoke commission, alterations, rhinestoning, repairs).
            It decides which of the fields below apply and which the server
            requires: only a service whose catalog entry asks for measurements
            requires them (or a measurement appointment), and a service
            performed on a piece the customer already owns requires a
            `description`. Optional — an omitted or unknown id is treated as a
            bespoke commission, so a client that predates the catalog behaves
            exactly as before.
        waist:
          type: number
          minimum: 0
        bust:
          type: number
          minimum: 0
        hips:
          type: number
          minimum: 0
        height:
          type: number
          minimum: 0
        bodyGirth:
          type: number
          minimum: 0
        measurementUnit:
          type: string
          enum: [inches, cm]
        measurementAppointment:
          type: boolean
          description: >-
            True when the customer opted to have their measurements taken at a
            scheduled fitting or consultation instead of entering them now. When
            true the measurement fields are omitted.
        description:
          type: string
          description: >-
            Free text about the piece. For a bespoke commission these are
            optional design notes; for a service performed on a garment the
            customer already owns (alterations, rhinestoning, repairs) it is the
            brief — what the piece is and what needs doing — and the server
            requires it (see `service`).
        neededBy:
          type: string
          format: date
        rush:
          type: boolean
          description: >-
            True when the customer confirmed a rush order — a neededBy date
            inside the studio's rush window, acknowledged with the disclosed
            surcharge. Recorded on the Notion order (a "Rush Order" checkbox +
            a page note) so the atelier prices the rush surcharge into the
            invoice; the app does not compute the fee itself. Optional; omitted
            for standard-timeline orders.
        referenceImageIds:
          type: array
          items:
            type: string
          description: >-
            Notion file_upload ids for customer-supplied reference / inspiration
            images, each obtained by first POSTing the image bytes to
            POST /orders/reference-images (a binary endpoint outside this
            contract, mounted like the Stripe webhook). They are attached to the
            order's Notion page as image blocks. Optional; omitted when the
            customer uploaded none.
        colors:
          type: array
          items:
            type: string
          description: >-
            Names of the colors the customer picked from the studio palette (the
            live `GET /colors` list) — a multi-select. This is a starting point
            for the consultation, not a final spec: the atelier finalizes the
            exact fabric + finish together with the customer. Recorded on the
            Notion order for the atelier (the app never reads it back). Optional;
            omitted when the customer picked none.
        colorUsage:
          type: string
          description: >-
            The customer's free-text note on how they'd like their chosen colors
            used (e.g. "emerald as the main color with gold accents on the collar,
            and a blush skirt"). Optional; omitted when blank.
        referralCode:
          type: string
          description: >-
            An optional referral code the customer received from another skater.
            The server looks it up against the Client CRM (best-effort): a valid
            code — not the customer's own — earns the new customer a welcome
            discount code now and credits the referrer once this order is first
            paid. An unknown or self-referring code is ignored, and referral
            capture never blocks the order. Optional.
    NewOrderResponse:
      type: object
      required:
        - orderNumber
      properties:
        orderNumber:
          type: string
    NewMeasurementChangeRequest:
      type: object
      required:
        - email
      description: >-
        A request to change an order's measurements. Like a new order,
        measurements are optional: the customer either supplies all five now
        (with a measurementUnit), or sets measurementAppointment=true to be
        re-measured at a fitting/consultation. The server rejects a request with
        neither.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match the order is rejected.
        waist:
          type: number
          minimum: 0
        bust:
          type: number
          minimum: 0
        hips:
          type: number
          minimum: 0
        height:
          type: number
          minimum: 0
        bodyGirth:
          type: number
          minimum: 0
        measurementUnit:
          type: string
          enum: [inches, cm]
        measurementAppointment:
          type: boolean
          description: >-
            True when the customer would rather be re-measured at a fitting or
            consultation than enter values now. When true the measurement fields
            are omitted.
        note:
          type: string
          description: Optional free-text note explaining the requested change.
    NewMeasurementChangeResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    NewCancellationRequest:
      type: object
      required:
        - email
      description: >-
        A request to cancel an order. The email is verified against the one on
        the order; a request whose email doesn't match is rejected. An optional
        reason is passed through to the atelier for context.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match the order is rejected.
        reason:
          type: string
          maxLength: 2000
          description: Optional free-text reason for the cancellation.
    NewCancellationResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    NewReviewRequest:
      type: object
      required:
        - email
        - rating
        - comment
      description: >-
        A post-delivery review of a finished custom order. The customer supplies
        a star rating and a short testimonial; a display name, publish consent,
        and photos of the finished piece are optional. The server verifies the
        email against the order and only accepts the review once the order has
        been delivered.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A review whose
            email doesn't match the order is rejected.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The star rating, 1 (poor) to 5 (excellent).
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          description: The customer's testimonial about their finished piece.
        displayName:
          type: string
          maxLength: 120
          description: >-
            How the customer would like to be credited if the review is
            featured (e.g. "Ada L." or "Ada, Chicago"). Optional.
        consentToPublish:
          type: boolean
          description: >-
            Whether the customer gives permission to feature this review (and
            any photos) publicly, e.g. on the site's testimonials/portfolio.
            Defaults to false.
        photoIds:
          type: array
          description: >-
            Notion file_upload ids for photos of the finished piece, uploaded
            ahead of time via POST /orders/reference-images. Attached to the
            review's Notion page as image blocks.
          items:
            type: string
    NewReviewResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    PublishedReview:
      type: object
      required:
        - id
        - rating
        - comment
      description: >-
        One curated testimonial, as shown on the site. Deliberately narrow: the
        author's email, order number, and verification flag stay in Notion and
        are never served here.
      properties:
        id:
          type: string
          description: The review's Notion page id, used only as a render key.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The star rating, 1 (poor) to 5 (excellent).
        comment:
          type: string
          description: The customer's testimonial.
        customerName:
          type: string
          description: >-
            How the customer asked to be credited. Omitted when they left the
            credit blank, in which case the testimonial is shown unattributed.
        publishedAt:
          type: string
          format: date-time
          description: >-
            When the review was submitted (its Notion created time), used to
            order the list and to date the testimonial.
    ReviewList:
      type: object
      required:
        - reviews
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/PublishedReview"
    ReviewModerationStatus:
      type: string
      enum: [pending, published, rejected]
      description: >-
        Where a review stands with the atelier. `pending` is anything not yet
        decided — including the "New" it is captured with — so a review can only
        ever be waiting, shown, or set aside.
    MaterialAlert:
      type: object
      description: A material at or below its reorder point — something to buy.
      required: [id, name, stockOnHand, minimumStock, shortfall]
      properties:
        id:
          type: string
          description: The material's Notion page id.
        name:
          type: string
          description: The material as the atelier names it.
        category:
          type: string
          description: Fabric / Applique / Crystal / Packaging / Notions. Omitted when unset.
        stockOnHand:
          type: number
          description: >-
            Units remaining, from the Notion stock formula. Always a number here
            — a material whose stock is unknown is never reported as an alert.
        minimumStock:
          type: number
          description: The reorder point the atelier set.
        shortfall:
          type: number
          description: >-
            How far below the reorder point it is, rounded to two places. `0`
            when it has landed exactly on it — a reorder point is the level you
            buy AT, so that still counts. The list is ranked by this.
        link:
          type: string
          description: Where to buy it again, when the atelier recorded a link.
        pricePerUnit:
          type: number
          description: Dollars per unit, when recorded.
    UntrackedMaterial:
      type: object
      description: >-
        A material no alert can ever fire for, and why — so an unwatched
        material is visible rather than the alert list just looking quiet.
      required: [id, name, reason]
      properties:
        id:
          type: string
          description: The material's Notion page id.
        name:
          type: string
        category:
          type: string
        reason:
          type: string
          enum: [no-reorder-point, stock-unknown]
          description: >-
            `no-reorder-point` — `Minimum Stock` is unset, so nothing can trip.
            `stock-unknown` — the stock formula produced no number (typically a
            material with no intake lines recorded yet).
        stockOnHand:
          type: number
          description: >-
            Present only for `no-reorder-point`, where the stock IS known and
            only the threshold is missing.
    MaterialsOverview:
      type: object
      description: The materials panel — what to reorder, and what isn't being watched.
      required: [lowStock, untracked, suppressedCount, totalCount, configured]
      properties:
        lowStock:
          type: array
          description: At or below the reorder point, worst shortfall first.
          items:
            $ref: "#/components/schemas/MaterialAlert"
        untracked:
          type: array
          description: Not watched, and why — alphabetical.
          items:
            $ref: "#/components/schemas/UntrackedMaterial"
        suppressedCount:
          type: integer
          description: >-
            How many materials the atelier has muted. Reported so the panel can
            say so rather than the numbers silently not adding up.
        totalCount:
          type: integer
          description: Every material row read, muted ones included.
        configured:
          type: boolean
          description: >-
            False when the materials database isn't wired up, in which case the
            lists are empty and the panel says why instead of rendering an empty
            list that reads as "all good".
        unreachable:
          type: boolean
          description: >-
            True when the database id IS set but Notion answered 404 — the
            integration has not been shared with the database, or the id is
            wrong. The lists are empty and the panel says what to fix; reported
            rather than thrown because it is a configuration state only a human
            can clear, not an outage worth erroring the panel over. Absent when
            the read worked.
    StudioReview:
      type: object
      description: >-
        One review as the moderation queue shows it. Unlike the public
        `PublishedReview`, this is the whole row: the atelier is deciding
        whether to put it on the site, and who wrote it and whether their email
        matched the order are part of that judgement. Staff-only.
      required:
        - id
        - rating
        - comment
        - status
        - consentToPublish
        - emailVerified
        - photos
      properties:
        id:
          type: string
          description: The review's Notion page id; also what a decision is addressed to.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The star rating, 1 (poor) to 5 (excellent).
        comment:
          type: string
          description: The customer's testimonial, as written.
        customerName:
          type: string
          description: >-
            How the customer asked to be credited. Omitted when they left it
            blank, in which case a published testimonial is unattributed.
        orderNumber:
          type: string
          description: The order the review is for. Omitted on a row that carries none.
        email:
          type: string
          description: >-
            The address the review was submitted from. Shown so the atelier can
            recognize the customer; never served publicly.
        emailVerified:
          type: boolean
          description: >-
            Whether that address matched the one stored on the order. False on a
            legacy order that has no email stored — accepted at capture, but
            worth vetting before it goes on the site.
        consentToPublish:
          type: boolean
          description: >-
            Whether the customer agreed to their words being published. Publishing
            without it is refused, so this is what the dashboard reads to know
            whether the button can be offered at all.
        status:
          $ref: "#/components/schemas/ReviewModerationStatus"
        rawStatus:
          type: string
          description: >-
            The `Status` select exactly as Notion holds it, when it is set. Shown
            for a row whose value the app doesn't recognize, so "why is this
            still pending?" is answerable without opening Notion.
        submittedAt:
          type: string
          format: date-time
          description: When the review was submitted (its Notion created time).
        photos:
          type: array
          description: >-
            Photographs of the finished piece, as URLs. Notion-signed and
            short-lived, so they are for rendering this page and nothing else.
            Empty for a decided review — photos are fetched only for the rows
            still awaiting a decision.
          items:
            type: string
        notionUrl:
          type: string
          description: The review's page in Notion, for anything this queue doesn't show.
    StudioSetting:
      type: object
      description: >-
        One atelier-editable setting, resolved. The key is the name of its
        environment variable and of its Notion row's `Setting` title — that
        identity 1:1 across all three is what keeps them from ever meaning
        different things.
      required:
        [
          key,
          label,
          group,
          kind,
          description,
          defaultValue,
          effectiveValue,
          source,
        ]
      properties:
        key:
          type: string
          description: The setting's name, identical to its environment variable.
          example: RUSH_SURCHARGE_RATE
        label:
          type: string
          description: The setting's name in the atelier's terms.
          example: Rush surcharge
        group:
          type: string
          description: The section the editor shows this under.
          example: Orders & pricing
        kind:
          type: string
          description: >-
            What shape the value is, so the editor can render the right input and
            say what it expects.
          enum:
            [number, integer, percent, money, text, email, timezone, palette]
        description:
          type: string
          description: What the setting does, and what changing it affects.
        notionValue:
          type: string
          description: >-
            What the Notion row holds. Absent when there is no row for this key,
            or its Value is blank (which reads as unset everywhere).
        envValue:
          type: string
          description: >-
            What the environment variable holds. Absent when it isn't set. These
            are non-secret tunables by definition — secrets are deliberately not
            settings.
        defaultValue:
          type: string
          description: >-
            The built-in fallback, as text. Empty when the fallback isn't a value
            at all — an unset studio inbox means the notification is skipped, not
            sent somewhere else.
        defaultLabel:
          type: string
          description: >-
            How to phrase the fallback when `defaultValue` alone doesn't say it,
            e.g. "The studio inbox above".
        effectiveValue:
          type: string
          description: The value the app is using right now.
        source:
          $ref: "#/components/schemas/SettingSource"
        ignoredValue:
          type: string
          description: >-
            Present when a value IS configured but the app can't use it, so the
            default is in force instead. This is the silent failure the editor
            exists to surface; in Notion the row looks entirely normal.
        min:
          type: number
          description: Lower bound for a numeric setting.
        max:
          type: number
          description: Upper bound for a numeric setting.
        step:
          type: number
          description: Step for a numeric input.
        unit:
          type: string
          description: The unit shown beside the input, e.g. "days" or "%".
        placeholder:
          type: string
          description: An example value, shown when the field is empty.
    SettingSource:
      type: string
      description: >-
        Which of the three layers the effective value came from. `default` also
        covers a configured-but-unusable value (see `ignoredValue`), because
        that is what the app does with one — it does NOT fall through to the
        next layer down.
      enum: [notion, environment, default]
    UnknownSettingRow:
      type: object
      description: >-
        A row in the settings database whose key isn't a setting the app reads —
        so nothing has ever read it, and nothing ever will. Listing it is the
        only way a mistyped key is visible anywhere.
      required: [key]
      properties:
        key:
          type: string
          description: The key as typed in the Notion row.
        value:
          type: string
          description: What that row holds, when it holds anything.
        suggestion:
          type: string
          description: >-
            The setting this was probably meant to be, when one is within a typo
            or two of it. Absent when nothing is close.
    StudioSettingsOverview:
      type: object
      description: Every setting the app reads, plus any row that isn't one.
      required: [configured, settings, unknownRows]
      properties:
        configured:
          type: boolean
          description: >-
            Whether a Studio Settings database is connected. False ⇒ every value
            comes from the environment or a default and nothing can be edited
            here — which is a state only a human can clear, so the editor says so
            rather than offering a Save with nowhere to write.
        settings:
          type: array
          items:
            $ref: "#/components/schemas/StudioSetting"
        unknownRows:
          type: array
          items:
            $ref: "#/components/schemas/UnknownSettingRow"
    StudioSettingRequest:
      type: object
      description: >-
        The value to save. An empty string clears the setting, handing it back to
        its environment variable or built-in default.
      required: [value]
      properties:
        value:
          type: string
          maxLength: 2000
    StudioReviewList:
      type: object
      description: >-
        The moderation queue: the pending reviews the atelier still owes a
        decision, and the decided ones for reference, newest first in both
        cases.
      required: [pending, decided]
      properties:
        pending:
          type: array
          description: Awaiting a decision, oldest submission first — the queue proper.
          items:
            $ref: "#/components/schemas/StudioReview"
        decided:
          type: array
          description: >-
            Already published or rejected, newest first. Capped, and carrying no
            photos — it is a record of what was decided, not a second queue.
          items:
            $ref: "#/components/schemas/StudioReview"
        truncated:
          type: boolean
          description: >-
            True when there are more reviews than one read covers, so the queue
            says it is partial instead of looking complete. Older rows are still
            in Notion.
    ReviewStatusRequest:
      type: object
      description: The moderation decision to record against a review.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ReviewModerationStatus"
    NewContactRequest:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        message:
          type: string
          minLength: 1
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never see or
            fill; a non-empty value marks the submission as spam and it is
            silently dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when the client can't measure it (treated as human).
    NewContactResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NewNotifyRequest:
      type: object
      required:
        - email
        - item
      properties:
        email:
          type: string
          format: email
        item:
          type: string
          minLength: 1
          description: The sold-out variant's name, e.g. "Bow Fleece Soaker — Black".
        size:
          type: string
          description: >-
            Set only when the customer asked about one specific sold-out size
            band; absent when the whole variant is sold out.
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never fill; a
            non-empty value marks the submission as spam and it is silently
            dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when unmeasurable (treated as human).
    NewNotifyResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NewNewsletterRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        source:
          type: string
          description: >-
            Where the opt-in came from, e.g. "footer" or "order form". Recorded
            for the atelier's own segmentation; the customer never sees it.
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never fill; a
            non-empty value marks the submission as spam and it is silently
            dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when unmeasurable (treated as human).
    NewNewsletterResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NewReturnRequest:
      type: object
      required:
        - email
        - kind
        - reason
      description: >-
        A request to return or exchange a ready-to-wear shop order. The server
        verifies the email against the one on the order; the atelier reviews and
        actions accepted requests by hand (this endpoint never refunds or edits
        the order).
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match the order is rejected.
        kind:
          type: string
          enum: [return, exchange]
          description: Whether the customer wants a refund (return) or a swap (exchange).
        reason:
          type: string
          enum: [wrong_size, damaged, not_as_expected, changed_mind, other]
          description: Why the customer is returning or exchanging the item.
        items:
          type: string
          description: >-
            Which piece(s) the request covers, in the customer's own words.
            Optional — the atelier can also read the order in Notion.
        exchangeFor:
          type: string
          description: >-
            For an exchange, the size/colour/piece the customer wants instead.
            Ignored for a return.
        note:
          type: string
          description: Optional free-text note with anything else the atelier should know.
    NewReturnResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    ProductVariant:
      type: object
      required:
        - id
        - name
        - available
        - photos
        - sizes
      properties:
        id:
          type: string
        name:
          type: string
        available:
          type: boolean
        price:
          type: number
        description:
          type: string
        photos:
          type: array
          items:
            type: string
        sizes:
          type: array
          description: >-
            Every size band this item is offered in ("Sizes Offered" in Notion),
            each flagged with whether it is currently in stock ("Sizes
            Available"). A size that is offered but not available is sold out,
            and the shop offers a per-size back-in-stock request. Empty for
            one-size items (soakers, cloths).
          items:
            $ref: "#/components/schemas/SizeOption"
        quantityAvailable:
          type: number
        addOnIds:
          type: array
          description: >-
            Ids of other ProductVariants offered as matching add-ons for this
            variant (the "Matching Add-ons" self-relation in the Notion
            inventory database) — e.g. a skate soaker points at its matching
            blade towel. Each id is the `id` of a ProductVariant that also
            appears in this same product list, so clients resolve the add-on's
            name/price/availability locally rather than the payload carrying it
            twice. Empty or absent when the variant has no add-ons.
          items:
            type: string
    SizeOption:
      type: object
      required:
        - name
        - available
      properties:
        name:
          type: string
          description: A size band, e.g. "Adult M".
        available:
          type: boolean
          description: False when the size is offered but currently sold out.
    Product:
      type: object
      required:
        - id
        - title
        - category
        - sized
        - variants
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        sized:
          type: boolean
          description: >-
            Whether this product's category should show the ready-to-wear body-
            measurement size guide. Computed server-side from the Notion "Product
            Categories" database (a "Show size guide" checkbox per category) when
            configured, otherwise from a built-in fallback list. Clients render
            the size chart from this flag and must not hardcode which categories
            are sized.
        sizeGuide:
          type: string
          enum:
            - garment
            - soaker
          description: >-
            Which size chart this product's category uses. "garment" (the
            default, and the value when this field is omitted) is the ready-to-
            wear body-measurement chart; "soaker" is the skate-soaker blade-length
            chart. Resolved server-side from the Notion "Product Categories"
            database ("Size guide type" select per category, following the
            inventory `Category` relation) — clients pick the chart from this and
            must not hardcode which category is a soaker. Only meaningful when
            `sized` is true.
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
    ProductList:
      type: object
      required:
        - products
        - categories
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        categories:
          type: array
          description: >-
            The shop's category filters, read live from the Notion "Product
            Categories" database and returned in the order the atelier arranged
            them (its `Sort` field). Each inventory item links to its category
            through a `Category` relation. Editing the categories in Notion
            changes this list without a redeploy, so clients must not hardcode it.
          items:
            type: string
    Color:
      type: object
      required:
        - id
        - name
        - hex
      properties:
        id:
          type: string
          description: A stable slug of the name ("Rose Gold" → "rose-gold").
        name:
          type: string
        hex:
          type: string
          description: Hex color fill for the chip, e.g. "#2E5CB8".
    ColorList:
      type: object
      required:
        - colors
      properties:
        colors:
          type: array
          description: >-
            The studio's intake color palette — the atelier-editable
            `COLOR_PALETTE` Studio Settings value, or a built-in primary-color
            palette when unset. Always non-empty.
          items:
            $ref: "#/components/schemas/Color"
    Service:
      type: object
      required:
        - id
        - name
        - summary
        - measurements
        - colors
        - detailsRequired
        - detailsLabel
        - detailsHelp
      description: >-
        One service a custom order can be placed for, with the rules that decide
        what the intake form asks for. The flags are the contract's half of a
        targeted business rule held in server code (like the appointment-type
        catalog): the same definitions gate `POST /orders`.
      properties:
        id:
          type: string
          description: Stable id, sent back as `service` on a new order.
        name:
          type: string
          description: Display name, e.g. "Fittings & Alterations".
        summary:
          type: string
          description: One line describing the service, shown on the picker.
        measurements:
          type: boolean
          description: >-
            Whether this service asks for the five body measurements. When
            false the form omits them entirely and the server does not require
            values (nor a measurement appointment) — only a garment made from
            scratch needs them.
        colors:
          type: boolean
          description: >-
            Whether this service offers the studio colour palette and the
            "how would you like these used" note.
        detailsRequired:
          type: boolean
          description: >-
            Whether the order's free-text `description` is required. True for
            the services performed on a piece the customer already owns, where
            that description IS the brief; false for a bespoke commission, whose
            design notes are optional.
        detailsLabel:
          type: string
          description: Field label for `description` on this service's form.
        detailsHelp:
          type: string
          description: Placeholder / prompt for `description` on this service's form.
    ServiceList:
      type: object
      required:
        - services
      properties:
        services:
          type: array
          description: >-
            The intake service catalog, in the order the form should offer it.
            Always non-empty; the first entry is the default when a new order
            names no service.
          items:
            $ref: "#/components/schemas/Service"
    CheckoutItem:
      type: object
      required:
        - variantId
        - quantity
      properties:
        variantId:
          type: string
          description: >-
            The Notion inventory page id of the variant being purchased (the
            `id` on a ProductVariant).
        size:
          type: string
          description: >-
            The selected size band, required when the variant is offered in
            sizes and omitted for one-size items.
        quantity:
          type: integer
          minimum: 1
    CreateCheckoutSessionRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CheckoutItem"
    CheckoutSessionResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: The Stripe-hosted checkout URL to redirect the browser to.
    PaymentSessionResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: The Stripe-hosted checkout URL for the payment.
    ReceiptLineItem:
      type: object
      required:
        - description
        - quantity
        - amount
      properties:
        description:
          type: string
        quantity:
          type: number
        amount:
          type: number
          description: The line total in dollars (unit price × quantity).
    CheckoutSessionStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: >-
            The Stripe payment status of the session, e.g. "paid", "unpaid", or
            "no_payment_required".
        orderNumber:
          type: string
          description: >-
            The human-readable shop order number (e.g. "SHP-…") the customer can
            use to track their order. Present for shop-cart orders; absent for
            custom-order payment sessions.
        kind:
          type: string
          description: >-
            What the session paid for — "shop" for a shop-cart order,
            "custom_payment" for a custom-order deposit or balance (from the
            session's metadata.kind). Lets the success page skip clearing the
            cart on a custom-order receipt view.
        email:
          type: string
          description: The customer's email, present once the session is complete.
        currency:
          type: string
          description: ISO currency code of the totals, e.g. "usd".
        lineItems:
          type: array
          description: The purchased items, for an on-site receipt.
          items:
            $ref: "#/components/schemas/ReceiptLineItem"
        amountSubtotal:
          type: number
          description: Items subtotal in dollars (before shipping and tax).
        amountShipping:
          type: number
          description: Shipping charged in dollars.
        amountTax:
          type: number
          description: Tax charged in dollars (Stripe Tax).
        amountTotal:
          type: number
          description: Grand total in dollars (items + shipping + tax).
    AppointmentType:
      type: object
      required:
        - id
        - name
        - durationMinutes
        - staff
        - locations
      properties:
        id:
          type: string
        name:
          type: string
        durationMinutes:
          type: integer
          description: How long the appointment runs, in minutes.
        description:
          type: string
        staff:
          type: array
          description: The staff members who offer this appointment type.
          items:
            type: string
        locations:
          type: array
          description: The locations this type is offered in.
          items:
            type: string
            enum: [in-person, virtual]
        requiresOrder:
          type: boolean
          description: >-
            When true, this type may only be booked against an existing order —
            the request must carry an orderNumber that matches a real order (and
            the booking email must match the one on that order). Order-scoped
            types like fittings and design reviews set this.
        requiresProjectDetails:
          type: boolean
          description: >-
            When true, the request must include a non-empty projectDetails
            describing what the customer wants made. New-customer types like
            consultations set this to filter out uncertain requests.
    AppointmentOptions:
      type: object
      required:
        - timezone
        - types
      properties:
        timezone:
          type: string
          description: >-
            IANA timezone the atelier's hours and slot times are expressed in,
            for the client to render slots and label the times.
        types:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentType"
    AvailabilitySlot:
      type: object
      required:
        - start
        - end
        - staff
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        staff:
          type: string
          description: The staff member who would take this slot.
    AppointmentAvailability:
      type: object
      required:
        - timezone
        - slots
      properties:
        timezone:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
    NewAppointmentRequest:
      type: object
      required:
        - typeId
        - location
        - start
        - fullName
        - email
      properties:
        typeId:
          type: string
        staff:
          type: string
          description: A specific staff member, or omitted for no preference.
        location:
          type: string
          enum: [in-person, virtual]
        start:
          type: string
          format: date-time
          description: >-
            The chosen slot's start instant, as returned by the availability
            endpoint.
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        preferredContact:
          type: string
          enum: [email, phone, text]
        notes:
          type: string
        orderNumber:
          type: string
          description: >-
            The customer's order number. Required for order-scoped types
            (requiresOrder) — the server verifies it against a real order whose
            email matches the booking email. Ignored for other types.
        projectDetails:
          type: string
          description: >-
            A short description of what the customer wants made. Required for
            new-customer types (requiresProjectDetails); ignored otherwise.
    NewAppointmentResponse:
      type: object
      required:
        - confirmationCode
        - type
        - staff
        - location
        - start
        - end
      properties:
        confirmationCode:
          type: string
        type:
          type: string
          description: The booked appointment type's display name.
        staff:
          type: string
        location:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meetingUrl:
          type: string
          description: >-
            The Google Meet link for a virtual appointment, when one was created.
        calendarLink:
          type: string
          description: A link to the booking's Google Calendar event.
    AppointmentDetails:
      type: object
      description: >-
        A booked appointment's current state, read live from Google Calendar for
        the self-service reschedule / cancel page.
      required:
        - status
        - confirmationCode
        - typeId
        - typeName
        - staff
        - location
        - locationLabel
        - start
        - end
        - timezone
        - canModify
      properties:
        status:
          type: string
          enum: [confirmed, cancelled]
          description: Whether the appointment is still on the calendar or was cancelled.
        timezone:
          type: string
          description: >-
            IANA timezone the atelier's hours and slot times are expressed in,
            for the client to render the appointment's times.
        confirmationCode:
          type: string
        typeId:
          type: string
          description: >-
            The appointment type's id, so the reschedule flow can re-query
            availability for the same type.
        typeName:
          type: string
        staff:
          type: string
        location:
          type: string
          enum: [in-person, virtual]
        locationLabel:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meetingUrl:
          type: string
          description: The Google Meet link for a virtual appointment, when one exists.
        canModify:
          type: boolean
          description: >-
            Whether the appointment can still be rescheduled or cancelled — false
            once it has started or been cancelled.
    RescheduleAppointmentRequest:
      type: object
      required:
        - token
        - start
      properties:
        token:
          type: string
          description: The signed token from the manage link.
        start:
          type: string
          format: date-time
          description: >-
            The new slot's start instant, as returned by the availability
            endpoint.
    CancelAppointmentRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The signed token from the manage link.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MessageResponse:
      type: object
      description: A generic human-readable acknowledgement.
      required: [message]
      properties:
        message:
          type: string
    AccountOverview:
      type: object
      description: >-
        Everything tied to the signed-in customer's email — the data the account
        dashboard renders.
      required: [email, customOrders, shopOrders, appointments]
      properties:
        email:
          type: string
          description: The signed-in customer's email.
        customOrders:
          type: array
          description: >-
            The customer's custom (bespoke) orders, newest-relevant first. Empty
            when none match the signed-in email.
          items:
            $ref: "#/components/schemas/AccountOrderSummary"
        shopOrders:
          type: array
          description: >-
            The customer's ready-to-wear shop orders. Empty when none match the
            signed-in email (older shop orders without an order number are omitted).
          items:
            $ref: "#/components/schemas/AccountShopOrderSummary"
        appointments:
          type: array
          description: >-
            The customer's upcoming appointments, read live from Google Calendar
            by the email stamped on each booking, soonest first. Empty when none
            are upcoming, when the calendar integration isn't configured, or (a
            best-effort read) when the calendar can't be reached. Bookings made
            before the customer email was stamped on the event are not listed.
          items:
            $ref: "#/components/schemas/AccountAppointmentSummary"
        referral:
          $ref: "#/components/schemas/AccountReferral"
    AccountReferral:
      type: object
      description: >-
        The signed-in customer's referral-program state. Present only when the
        Client CRM is configured (omitted entirely otherwise, so the dashboard's
        referral card simply doesn't render).
      required: [code]
      properties:
        code:
          type: string
          description: The customer's own shareable referral code.
        creditAmount:
          type: number
          description: >-
            The credit, in dollars, that a referred skater's first paid order
            earns this customer — shown in the share copy so the value is
            concrete.
        returningCode:
          type: string
          description: >-
            A standing personal discount code for this returning customer,
            present once they've earned it (a qualifying repeat order). Absent
            otherwise.
    AccountOrderState:
      type: string
      enum:
        - active
        - completed
        - cancelled
      description: >-
        Where an order sits in its lifecycle, derived server-side so the
        dashboard never has to infer it from a stage/status name. "completed"
        means the order has reached the final stage/status in its live list
        (delivered for a custom order, fulfilled for a shop order); "cancelled"
        means the atelier has cancelled it (and takes precedence over
        "completed"); everything else is "active".
    AccountOrderSummary:
      type: object
      description: A custom order as shown on the account dashboard (links out to the full tracking + invoice views).
      required: [orderNumber, orderName, currentStage, stages, state]
      properties:
        orderNumber:
          type: string
        orderName:
          type: string
        currentStage:
          type: string
        state:
          $ref: "#/components/schemas/AccountOrderState"
        stages:
          type: array
          description: The live ordered stage list, so the dashboard can show progress (e.g. "3 of 6").
          items:
            type: string
        estimatedCompletion:
          type: string
          description: >-
            The order's target completion date (its Due Date) as an ISO date
            (yyyy-mm-dd). A pass-through string (no format: date). Absent until
            the atelier sets one.
        measurements:
          $ref: "#/components/schemas/AccountMeasurements"
    AccountShopOrderSummary:
      type: object
      description: A ready-to-wear shop order as shown on the account dashboard.
      required: [orderNumber, status, state]
      properties:
        orderNumber:
          type: string
        status:
          type: string
          description: The order's current fulfilment status.
        state:
          $ref: "#/components/schemas/AccountOrderState"
        total:
          type: number
          description: The order total in dollars, when recorded.
    AccountMeasurements:
      type: object
      description: >-
        The measurements on file for a custom order, read from the order's Notion
        properties. Absent when the customer chose to have measurements taken at a
        fitting, or for orders placed before measurements were stored as readable
        properties (those values remain only in the order's page body). Individual
        values may be absent for a partially-filled order.
      required: [unit]
      properties:
        unit:
          type: string
          enum: [inches, cm]
          description: The unit the measurement values are expressed in.
        waist:
          type: number
        bust:
          type: number
        hips:
          type: number
        height:
          type: number
        bodyGirth:
          type: number
    AccountAppointmentSummary:
      type: object
      description: >-
        An upcoming appointment as shown on the account dashboard. Mirrors
        AppointmentDetails and additionally carries a signed manage token so the
        dashboard can reschedule or cancel it in place through the existing
        appointment-manage endpoints (no separate manage-link navigation needed).
      required:
        - status
        - confirmationCode
        - typeId
        - typeName
        - staff
        - location
        - locationLabel
        - start
        - end
        - timezone
        - canModify
        - manageToken
      properties:
        status:
          type: string
          enum: [confirmed, cancelled]
        timezone:
          type: string
          description: IANA timezone the appointment's times are expressed in.
        confirmationCode:
          type: string
        typeId:
          type: string
        typeName:
          type: string
        staff:
          type: string
        location:
          type: string
          enum: [in-person, virtual]
        locationLabel:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meetingUrl:
          type: string
          description: The Google Meet link for a virtual appointment, when one exists.
        canModify:
          type: boolean
          description: >-
            Whether the appointment can still be rescheduled or cancelled — false
            once it has started or been cancelled.
        manageToken:
          type: string
          description: >-
            A signed token (the same one the confirmation email's manage link
            carries) authorizing reschedule/cancel of this specific appointment
            via the appointment-manage endpoints.
    StaffWeekday:
      type: string
      description: A day of the week a block of working hours repeats on.
      enum:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday
    StaffAvailabilityEntry:
      type: object
      description: >-
        One recurring block of a staff member's standing working hours — the
        POSITIVE availability the slot calculator starts from, before it
        subtracts whatever their Google Calendar says they are busy with. A day
        off is a calendar event, not an edit here.
      required: [id, staff, calendarEmail, weekdays, start, end, locations]
      properties:
        id:
          type: string
          description: Identifies the entry for an update or a delete.
        staff:
          type: string
          description: >-
            The staff member these hours belong to. Always one of the names the
            studio books (see `staff` on the list response).
        calendarEmail:
          type: string
          format: email
          description: >-
            The Google Calendar this person's bookings are read from and written
            to. The same address is expected on every entry for one person; if
            they differ, the first one read wins.
        weekdays:
          type: array
          description: The weekdays this block repeats on.
          items:
            $ref: "#/components/schemas/StaffWeekday"
        start:
          type: string
          description: When the block starts, as 24-hour `HH:MM` local studio time.
          example: "10:00"
        end:
          type: string
          description: >-
            When the block ends, as 24-hour `HH:MM` local studio time. Always
            later than `start` — an entry that ends before it begins is rejected
            rather than silently ignored.
          example: "17:00"
        locations:
          type: array
          description: Which locations may be booked inside this block.
          items:
            type: string
            enum: [in-person, virtual]
    StaffAvailabilityRequest:
      type: object
      description: >-
        One block of working hours to save. The whole entry is sent on both
        create and update, so the two paths validate identically.
      required: [staff, calendarEmail, weekdays, start, end, locations]
      properties:
        staff:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Must be a staff member the studio books — the appointment catalog's
            list, returned as `staff` by the list operation. A name outside it
            would produce hours nothing could ever be booked into.
        calendarEmail:
          type: string
          format: email
          maxLength: 254
        weekdays:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StaffWeekday"
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour `HH:MM`.
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour `HH:MM`, later than `start`.
        locations:
          type: array
          minItems: 1
          items:
            type: string
            enum: [in-person, virtual]
    StaffAvailabilityList:
      type: object
      description: >-
        The whole standing schedule, plus the staff it may be assigned to — so
        the editor offers the names the booking catalog actually knows instead
        of a free-text field that has to match one exactly.
      required: [entries, staff]
      properties:
        entries:
          type: array
          description: Every block of hours on record, grouped by nothing in particular.
          items:
            $ref: "#/components/schemas/StaffAvailabilityEntry"
        staff:
          type: array
          description: The staff members the studio books appointments with.
          items:
            type: string
    StudioAccess:
      type: object
      description: >-
        The answer to "may this account use the studio dashboard?". Only ever
        returned to a caller the staff gate has already admitted, so `staff` is
        always true — the field exists so the response is self-describing rather
        than an empty body, and so a client reads a value instead of inferring
        from a status code.
      required: [staff]
      properties:
        staff:
          type: boolean
          description: Always true. A non-staff caller receives 401/403 instead.
    StudioAnalytics:
      type: object
      description: >-
        The atelier's own figures, aggregated from the live Notion databases for
        the internal studio dashboard. Every money value is US dollars.
      required:
        [
          generatedAt,
          customOrders,
          shopOrders,
          production,
          revenue,
          payments,
          topItems,
        ]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: >-
            When these figures were computed. The server caches an aggregation
            briefly, so this can trail the request by up to a minute.
        customOrders:
          $ref: "#/components/schemas/StudioPipeline"
        shopOrders:
          $ref: "#/components/schemas/StudioPipeline"
        production:
          $ref: "#/components/schemas/StudioProductionLoad"
        revenue:
          type: array
          description: >-
            One entry per month over the trailing window, oldest first. Months
            with no activity are included as zeroes so a chart has no gaps.
          items:
            $ref: "#/components/schemas/StudioRevenueMonth"
        payments:
          $ref: "#/components/schemas/StudioPaymentTotals"
        topItems:
          type: array
          description: >-
            The shop's best sellers, most-ordered first. Empty when no shop
            order carries its inventory relation (legacy orders, or the
            relation-links flag being off) — item-level figures are only as good
            as that link.
          items:
            $ref: "#/components/schemas/StudioTopItem"
    StudioPipeline:
      type: object
      description: >-
        How a set of orders is distributed across its live workflow — the custom
        order Stage list, or the shop order fulfilment Status list.
      required: [total, active, completed, cancelled, stages]
      properties:
        total:
          type: integer
          description: Every order of this kind on record.
        active:
          type: integer
          description: Orders neither cancelled nor at the final stage.
        completed:
          type: integer
          description: Orders sitting at the last stage in the live list.
        cancelled:
          type: integer
        stages:
          type: array
          description: >-
            Active orders per stage, in the live stage order (stages with no
            orders are included as zeroes, so the pipeline reads end to end).
          items:
            $ref: "#/components/schemas/StudioStageCount"
    StudioStageCount:
      type: object
      required: [stage, count]
      properties:
        stage:
          type: string
        count:
          type: integer
    StudioProductionLoad:
      type: object
      description: >-
        The making-side workload: active custom orders measured against the due
        dates the atelier has set.
      required:
        [
          activeOrders,
          scheduled,
          unscheduled,
          overdue,
          dueThisWeek,
          dueThisMonth,
          rush,
          upcoming,
        ]
      properties:
        activeOrders:
          type: integer
          description: Custom orders in progress (not cancelled, not delivered).
        scheduled:
          type: integer
          description: Of those, the ones carrying a Due Date.
        unscheduled:
          type: integer
          description: >-
            Active orders with no Due Date — invisible to the production
            schedule until the atelier sets one.
        overdue:
          type: integer
          description: Active orders whose due date has passed.
        dueThisWeek:
          type: integer
          description: Active orders due within the next 7 days (today included).
        dueThisMonth:
          type: integer
          description: Active orders due within the next 30 days (today included).
        rush:
          type: integer
          description: Active orders flagged as rush at intake.
        upcoming:
          type: array
          description: >-
            The nearest-due active orders, soonest first (overdue ones lead),
            capped to a short list for the dashboard.
          items:
            $ref: "#/components/schemas/StudioScheduledOrder"
    StudioScheduledOrder:
      type: object
      required: [orderNumber, orderName, stage, dueDate, overdue]
      properties:
        orderNumber:
          type: string
        orderName:
          type: string
        stage:
          type: string
        dueDate:
          type: string
          description: The order's Due Date as YYYY-MM-DD.
        overdue:
          type: boolean
        rush:
          type: boolean
    StudioRevenueMonth:
      type: object
      description: >-
        A month of trade. The two money figures are deliberately NOT summed:
        shop revenue is money actually collected, while the custom figure is
        work booked (Notion holds no per-payment dates, so a custom payment
        can't be attributed to the month it was made).
      required: [month, shopRevenue, shopOrders, customBooked, customOrders]
      properties:
        month:
          type: string
          description: The month as YYYY-MM.
        shopRevenue:
          type: number
          description: >-
            Dollars taken on shop orders placed that month (order totals,
            including shipping and tax; cancelled orders excluded).
        shopOrders:
          type: integer
          description: Shop orders placed that month (cancelled excluded).
        customBooked:
          type: number
          description: >-
            Dollars invoiced on custom orders placed that month (each order's
            invoice Final Balance). Zero for orders not yet itemized.
        customOrders:
          type: integer
          description: Custom orders placed that month (cancelled excluded).
    StudioPaymentTotals:
      type: object
      description: >-
        Deposits against balances across every custom-order invoice on a live
        (non-cancelled) order — what has been collected and what is still out.
      required:
        [
          invoicedTotal,
          collectedTotal,
          outstandingTotal,
          depositsCollected,
          depositsOutstanding,
          balancesCollected,
          balancesOutstanding,
          invoiceCount,
          unpaidInvoiceCount,
        ]
      properties:
        invoicedTotal:
          type: number
          description: The sum of every invoice's Final Balance.
        collectedTotal:
          type: number
          description: Deposits plus balances marked paid.
        outstandingTotal:
          type: number
          description: Deposits plus balances still to collect.
        depositsCollected:
          type: number
        depositsOutstanding:
          type: number
          description: Deposit amounts set on an invoice but not yet paid.
        balancesCollected:
          type: number
          description: >-
            Final balances marked paid, net of the deposits already credited
            against them (that is what the balance stage actually charges).
        balancesOutstanding:
          type: number
          description: >-
            What is still owed on unpaid balances beyond every deposit scheduled
            against them — so this and depositsOutstanding add up to
            outstandingTotal without counting the same dollar twice. A paid
            balance settles its invoice outright and leaves nothing here.
        invoiceCount:
          type: integer
        unpaidInvoiceCount:
          type: integer
          description: Invoices with money still outstanding.
    StudioTopItem:
      type: object
      description: >-
        One best-selling shop piece. The count is orders containing the piece,
        not units — the order's inventory relation records which pieces were
        bought, not how many of each.
      required: [name, orders]
      properties:
        name:
          type: string
        orders:
          type: integer
    StudioToolRequest:
      type: object
      description: >-
        The arguments for one internal tool run. Every field is optional here
        because each tool takes a different subset; the server rejects a run that
        is missing what its own tool needs. This replaces the query string of the
        retired `?secret=` links, so the argument names mirror them.
      properties:
        orderNumber:
          type: string
          maxLength: 64
          description: >-
            The order the tool acts on — `ORD-…` for a custom order, `SHP-…` for
            a shop order. Required by `invoice-lines`, `status-email` and the
            two refunds; `milestones` sweeps the whole pipeline and
            `restock-alert` takes an optional `item` instead.
        force:
          type: boolean
          description: >-
            `status-email` only. Resend the status update even when the order
            hasn't moved forward since the customer was last emailed. A forced
            resend never rewinds the high-water marker.
        amount:
          type: number
          minimum: 0
          description: >-
            `return-refund` only. The TARGET total to have refunded on the
            order, in dollars — not an increment, so a repeated run can't
            double-refund. Omit to refund in full.
        item:
          type: string
          maxLength: 200
          description: >-
            `restock-alert` only, and optional even there. The exact `Item Name`
            of one inventory row to alert on, as it appears in Notion — the same
            text a back-in-stock request stores. Omit it to sweep every piece
            that is currently in stock, which is what the nightly run does.
    StudioToolRun:
      type: object
      description: >-
        The outcome of one internal tool run, already composed for display. The
        server owns the wording — it is the same summary the retired
        confirmation pages rendered — so the dashboard renders the result rather
        than re-deriving it from per-tool fields.
      required: [tool, status, title, message, details]
      properties:
        tool:
          $ref: "#/components/schemas/StudioTool"
        status:
          type: string
          enum: [ok, noop, attention]
          description: >-
            `ok` — the tool did something. `noop` — there was nothing to do
            (every tool is idempotent, so this is the normal result of a repeat
            run). `attention` — the run completed but left something for the
            atelier to fix, e.g. a refund Stripe rejected, which leaves the order
            uncancelled so a re-run can retry it. A failure the tool couldn't
            start at all is an HTTP error, not a status here.
        title:
          type: string
          description: A short headline for the result, e.g. "Invoice itemized".
        message:
          type: string
          description: One sentence summarizing what happened.
        details:
          type: array
          description: >-
            Any per-item notes worth showing under the message — payments that
            were skipped, reasons a send was suppressed. Empty when there is
            nothing to add.
          items:
            type: string
    StudioTool:
      type: string
      description: >-
        Which internal tool to run. Each names an action the atelier used to
        trigger by opening a shared-secret link from Notion — or, for
        `restock-alert`, one that would have needed such a link.
      enum:
        - milestones
        - invoice-lines
        - status-email
        - cancellation-refund
        - return-refund
        - restock-alert
