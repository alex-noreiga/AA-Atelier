openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Customer order status lookup
  - name: contact
    description: Customer contact messages
  - name: products
    description: Shop inventory (ready-to-ship items)
  - name: notify
    description: Back-in-stock notification requests
  - name: newsletter
    description: Marketing newsletter / mailing-list opt-in
  - name: checkout
    description: Stripe checkout for ready-to-ship shop items
  - name: appointments
    description: Customer appointment scheduling with atelier staff
  - name: account
    description: Passwordless customer account portal (magic-link sign-in)
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders/{orderNumber}:
    get:
      operationId: getOrderStatus
      tags: [orders]
      summary: Get order status
      description: Look up a customer's dress order status by order number
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatus"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Submit a new custom dress order
      description: Creates a new custom dress order and saves it to Notion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrderRequest"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewOrderResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderNumber}/payments/{stage}:
    post:
      operationId: createOrderPayment
      tags: [orders]
      summary: Start a payment for a custom order (deposit or balance)
      description: >-
        Creates a Stripe Checkout session for one payment stage of a custom
        order — the first deposit, the second deposit, or the final balance —
        each priced server-side from the atelier's Notion invoice, and returns
        the hosted-checkout URL for the browser to redirect to. Deposits are
        untaxed; the balance (itemized materials + labor minus the deposits
        already paid) is taxed. Fails if the stage has no amount set, is already
        paid, or — for the balance — the invoice isn't ready.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
        - name: stage
          in: path
          required: true
          description: Which payment to start.
          schema:
            type: string
            enum: [first_deposit, second_deposit, balance]
      responses:
        "201":
          description: Payment checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSessionResponse"
        "400":
          description: Nothing is due for this stage, or the invoice isn't ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderNumber}/measurement-change-requests:
    post:
      operationId: createMeasurementChangeRequest
      tags: [orders]
      summary: Request a change to an order's measurements
      description: >-
        Files a customer's request to change the measurements on an existing
        order. The customer is verified against the email on the order, and the
        request is rejected once the garment has entered production. Accepted
        requests land as a tagged row in the Notion contact-messages inbox for
        the atelier to apply — this endpoint does not itself edit the order.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMeasurementChangeRequest"
      responses:
        "201":
          description: Change request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewMeasurementChangeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: Measurements are locked because the order is in production
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderNumber}/reviews:
    post:
      operationId: createOrderReview
      tags: [orders]
      summary: Leave a post-delivery review for an order
      description: >-
        Captures a customer's review of a finished custom order — a star
        rating, a short testimonial, an optional display name and photos of the
        finished piece — once the order has reached its final (delivered) stage.
        The customer is verified against the email on the order. Accepted
        reviews land in the Notion reviews database for the atelier to curate
        (and later feature in the portfolio). Photos are uploaded ahead of time
        via POST /orders/reference-images; their file_upload ids are passed as
        photoIds.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReviewRequest"
      responses:
        "201":
          description: Review received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewReviewResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: The order has not been delivered yet, so it can't be reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{orderNumber}/cancellation-requests:
    post:
      operationId: createOrderCancellationRequest
      tags: [orders]
      summary: Request cancellation of a custom order
      description: >-
        Files a customer's request to cancel a custom order. The customer is
        verified against the email on the order, and the request is rejected
        once the order has already been delivered (a delivered order is a return,
        not a cancellation). Accepted requests land as a tagged row in the Notion
        contact-messages inbox for the atelier to review — this endpoint does not
        itself refund or change the order; the atelier processes the refund.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCancellationRequest"
      responses:
        "201":
          description: Cancellation request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewCancellationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "409":
          description: The order has already been delivered, so it can't be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /contact:
    post:
      operationId: createContactMessage
      tags: [contact]
      summary: Submit a contact message
      description: Saves a customer inquiry to the Notion contact-messages database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewContactRequest"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewContactResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /notify:
    post:
      operationId: createBackInStockRequest
      tags: [notify]
      summary: Request a back-in-stock notification
      description: >-
        Saves a customer's request to be told when a sold-out shop item is back
        in stock, to the Notion back-in-stock database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNotifyRequest"
      responses:
        "201":
          description: Request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewNotifyResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /newsletter:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Opt in to the marketing newsletter
      description: >-
        Records a customer's opt-in to the studio's marketing mailing list as a
        tagged row in the Notion contact-messages inbox (and a best-effort Client
        CRM lead), and sends a best-effort welcome email. Separate from the
        transactional-only capture: this is explicit marketing consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNewsletterRequest"
      responses:
        "201":
          description: Subscription received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewNewsletterResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List shop products
      description: >-
        Returns published, in-stock shop items from the Notion inventory
        database, grouped into cards with selectable variants.
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /checkout:
    post:
      operationId: createCheckoutSession
      tags: [checkout]
      summary: Create a Stripe Checkout session for shop items
      description: >-
        Validates the requested in-stock shop items against live Notion
        inventory, prices them server-side (the client never sends prices), and
        creates a Stripe Checkout session. Returns the hosted-checkout URL for
        the browser to redirect to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutSessionRequest"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: One or more items are not purchasable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /checkout/session/{sessionId}:
    get:
      operationId: getCheckoutSession
      tags: [checkout]
      summary: Get a checkout session's status
      description: >-
        Returns the payment status of a Stripe Checkout session, used by the
        post-purchase success page to confirm the order.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionStatus"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /shop-orders/{orderNumber}:
    get:
      operationId: getShopOrderStatus
      tags: [checkout]
      summary: Look up a shop order's fulfilment status
      description: >-
        Returns the current fulfilment status of a ready-to-wear shop order by
        its human-readable order number (issued at checkout), along with the
        live list of possible statuses so the client can render a timeline.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shop order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrderStatus"
        "404":
          description: No shop order with that number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
  /shop-orders/{orderNumber}/cancellation-requests:
    post:
      operationId: createShopOrderCancellationRequest
      tags: [checkout]
      summary: Request cancellation of a shop order
      description: >-
        Files a customer's request to cancel a ready-to-wear shop order. The
        customer is verified against the email on the order. Accepted requests
        land as a tagged row in the Notion contact-messages inbox for the atelier
        to review — this endpoint does not itself refund or change the order; the
        atelier processes the refund.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCancellationRequest"
      responses:
        "201":
          description: Cancellation request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewCancellationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No shop order with that number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /shop-orders/{orderNumber}/return-requests:
    post:
      operationId: createReturnRequest
      tags: [checkout]
      summary: Request a return or exchange for a shop order
      description: >-
        Files a customer's request to return or exchange a ready-to-wear shop
        order. The customer is verified against the email on the order. Accepted
        requests land as a tagged row in the Notion contact-messages inbox for
        the atelier to review and action — this endpoint does not itself refund
        or edit the order.
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReturnRequest"
      responses:
        "201":
          description: Return/exchange request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewReturnResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The email does not match the one on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No shop order with that number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFound"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments/options:
    get:
      operationId: getAppointmentOptions
      tags: [appointments]
      summary: List bookable appointment types
      description: >-
        Returns the appointment types a customer can book — each with its
        duration, the staff who offer it, and the locations it's available in —
        plus the atelier's booking timezone. Drives the booking form's pickers.
      responses:
        "200":
          description: Booking options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentOptions"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments/availability:
    get:
      operationId: getAppointmentAvailability
      tags: [appointments]
      summary: List open appointment slots
      description: >-
        Returns the open start times for the given appointment type, location,
        and (optionally) staff member over a date window, computed from each
        staff member's configured working hours minus their Google Calendar
        free/busy. Slot times are UTC instants to be rendered in the returned
        timezone.
      parameters:
        - name: typeId
          in: query
          required: true
          schema:
            type: string
        - name: location
          in: query
          required: true
          schema:
            type: string
            enum: [in-person, virtual]
        - name: staff
          in: query
          required: false
          description: A specific staff member's name; omit for no preference.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: >-
            First day of the window as YYYY-MM-DD in the atelier timezone.
            Defaults to today.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: days
          in: query
          required: false
          description: Number of days in the window. Defaults to 14.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentAvailability"
        "400":
          description: Unknown or unavailable type/location/staff combination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments:
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Book an appointment
      description: >-
        Books an open slot for a customer. The server re-validates the type,
        location, and staff, re-checks that the slot is still free (all derived
        server-side, never trusting the client), writes the appointment as a
        Google Calendar event (inviting the customer, with a Meet link for
        virtual), and emails a confirmation. Fails if the slot is no longer
        available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAppointmentRequest"
      responses:
        "201":
          description: Appointment booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewAppointmentResponse"
        "400":
          description: Validation error or the slot is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments/manage:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Look up a booked appointment for self-service management
      description: >-
        Returns the current details of a booked appointment, identified by the
        signed token embedded in the "manage your appointment" link the
        confirmation email carries. Read live from Google Calendar, so it
        reflects the latest state (including a cancellation). Drives the
        reschedule / cancel page.
      parameters:
        - name: token
          in: query
          required: true
          description: The signed token from the manage link.
          schema:
            type: string
      responses:
        "200":
          description: The appointment's current details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentDetails"
        "400":
          description: The token is missing, invalid, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No such appointment — it may have been cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments/reschedule:
    post:
      operationId: rescheduleAppointment
      tags: [appointments]
      summary: Reschedule a booked appointment to a new open slot
      description: >-
        Moves the appointment identified by the signed token to a new start
        time. The server re-checks the slot is still free for the same staff
        member, type, and location (never trusting the client), updates the
        Google Calendar event (re-notifying the customer), and emails a
        confirmation. Fails if the slot is no longer available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleAppointmentRequest"
      responses:
        "200":
          description: The appointment's new details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentDetails"
        "400":
          description: Invalid token, or the slot is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No such appointment — it may have been cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The appointment has already started or been cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /appointments/cancel:
    post:
      operationId: cancelAppointment
      tags: [appointments]
      summary: Cancel a booked appointment
      description: >-
        Cancels the appointment identified by the signed token, deleting the
        Google Calendar event (which frees the slot and notifies the customer)
        and emailing a confirmation. Idempotent — cancelling an
        already-cancelled appointment still succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAppointmentRequest"
      responses:
        "200":
          description: The appointment was cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: The token is missing, invalid, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /account/login:
    post:
      operationId: requestMagicLink
      tags: [account]
      summary: Request a passwordless sign-in link
      description: >-
        Emails the customer a one-time magic link that signs them into the
        account portal. Always responds 200 regardless of whether any orders
        exist for the address — identity is the email itself, so there is no
        account to enumerate. The email is sent best-effort; a mail outage never
        fails the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "200":
          description: Sign-in link sent (if the mailer is configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /account/overview:
    get:
      operationId: getAccountOverview
      tags: [account]
      summary: The signed-in customer's orders and shop orders
      description: >-
        Returns everything tied to the signed-in customer's email — their custom
        orders and their ready-to-wear shop orders — for the account dashboard.
        Requires a valid session cookie (set by the magic-link verify step);
        responds 401 when the caller isn't signed in.
      responses:
        "200":
          description: The customer's account overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOverview"
        "401":
          description: Not signed in (missing or expired session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /account/logout:
    post:
      operationId: logoutAccount
      tags: [account]
      summary: Sign out of the account portal
      description: Clears the session cookie. Idempotent — safe to call when already signed out.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrderStatus:
      type: object
      properties:
        orderNumber:
          type: string
        orderName:
          type: string
        currentStage:
          type: string
        stages:
          type: array
          items:
            type: string
        deposits:
          type: array
          description: >-
            The custom order's staged deposits, sourced from the atelier's Notion
            invoice. One entry per deposit the atelier has set an amount for
            (first, then second); each is payable online until paid. Absent/empty
            until the atelier has created the invoice and set a deposit amount.
          items:
            $ref: "#/components/schemas/InvoiceDeposit"
        measurementsLocked:
          type: boolean
          description: >-
            True once the garment has reached the production stage at/after which
            measurements are frozen (MEASUREMENT_LOCK_FROM_STAGE). When true, a
            measurement-change request would be rejected, so the UI hides the
            request affordance.
        estimatedCompletion:
          type: string
          description: >-
            The atelier's target completion date for this custom order (the
            order's Due Date), as an ISO date (yyyy-mm-dd). A response
            pass-through, kept as a string (no format: date) so it isn't coerced
            to a Date and reserialized to a UTC timestamp. Absent until the
            atelier sets one in Notion.
        milestones:
          type: array
          description: >-
            Per-stage target completion dates from the Production Schedule,
            present once the order's milestones have been generated. One entry
            per remaining (current + upcoming) stage; completed stages have none.
            Order is not significant — match by stage name.
          items:
            type: object
            required:
              - stage
              - targetDate
            properties:
              stage:
                type: string
              targetDate:
                type: string
                description: >-
                  ISO date (yyyy-mm-dd). A pass-through string (no format: date),
                  same as estimatedCompletion.
        invoice:
          $ref: "#/components/schemas/Invoice"
        cancelled:
          type: boolean
          description: >-
            True once the atelier has cancelled the order (the `Cancelled`
            marker on the Notion order). When true the tracking page shows a
            cancelled banner and suppresses the deposit / invoice / request
            affordances. Absent/false for an active order.
      required:
        - orderNumber
        - orderName
        - currentStage
        - stages
        - measurementsLocked
        - measurementsLocked
    Invoice:
      type: object
      description: >-
        The customer's invoice for a custom order, present only once the atelier
        has itemized it and flipped the "Invoice Ready" gate. Line items and
        deposits are dollars; balanceDue is what's charged online.
      required:
        - invoiceId
        - paid
        - lineItems
        - subtotal
        - depositsCreditedTotal
        - balanceDue
      properties:
        invoiceId:
          type: string
          description: The atelier's invoice identifier (its Notion title).
        paid:
          type: boolean
          description: Whether the final balance has already been paid.
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
          description: >-
            The itemized charges (deposit lines excluded — deposits are credited
            via OrderStatus.deposits, not itemized here).
        subtotal:
          type: number
          description: Sum of the non-deposit line items, in dollars.
        depositsCreditedTotal:
          type: number
          description: Sum of the deposits already paid, in dollars.
        balanceDue:
          type: number
          description: subtotal − depositsCreditedTotal, floored at 0, in dollars.
        paymentDeadline:
          type: string
          description: The invoice's payment-due date (ISO), if the atelier set one.
    InvoiceLineItem:
      type: object
      required:
        - name
        - type
        - amount
      properties:
        name:
          type: string
          description: The line item's short name (e.g. "Main fabric").
        type:
          type: string
          description: The line type — Garment, Material, Labor, or Adjustment.
        amount:
          type: number
          description: The line total in dollars.
    InvoiceDeposit:
      type: object
      required:
        - stage
        - label
        - amount
        - paid
      properties:
        stage:
          type: string
          enum: [first_deposit, second_deposit]
          description: Which deposit this is — the payment stage used to pay it.
        label:
          type: string
          description: A display label, e.g. "First deposit".
        amount:
          type: number
          description: The deposit amount in dollars.
        paid:
          type: boolean
          description: Whether this deposit has been paid (only paid ones credit).
        sessionId:
          type: string
          description: >-
            The Stripe Checkout session id of this paid deposit, for linking to
            the on-site receipt. Present once the deposit has been paid.
    OrderNotFound:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ShopOrderStatus:
      type: object
      properties:
        orderNumber:
          type: string
        status:
          type: string
          description: The order's current fulfilment status.
        statuses:
          type: array
          description: >-
            The live ordered list of possible fulfilment statuses (read from the
            Notion "Status" workflow options), so the client can render a
            progress timeline. Never hardcode this list.
          items:
            type: string
        total:
          type: number
          description: The order total in dollars.
        cancelled:
          type: boolean
          description: >-
            True once the atelier has cancelled the shop order (the `Cancelled`
            marker on the Notion order). When true the tracking page shows a
            cancelled banner and suppresses the request affordance. Absent/false
            for an active order.
      required:
        - orderNumber
        - status
        - statuses
    NewOrderRequest:
      type: object
      required:
        - fullName
        - email
        - phone
        - preferredContact
      description: >-
        A new custom-dress order. Measurements are optional: the customer either
        supplies all five now (with a measurementUnit), or sets
        measurementAppointment=true to have them taken at a scheduled fitting or
        consultation. The server rejects a body with neither.
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
        preferredContact:
          type: string
          enum: [email, phone, text]
        waist:
          type: number
          minimum: 0
        bust:
          type: number
          minimum: 0
        hips:
          type: number
          minimum: 0
        height:
          type: number
          minimum: 0
        bodyGirth:
          type: number
          minimum: 0
        measurementUnit:
          type: string
          enum: [inches, cm]
        measurementAppointment:
          type: boolean
          description: >-
            True when the customer opted to have their measurements taken at a
            scheduled fitting or consultation instead of entering them now. When
            true the measurement fields are omitted.
        description:
          type: string
        neededBy:
          type: string
          format: date
        rush:
          type: boolean
          description: >-
            True when the customer confirmed a rush order — a neededBy date
            inside the studio's rush window, acknowledged with the disclosed
            surcharge. Recorded on the Notion order (a "Rush Order" checkbox +
            a page note) so the atelier prices the rush surcharge into the
            invoice; the app does not compute the fee itself. Optional; omitted
            for standard-timeline orders.
        referenceImageIds:
          type: array
          items:
            type: string
          description: >-
            Notion file_upload ids for customer-supplied reference / inspiration
            images, each obtained by first POSTing the image bytes to
            POST /orders/reference-images (a binary endpoint outside this
            contract, mounted like the Stripe webhook). They are attached to the
            order's Notion page as image blocks. Optional; omitted when the
            customer uploaded none.
        referralCode:
          type: string
          description: >-
            An optional referral code the customer received from another skater.
            The server looks it up against the Client CRM (best-effort): a valid
            code — not the customer's own — earns the new customer a welcome
            discount code now and credits the referrer once this order is first
            paid. An unknown or self-referring code is ignored, and referral
            capture never blocks the order. Optional.
    NewOrderResponse:
      type: object
      required:
        - orderNumber
      properties:
        orderNumber:
          type: string
    NewMeasurementChangeRequest:
      type: object
      required:
        - email
      description: >-
        A request to change an order's measurements. Like a new order,
        measurements are optional: the customer either supplies all five now
        (with a measurementUnit), or sets measurementAppointment=true to be
        re-measured at a fitting/consultation. The server rejects a request with
        neither.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match the order is rejected.
        waist:
          type: number
          minimum: 0
        bust:
          type: number
          minimum: 0
        hips:
          type: number
          minimum: 0
        height:
          type: number
          minimum: 0
        bodyGirth:
          type: number
          minimum: 0
        measurementUnit:
          type: string
          enum: [inches, cm]
        measurementAppointment:
          type: boolean
          description: >-
            True when the customer would rather be re-measured at a fitting or
            consultation than enter values now. When true the measurement fields
            are omitted.
        note:
          type: string
          description: Optional free-text note explaining the requested change.
    NewMeasurementChangeResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    NewCancellationRequest:
      type: object
      required:
        - email
      description: >-
        A request to cancel an order. The email is verified against the one on
        the order; a request whose email doesn't match is rejected. An optional
        reason is passed through to the atelier for context.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match the order is rejected.
        reason:
          type: string
          maxLength: 2000
          description: Optional free-text reason for the cancellation.
    NewCancellationResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    NewReviewRequest:
      type: object
      required:
        - email
        - rating
        - comment
      description: >-
        A post-delivery review of a finished custom order. The customer supplies
        a star rating and a short testimonial; a display name, publish consent,
        and photos of the finished piece are optional. The server verifies the
        email against the order and only accepts the review once the order has
        been delivered.
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A review whose
            email doesn't match the order is rejected.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The star rating, 1 (poor) to 5 (excellent).
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          description: The customer's testimonial about their finished piece.
        displayName:
          type: string
          maxLength: 120
          description: >-
            How the customer would like to be credited if the review is
            featured (e.g. "Ada L." or "Ada, Chicago"). Optional.
        consentToPublish:
          type: boolean
          description: >-
            Whether the customer gives permission to feature this review (and
            any photos) publicly, e.g. on the site's testimonials/portfolio.
            Defaults to false.
        photoIds:
          type: array
          description: >-
            Notion file_upload ids for photos of the finished piece, uploaded
            ahead of time via POST /orders/reference-images. Attached to the
            review's Notion page as image blocks.
          items:
            type: string
    NewReviewResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    NewContactRequest:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        message:
          type: string
          minLength: 1
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never see or
            fill; a non-empty value marks the submission as spam and it is
            silently dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when the client can't measure it (treated as human).
    NewContactResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NewNotifyRequest:
      type: object
      required:
        - email
        - item
      properties:
        email:
          type: string
          format: email
        item:
          type: string
          minLength: 1
          description: The sold-out variant's name, e.g. "Bow Fleece Soaker — Black".
        size:
          type: string
          description: >-
            Set only when the customer asked about one specific sold-out size
            band; absent when the whole variant is sold out.
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never fill; a
            non-empty value marks the submission as spam and it is silently
            dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when unmeasurable (treated as human).
    NewNotifyResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NewNewsletterRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        source:
          type: string
          description: >-
            Where the opt-in came from, e.g. "footer" or "order form". Recorded
            for the atelier's own segmentation; the customer never sees it.
        website:
          type: string
          description: >-
            Anti-spam honeypot. A hidden field that real visitors never fill; a
            non-empty value marks the submission as spam and it is silently
            dropped. Always send empty (or omit).
        elapsedMs:
          type: integer
          minimum: 0
          description: >-
            Anti-spam timing signal: milliseconds the visitor spent on the form
            before submitting. Implausibly fast submissions are dropped. Omit
            when unmeasurable (treated as human).
    NewNewsletterResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NewReturnRequest:
      type: object
      required:
        - email
        - kind
        - reason
      description: >-
        A request to return or exchange a ready-to-wear shop order. The server
        verifies the email against the one on the order; the atelier reviews and
        actions accepted requests by hand (this endpoint never refunds or edits
        the order).
      properties:
        email:
          type: string
          format: email
          description: >-
            The email to verify against the one on the order. A request whose
            email doesn't match the order is rejected.
        kind:
          type: string
          enum: [return, exchange]
          description: Whether the customer wants a refund (return) or a swap (exchange).
        reason:
          type: string
          enum: [wrong_size, damaged, not_as_expected, changed_mind, other]
          description: Why the customer is returning or exchanging the item.
        items:
          type: string
          description: >-
            Which piece(s) the request covers, in the customer's own words.
            Optional — the atelier can also read the order in Notion.
        exchangeFor:
          type: string
          description: >-
            For an exchange, the size/colour/piece the customer wants instead.
            Ignored for a return.
        note:
          type: string
          description: Optional free-text note with anything else the atelier should know.
    NewReturnResponse:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    ProductVariant:
      type: object
      required:
        - id
        - name
        - available
        - photos
        - sizes
      properties:
        id:
          type: string
        name:
          type: string
        available:
          type: boolean
        price:
          type: number
        description:
          type: string
        photos:
          type: array
          items:
            type: string
        sizes:
          type: array
          description: >-
            Every size band this item is offered in ("Sizes Offered" in Notion),
            each flagged with whether it is currently in stock ("Sizes
            Available"). A size that is offered but not available is sold out,
            and the shop offers a per-size back-in-stock request. Empty for
            one-size items (soakers, cloths).
          items:
            $ref: "#/components/schemas/SizeOption"
        quantityAvailable:
          type: number
        addOnIds:
          type: array
          description: >-
            Ids of other ProductVariants offered as matching add-ons for this
            variant (the "Matching Add-ons" self-relation in the Notion
            inventory database) — e.g. a skate soaker points at its matching
            blade towel. Each id is the `id` of a ProductVariant that also
            appears in this same product list, so clients resolve the add-on's
            name/price/availability locally rather than the payload carrying it
            twice. Empty or absent when the variant has no add-ons.
          items:
            type: string
    SizeOption:
      type: object
      required:
        - name
        - available
      properties:
        name:
          type: string
          description: A size band, e.g. "Adult M".
        available:
          type: boolean
          description: False when the size is offered but currently sold out.
    Product:
      type: object
      required:
        - id
        - title
        - category
        - sized
        - variants
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        sized:
          type: boolean
          description: >-
            Whether this product's category should show the ready-to-wear body-
            measurement size guide. Computed server-side from the Notion "Product
            Categories" database (a "Show size guide" checkbox per category) when
            configured, otherwise from a built-in fallback list. Clients render
            the size chart from this flag and must not hardcode which categories
            are sized.
        sizeGuide:
          type: string
          enum:
            - garment
            - soaker
          description: >-
            Which size chart this product's category uses. "garment" (the
            default, and the value when this field is omitted) is the ready-to-
            wear body-measurement chart; "soaker" is the skate-soaker blade-length
            chart. Resolved server-side from the Notion "Product Categories"
            database ("Size guide type" select per category, following the
            inventory `Category` relation) — clients pick the chart from this and
            must not hardcode which category is a soaker. Only meaningful when
            `sized` is true.
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
    ProductList:
      type: object
      required:
        - products
        - categories
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        categories:
          type: array
          description: >-
            The shop's category filters, read live from the Notion "Product
            Categories" database and returned in the order the atelier arranged
            them (its `Sort` field). Each inventory item links to its category
            through a `Category` relation. Editing the categories in Notion
            changes this list without a redeploy, so clients must not hardcode it.
          items:
            type: string
    CheckoutItem:
      type: object
      required:
        - variantId
        - quantity
      properties:
        variantId:
          type: string
          description: >-
            The Notion inventory page id of the variant being purchased (the
            `id` on a ProductVariant).
        size:
          type: string
          description: >-
            The selected size band, required when the variant is offered in
            sizes and omitted for one-size items.
        quantity:
          type: integer
          minimum: 1
    CreateCheckoutSessionRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CheckoutItem"
    CheckoutSessionResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: The Stripe-hosted checkout URL to redirect the browser to.
    PaymentSessionResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: The Stripe-hosted checkout URL for the payment.
    ReceiptLineItem:
      type: object
      required:
        - description
        - quantity
        - amount
      properties:
        description:
          type: string
        quantity:
          type: number
        amount:
          type: number
          description: The line total in dollars (unit price × quantity).
    CheckoutSessionStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: >-
            The Stripe payment status of the session, e.g. "paid", "unpaid", or
            "no_payment_required".
        orderNumber:
          type: string
          description: >-
            The human-readable shop order number (e.g. "SHP-…") the customer can
            use to track their order. Present for shop-cart orders; absent for
            custom-order payment sessions.
        kind:
          type: string
          description: >-
            What the session paid for — "shop" for a shop-cart order,
            "custom_payment" for a custom-order deposit or balance (from the
            session's metadata.kind). Lets the success page skip clearing the
            cart on a custom-order receipt view.
        email:
          type: string
          description: The customer's email, present once the session is complete.
        currency:
          type: string
          description: ISO currency code of the totals, e.g. "usd".
        lineItems:
          type: array
          description: The purchased items, for an on-site receipt.
          items:
            $ref: "#/components/schemas/ReceiptLineItem"
        amountSubtotal:
          type: number
          description: Items subtotal in dollars (before shipping and tax).
        amountShipping:
          type: number
          description: Shipping charged in dollars.
        amountTax:
          type: number
          description: Tax charged in dollars (Stripe Tax).
        amountTotal:
          type: number
          description: Grand total in dollars (items + shipping + tax).
    AppointmentType:
      type: object
      required:
        - id
        - name
        - durationMinutes
        - staff
        - locations
      properties:
        id:
          type: string
        name:
          type: string
        durationMinutes:
          type: integer
          description: How long the appointment runs, in minutes.
        description:
          type: string
        staff:
          type: array
          description: The staff members who offer this appointment type.
          items:
            type: string
        locations:
          type: array
          description: The locations this type is offered in.
          items:
            type: string
            enum: [in-person, virtual]
    AppointmentOptions:
      type: object
      required:
        - timezone
        - types
      properties:
        timezone:
          type: string
          description: >-
            IANA timezone the atelier's hours and slot times are expressed in,
            for the client to render slots and label the times.
        types:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentType"
    AvailabilitySlot:
      type: object
      required:
        - start
        - end
        - staff
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        staff:
          type: string
          description: The staff member who would take this slot.
    AppointmentAvailability:
      type: object
      required:
        - timezone
        - slots
      properties:
        timezone:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
    NewAppointmentRequest:
      type: object
      required:
        - typeId
        - location
        - start
        - fullName
        - email
      properties:
        typeId:
          type: string
        staff:
          type: string
          description: A specific staff member, or omitted for no preference.
        location:
          type: string
          enum: [in-person, virtual]
        start:
          type: string
          format: date-time
          description: >-
            The chosen slot's start instant, as returned by the availability
            endpoint.
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        preferredContact:
          type: string
          enum: [email, phone, text]
        notes:
          type: string
    NewAppointmentResponse:
      type: object
      required:
        - confirmationCode
        - type
        - staff
        - location
        - start
        - end
      properties:
        confirmationCode:
          type: string
        type:
          type: string
          description: The booked appointment type's display name.
        staff:
          type: string
        location:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meetingUrl:
          type: string
          description: >-
            The Google Meet link for a virtual appointment, when one was created.
        calendarLink:
          type: string
          description: A link to the booking's Google Calendar event.
    AppointmentDetails:
      type: object
      description: >-
        A booked appointment's current state, read live from Google Calendar for
        the self-service reschedule / cancel page.
      required:
        - status
        - confirmationCode
        - typeId
        - typeName
        - staff
        - location
        - locationLabel
        - start
        - end
        - timezone
        - canModify
      properties:
        status:
          type: string
          enum: [confirmed, cancelled]
          description: Whether the appointment is still on the calendar or was cancelled.
        timezone:
          type: string
          description: >-
            IANA timezone the atelier's hours and slot times are expressed in,
            for the client to render the appointment's times.
        confirmationCode:
          type: string
        typeId:
          type: string
          description: >-
            The appointment type's id, so the reschedule flow can re-query
            availability for the same type.
        typeName:
          type: string
        staff:
          type: string
        location:
          type: string
          enum: [in-person, virtual]
        locationLabel:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meetingUrl:
          type: string
          description: The Google Meet link for a virtual appointment, when one exists.
        canModify:
          type: boolean
          description: >-
            Whether the appointment can still be rescheduled or cancelled — false
            once it has started or been cancelled.
    RescheduleAppointmentRequest:
      type: object
      required:
        - token
        - start
      properties:
        token:
          type: string
          description: The signed token from the manage link.
        start:
          type: string
          format: date-time
          description: >-
            The new slot's start instant, as returned by the availability
            endpoint.
    CancelAppointmentRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The signed token from the manage link.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MessageResponse:
      type: object
      description: A generic human-readable acknowledgement.
      required: [message]
      properties:
        message:
          type: string
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: The email to send the one-time sign-in link to.
    AccountOverview:
      type: object
      description: >-
        Everything tied to the signed-in customer's email — the data the account
        dashboard renders.
      required: [email, customOrders, shopOrders, appointments]
      properties:
        email:
          type: string
          description: The signed-in customer's email.
        customOrders:
          type: array
          description: >-
            The customer's custom (bespoke) orders, newest-relevant first. Empty
            when none match the signed-in email.
          items:
            $ref: "#/components/schemas/AccountOrderSummary"
        shopOrders:
          type: array
          description: >-
            The customer's ready-to-wear shop orders. Empty when none match the
            signed-in email (older shop orders without an order number are omitted).
          items:
            $ref: "#/components/schemas/AccountShopOrderSummary"
        appointments:
          type: array
          description: >-
            The customer's upcoming appointments, read live from Google Calendar
            by the email stamped on each booking, soonest first. Empty when none
            are upcoming, when the calendar integration isn't configured, or (a
            best-effort read) when the calendar can't be reached. Bookings made
            before the customer email was stamped on the event are not listed.
          items:
            $ref: "#/components/schemas/AccountAppointmentSummary"
        referral:
          $ref: "#/components/schemas/AccountReferral"
    AccountReferral:
      type: object
      description: >-
        The signed-in customer's referral-program state. Present only when the
        Client CRM is configured (omitted entirely otherwise, so the dashboard's
        referral card simply doesn't render).
      required: [code]
      properties:
        code:
          type: string
          description: The customer's own shareable referral code.
        creditAmount:
          type: number
          description: >-
            The credit, in dollars, that a referred skater's first paid order
            earns this customer — shown in the share copy so the value is
            concrete.
        returningCode:
          type: string
          description: >-
            A standing personal discount code for this returning customer,
            present once they've earned it (a qualifying repeat order). Absent
            otherwise.
    AccountOrderSummary:
      type: object
      description: A custom order as shown on the account dashboard (links out to the full tracking + invoice views).
      required: [orderNumber, orderName, currentStage, stages]
      properties:
        orderNumber:
          type: string
        orderName:
          type: string
        currentStage:
          type: string
        stages:
          type: array
          description: The live ordered stage list, so the dashboard can show progress (e.g. "3 of 6").
          items:
            type: string
        estimatedCompletion:
          type: string
          description: >-
            The order's target completion date (its Due Date) as an ISO date
            (yyyy-mm-dd). A pass-through string (no format: date). Absent until
            the atelier sets one.
        measurements:
          $ref: "#/components/schemas/AccountMeasurements"
    AccountShopOrderSummary:
      type: object
      description: A ready-to-wear shop order as shown on the account dashboard.
      required: [orderNumber, status]
      properties:
        orderNumber:
          type: string
        status:
          type: string
          description: The order's current fulfilment status.
        total:
          type: number
          description: The order total in dollars, when recorded.
    AccountMeasurements:
      type: object
      description: >-
        The measurements on file for a custom order, read from the order's Notion
        properties. Absent when the customer chose to have measurements taken at a
        fitting, or for orders placed before measurements were stored as readable
        properties (those values remain only in the order's page body). Individual
        values may be absent for a partially-filled order.
      required: [unit]
      properties:
        unit:
          type: string
          enum: [inches, cm]
          description: The unit the measurement values are expressed in.
        waist:
          type: number
        bust:
          type: number
        hips:
          type: number
        height:
          type: number
        bodyGirth:
          type: number
    AccountAppointmentSummary:
      type: object
      description: >-
        An upcoming appointment as shown on the account dashboard. Mirrors
        AppointmentDetails and additionally carries a signed manage token so the
        dashboard can reschedule or cancel it in place through the existing
        appointment-manage endpoints (no separate manage-link navigation needed).
      required:
        - status
        - confirmationCode
        - typeId
        - typeName
        - staff
        - location
        - locationLabel
        - start
        - end
        - timezone
        - canModify
        - manageToken
      properties:
        status:
          type: string
          enum: [confirmed, cancelled]
        timezone:
          type: string
          description: IANA timezone the appointment's times are expressed in.
        confirmationCode:
          type: string
        typeId:
          type: string
        typeName:
          type: string
        staff:
          type: string
        location:
          type: string
          enum: [in-person, virtual]
        locationLabel:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        meetingUrl:
          type: string
          description: The Google Meet link for a virtual appointment, when one exists.
        canModify:
          type: boolean
          description: >-
            Whether the appointment can still be rescheduled or cancelled — false
            once it has started or been cancelled.
        manageToken:
          type: string
          description: >-
            A signed token (the same one the confirmation email's manage link
            carries) authorizing reschedule/cancel of this specific appointment
            via the appointment-manage endpoints.
