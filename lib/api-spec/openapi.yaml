  /studio/materials:
    get:
      operationId: getStudioMaterials
      tags: [studio]
      summary: Materials at or below their reorder point
      description: >-
        The atelier's materials inventory, split into what needs buying and what
        isn't being watched. The reorder points, the stock-on-hand formula and a
        restock-alert formula have existed in Notion since before the app did;
        this is the read that puts them somewhere they'll be seen.


        The trip is re-derived server-side from `Stock on Hand` vs
        `Minimum Stock` rather than read off the atelier's own restock-alert
        formula: a formula derived from rollups can't be filtered on through the
        Notion API, and its rendered value is display wording nobody promised to
        keep. Deriving it also yields the `shortfall` the list is ranked by.


        Two things are deliberately never alerts. A material whose stock formula
        produced no number is `stock-unknown` in `untracked` — absent is not
        zero, and "we have never counted" is not a reason to reorder. A material
        the atelier has muted is in neither list and only counted, so the numbers
        still add up.


        Same staff gate as the rest of the studio surface: 401 when not signed
        in, 404 when signed in but not staff, 403 when staff but not signed in
        with Google.
      security:
        - bearerAuth: []
      responses:
