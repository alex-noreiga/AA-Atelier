packages:
  - artifacts/*
  - lib/*
  - tests

allowBuilds:
  esbuild: true

autoInstallPeers: false

catalog:
  "@supabase/supabase-js": ^2.48.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.101.4
  "@types/node": ^26.1.2
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^6.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.28.0
  postgres: ^3.4.5
  react: 19.2.8
  react-dom: 19.2.8
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.3.3
  vite: ^8.1.5
  wouter: ^3.3.5
  zod: ^3.25.76

# Force a single Vite version across the workspace. vitest pulls Vite in as a
# peer, and with autoInstallPeers off that resolved to a second (v7) copy
# alongside the app's catalog v8 — two Vite instances break the shared Plugin
# type and the React JSX transform under Vitest. Pin every consumer to v8.
overrides:
  vite: "^8.1.5"

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild
