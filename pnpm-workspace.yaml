packages:
  - artifacts/*
  - lib/*
  - tests

allowBuilds:
  esbuild: true

autoInstallPeers: false

catalog:
  "@supabase/supabase-js": ^2.116.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.102.8
  "@types/node": ^26.5.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^0.545.0
  postgres: ^3.4.5
  react: 19.3.0
  react-dom: 19.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  vite: ^8.3.0
  wouter: ^3.11.0
  zod: ^3.25.76

# Force a single Vite version across the workspace. vitest pulls Vite in as a
# peer, and with autoInstallPeers off that resolved to a second (v7) copy
# alongside the app's catalog v8 — two Vite instances break the shared Plugin
# type and the React JSX transform under Vitest. Pin every consumer to v8.
overrides:
  vite: "^8.3.0"

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild
